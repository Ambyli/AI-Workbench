networks:
  shared:
    external: true
    name: ai_shared

services:
  # ── classifier-db: every row the classifier keeps ─────────────────────────
  # The job queue (jobs), saved references (reference_examples) and one row
  # per vision-model request (llm_calls) — in a networked database so Trino
  # can federate them. Same shape as roofix-db: on ai_shared, so
  # trino-coordinator reaches it by service DNS (the postgres_classifier
  # catalog) without joining anything else, and published on
  # PORT_CLASSIFIER_DB for psql / DBeaver. Its own container, not a schema in
  # supabase-db, so the job queue never depends on the Supabase stack.
  #
  # 10-trino-reader.sh runs once, on the first start of an EMPTY volume, and
  # creates the read-only `trino_reader` role from
  # CLASSIFIER_TRINO_READER_PASSWORD. Re-run it by hand for an existing volume
  # (the command is in the script's header).
  #
  # Recreated (with downtime) by `make up`: a data directory can have only one
  # Postgres.
  classifier-db:
    image: postgres:17-alpine
    container_name: classifier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CLASSIFIER_DB_USER:-classifier}
      POSTGRES_PASSWORD: ${CLASSIFIER_DB_PASSWORD:-classifier}
      POSTGRES_DB: ${CLASSIFIER_DB_NAME:-classifier}
      # Consumed by db-init/10-trino-reader.sh. Empty = the role is skipped
      # with a log line (only the Trino catalog breaks, never the classifier).
      TRINO_READER_USER: trino_reader
      TRINO_READER_PASSWORD: ${CLASSIFIER_TRINO_READER_PASSWORD:-}
    volumes:
      - classifier_db:/var/lib/postgresql/data
      - ./db-init/10-trino-reader.sh:/docker-entrypoint-initdb.d/10-trino-reader.sh:ro
    ports:
      - "${PORT_CLASSIFIER_DB:-5439}:5432"
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLASSIFIER_DB_USER:-classifier} -d ${CLASSIFIER_DB_NAME:-classifier}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Recreated (with downtime) by `make up`: on startup `recover()` requeues
  # every job left processing (ai/classifier/jobs/queue.py), which would steal
  # the running copy's jobs. No `ports:` -- PORT_CLASSIFIER is published by
  # ai/edge, which returns 503 + Retry-After while this container is being
  # recreated, instead of a refused connection. Same host port, same URL.
  # See ai/edge/EDGE.md.
  classifier:
    networks:
      - shared
    depends_on:
      classifier-db:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: ai/classifier/Dockerfile
    container_name: classifier
    restart: unless-stopped
    environment:
      # The MODELS are not configured here: every model a job or a criterion
      # may select (endpoint, served name, vision or text-only, images per
      # prompt, reasoning setting, token budgets, timeout, concurrency, text
      # budget) is an entry in ai/classifier/models.yaml, bind-mounted below
      # and served as GET /models. The VISION_LLM_* / CLASSIFIER_MAX_LLM_CALLS
      # / CLASSIFIER_HTTP_TIMEOUT_S / … variables it replaced are not read any
      # more (startup logs one WARNING if any is still set).
      #
      # API KEYS: an entry with `api_key_env: SOME_KEY` reads that variable
      # from THIS container's environment, so it must be listed here as
      #   - SOME_KEY=${SOME_KEY:-}
      # and set in .env. Unset or empty → the entry loads but is unavailable
      # (a request that selects it is a 400). None today: every entry is a
      # local vLLM service with no key.
      - LOG_LEVEL=INFO
      # The three process-wide concurrency limits: jobs at once,
      # (criterion, item) units one job evaluates at once, and OCR passes at
      # once. Model calls in flight are per MODEL (models.yaml
      # max_concurrent — muse-glimmer: 6 of its --max-num-seqs 8, leaving 2
      # for the LiteLLM chat chains). See API.md § Concurrency and durability.
      - CLASSIFIER_MAX_CONCURRENT=${CLASSIFIER_MAX_CONCURRENT:-4}
      - CLASSIFIER_MAX_UNITS_PER_JOB=${CLASSIFIER_MAX_UNITS_PER_JOB:-6}
      - CLASSIFIER_OCR_WORKERS=${CLASSIFIER_OCR_WORKERS:-4}
      # How often a running job's progress gauge is written to classifier-db
      # (metadata.progress + job_progress rows). See API.md § Progress.
      - CLASSIFIER_PROGRESS_FLUSH_INTERVAL_S=${CLASSIFIER_PROGRESS_FLUSH_INTERVAL_S:-1}
      # Document support: how many items (pages, across every document) one
      # request may carry, which OCR engine backs `text` criteria and scanned
      # PDFs, at what raster density a PDF page is rendered, and the
      # native-text threshold that decides "this page is a scan" under
      # options.ocr "auto". (How much extracted text a prompt may carry is
      # per model: models.yaml text_char_budget.) See the `## Classifier`
      # block in .env and ai/classifier/API.md § Documents.
      - CLASSIFIER_MAX_ITEMS=${CLASSIFIER_MAX_ITEMS:-20}
      - CLASSIFIER_OCR_ENGINE=${CLASSIFIER_OCR_ENGINE:-rapidocr}
      - CLASSIFIER_PDF_RENDER_DPI=${CLASSIFIER_PDF_RENDER_DPI:-150}
      - CLASSIFIER_OCR_MIN_NATIVE_CHARS=${CLASSIFIER_OCR_MIN_NATIVE_CHARS:-20}
      # SVG external images: MuPDF never fetches what an SVG links to. With
      # this on, the submit fetches each <image> link itself (SSRF-checked,
      # no redirects, PNG/JPEG only, bounded by count / bytes / seconds) and
      # inlines it before queueing. Off by default — every fetch is a beacon
      # to the SVG's author. See ai/classifier/API.md § External references in SVG.
      - CLASSIFIER_SVG_FETCH_IMAGES=${CLASSIFIER_SVG_FETCH_IMAGES:-false}
      - CLASSIFIER_SVG_FETCH_MAX_IMAGES=${CLASSIFIER_SVG_FETCH_MAX_IMAGES:-10}
      - CLASSIFIER_SVG_FETCH_MAX_BYTES=${CLASSIFIER_SVG_FETCH_MAX_BYTES:-5000000}
      - CLASSIFIER_SVG_FETCH_TIMEOUT_S=${CLASSIFIER_SVG_FETCH_TIMEOUT_S:-10}
      # The thumbnail guard: a page image under this on either axis is a 400.
      - CLASSIFIER_MIN_IMAGE_WIDTH=${CLASSIFIER_MIN_IMAGE_WIDTH:-32}
      - CLASSIFIER_MIN_IMAGE_HEIGHT=${CLASSIFIER_MIN_IMAGE_HEIGHT:-32}
      # Criterion input caps: longest criterion name, largest text min_count.
      - CLASSIFIER_CRITERION_NAME_MAX_CHARS=${CLASSIFIER_CRITERION_NAME_MAX_CHARS:-200}
      - CLASSIFIER_TEXT_MIN_COUNT_CAP=${CLASSIFIER_TEXT_MIN_COUNT_CAP:-1000}
      # Region layers: where the per-job artifact directories live on the
      # classifier_data volume, how often the sweeper prunes them (and the
      # job rows past JOB_TTL_HOURS), the byte cap PER ITEM (a job may hold
      # this × its item count), and how many
      # regions per criterion are copied inline into the job result. Every
      # job stores its regions and text layers; the layers render on first
      # fetch — see ai/classifier/API.md § Regions and layers.
      - CLASSIFIER_ARTIFACT_DIR=${CLASSIFIER_ARTIFACT_DIR:-/data/artifacts}
      - CLASSIFIER_ARTIFACT_SWEEP_INTERVAL_S=${CLASSIFIER_ARTIFACT_SWEEP_INTERVAL_S:-600}
      - CLASSIFIER_ARTIFACT_MAX_BYTES=${CLASSIFIER_ARTIFACT_MAX_BYTES:-50000000}
      - CLASSIFIER_INLINE_REGIONS_MAX=${CLASSIFIER_INLINE_REGIONS_MAX:-50}
      # The LLM bounding-box enforcement loop (an llm criterion's options.boxes): how many
      # ask/verify rounds a criterion gets, what the verify crop has to score
      # to be accepted, the box area bounds that reject a full-frame
      # non-answer, and the crop padding (the per-call token budget is per
      # model: models.yaml max_tokens.box). See the `## Classifier` block in
      # .env and API.md § The LLM enforcement loop.
      - CLASSIFIER_LLM_BBOX_MAX_ATTEMPTS=${CLASSIFIER_LLM_BBOX_MAX_ATTEMPTS:-3}
      - CLASSIFIER_LLM_BBOX_VERIFY_PASS=${CLASSIFIER_LLM_BBOX_VERIFY_PASS:-7}
      - CLASSIFIER_LLM_BBOX_MIN_AREA=${CLASSIFIER_LLM_BBOX_MIN_AREA:-0.002}
      - CLASSIFIER_LLM_BBOX_MAX_AREA=${CLASSIFIER_LLM_BBOX_MAX_AREA:-0.95}
      - CLASSIFIER_LLM_BBOX_CROP_PAD=${CLASSIFIER_LLM_BBOX_CROP_PAD:-0.25}
      # The loop's two accuracy aids: the labelled coordinate grid drawn on the
      # ask image (and its spacing), and the zoomed refine pass (how far it
      # zooms, and the smallest window it may use).
      - CLASSIFIER_LLM_BBOX_GRIDLINES=${CLASSIFIER_LLM_BBOX_GRIDLINES:-true}
      - CLASSIFIER_LLM_BBOX_GRID_STEP=${CLASSIFIER_LLM_BBOX_GRID_STEP:-100}
      - CLASSIFIER_LLM_BBOX_REFINE=${CLASSIFIER_LLM_BBOX_REFINE:-true}
      - CLASSIFIER_LLM_BBOX_REFINE_ZOOM=${CLASSIFIER_LLM_BBOX_REFINE_ZOOM:-2.5}
      - CLASSIFIER_LLM_BBOX_REFINE_MIN_SPAN=${CLASSIFIER_LLM_BBOX_REFINE_MIN_SPAN:-0.2}
      # Show a criterion's reference examples to the loop's ask, refine and
      # verify calls (each its own knob; off until measured with
      # bin/grounding_experiment.py). See API.md § The LLM enforcement loop.
      - CLASSIFIER_REFERENCE_BOX_ASK=${CLASSIFIER_REFERENCE_BOX_ASK:-false}
      - CLASSIFIER_REFERENCE_BOX_REFINE=${CLASSIFIER_REFERENCE_BOX_REFINE:-false}
      - CLASSIFIER_REFERENCE_BOX_VERIFY=${CLASSIFIER_REFERENCE_BOX_VERIFY:-false}
      # References — saved worked examples shown to the vision model beside a
      # candidate. Their own root on the classifier_data volume (never swept:
      # a reference is kept until DELETE, so the count cap bounds the disk),
      # the per-request / per-criterion caps, the `auto` selection, the
      # opt-in position check, and the generated page description. (How many
      # images one model request may carry — muse-glimmer's
      # --limit-mm-per-prompt — is per model: models.yaml
      # max_images_per_prompt.) See the `## Classifier` block in .env and
      # ai/classifier/API.md § References.
      - CLASSIFIER_REFERENCE_DIR=${CLASSIFIER_REFERENCE_DIR:-/data/references}
      - CLASSIFIER_REFERENCE_MAX_COUNT=${CLASSIFIER_REFERENCE_MAX_COUNT:-500}
      - CLASSIFIER_REFERENCE_MAX_PER_REQUEST=${CLASSIFIER_REFERENCE_MAX_PER_REQUEST:-10}
      - CLASSIFIER_REFERENCE_MAX_PER_CRITERION=${CLASSIFIER_REFERENCE_MAX_PER_CRITERION:-3}
      - CLASSIFIER_REFERENCE_AUTO_POOL_MAX=${CLASSIFIER_REFERENCE_AUTO_POOL_MAX:-20}
      - CLASSIFIER_REFERENCE_AUTO_MIN_CONFIDENCE=${CLASSIFIER_REFERENCE_AUTO_MIN_CONFIDENCE:-60}
      - CLASSIFIER_REFERENCE_POSITION_MIN_IOU=${CLASSIFIER_REFERENCE_POSITION_MIN_IOU:-0.3}
      - CLASSIFIER_REFERENCE_POSITION_MAX_OFFSET=${CLASSIFIER_REFERENCE_POSITION_MAX_OFFSET:-0.15}
      - CLASSIFIER_REFERENCE_POSITION_CAP=${CLASSIFIER_REFERENCE_POSITION_CAP:-5}
      - CLASSIFIER_REFERENCE_DESCRIBE=${CLASSIFIER_REFERENCE_DESCRIBE:-true}
      - CLASSIFIER_REFERENCE_DESCRIPTION_MAX_CHARS=${CLASSIFIER_REFERENCE_DESCRIPTION_MAX_CHARS:-500}
      # Open-vocabulary detector (ai/detector). DETECTOR_URL empty = off: a
      # `detector` criterion is then refused at submit, and a `cv` criterion
      # with no OpenCV detector falls back to the llm. Set it to
      # http://detector:8000 once that stack is up; the two containers meet on
      # ai_shared. See ai/detector/DETECTOR.md.
      - DETECTOR_URL=${DETECTOR_URL:-}
      - DETECTOR_MIN_SCORE=${DETECTOR_MIN_SCORE:-0.25}
      - DETECTOR_TIMEOUT_S=${DETECTOR_TIMEOUT_S:-30}
      - DETECTOR_MAX_LABELS_PER_CALL=${DETECTOR_MAX_LABELS_PER_CALL:-16}
      # Retention. Now enforced rather than informational: the sweeper
      # deletes a terminal job's artifact directory AND its row past this.
      - JOB_TTL_HOURS=${JOB_TTL_HOURS:-24}
      # The classifier-db Postgres above: the job queue, references and
      # model-usage rows. HOST and PORT are fixed (service DNS on ai_shared,
      # the container port); the credentials come from the `## Classifier`
      # block in .env with the same dev defaults classifier-db is created
      # with. It is the only store — an unreachable database fails
      # startup. See ai/classifier/API.md § Concurrency and durability.
      - CLASSIFIER_DB_HOST=classifier-db
      - CLASSIFIER_DB_PORT=5432
      - CLASSIFIER_DB_USER=${CLASSIFIER_DB_USER:-classifier}
      - CLASSIFIER_DB_PASSWORD=${CLASSIFIER_DB_PASSWORD:-classifier}
      - CLASSIFIER_DB_NAME=${CLASSIFIER_DB_NAME:-classifier}
      # What stays on FILES, on the classifier_data volume: queued jobs'
      # payloads (and the artifact / reference roots above, which default
      # under the same /data), plus the idle workers' fallback poll. Fixed
      # values, not ${…}: the names are generic enough that interpolating
      # them from the shared root .env could pick up another service's
      # setting. They equal config.py's defaults.
      - CLASSIFIER_DATA_DIR=/data
      - PAYLOAD_DIR=/data/payloads
      - WORKER_POLL_INTERVAL_S=1.0
    volumes:
      - classifier_data:/data
      # The model registry, read-only over the copy baked into the image (the
      # app reads /app/ai/classifier/models.yaml, next to its package). An
      # edit takes effect with `docker restart classifier` — the classifier
      # is recreate-class and compose cannot see a bind-mounted file change.
      # A file that does not validate stops the container at startup with
      # the reason in its log.
      - ./models.yaml:/app/ai/classifier/models.yaml:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  classifier_data:
  classifier_db:
