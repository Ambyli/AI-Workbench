# The classifier's model registry — every model a job or a criterion may
# select by id, validated at startup by llm/models.py and served (without
# secrets) as GET /models.
#
#   POST /assess {"model": "<id>"}            the job's model
#   criterion options.model: "<id>"            one llm criterion's model (or a
#                                              cv criterion's llm fallback)
#   POST /references {"model": "<id>"}         the creation job's model
#
# Precedence: a criterion's options.model, then the request's model, then
# `default` below. Nothing ever picks an external model on its own: the
# default is local, and an external entry is only used when a request names
# it. An external entry sends document pages and text to that provider —
# GET /models reports each entry's host so a caller can see where data goes.
#
# Editing this file on the box takes effect with `docker restart classifier`
# (it is bind-mounted read-only; the classifier is recreate-class, so compose
# cannot see the edit). A file that does not validate stops the container at
# startup with the reason in `docker logs classifier`.
#
# Fields (every one is checked; an unknown key is a startup error):
#
#   description            what it is and what it is good for (GET /models)
#   url                    the FULL chat-completions URL, http:// or https://
#   served_name            the request body's "model" (vLLM --served-model-name,
#                          or the provider's model name)
#   api_key_env            NAME of the env var holding the key; null = no auth.
#                          Keys are never in this file. The variable must also
#                          be listed in docker-compose.classifier.yml's
#                          `environment:` as `- NAME=${NAME:-}`. Unset or empty
#                          → the entry loads but is unavailable (selecting it
#                          is a 400; an unavailable default stops startup). A
#                          key on a plain http:// URL to a dotted host (an IP
#                          or a public name) is a startup error — keys only go
#                          over https, or to a service name on ai_shared.
#   api_key_header         "Authorization" (default) → "Bearer <key>"; any
#                          other header name carries the raw key
#   vision                 true = the model takes images. false = text only:
#                          it scores from the page's text layer alone, and
#                          boxes, references and visual cv fallbacks are
#                          refused at submit
#   max_images_per_prompt  images one request may carry; must match the
#                          server's --limit-mm-per-prompt. 3 = contrastive
#                          references (PASS + FAIL example + candidate), 2 =
#                          one example per call, 1 = no references. 0 (and
#                          only 0) for a text-only model
#   reasoning              how the reasoning depth is sent:
#                            {style: chat_template_kwargs, key: <var>, value: <v>}
#                              → "chat_template_kwargs": {<var>: <v>} in the
#                              body (Muse Glimmer: reasoning_strength; the
#                              qwen family: reasoning_effort)
#                            {style: system_line, value: "<line>"}
#                              → <line> appended to every system prompt, for a
#                              model whose template has no variable. Never for
#                              Muse Glimmer: a "reasoning strength" line in the
#                              system prompt OVERRIDES its template variable
#                            {style: none} (or null) → nothing sent
#   extra_body             merged into every request body (sampling, other
#                          chat_template_kwargs). May not set model, messages,
#                          the token field or response_format, nor the
#                          reasoning key itself (a load-time error, not a
#                          silent override)
#   json_mode              send response_format {"type": "json_object"}
#   token_param            max_tokens | max_completion_tokens (newer OpenAI)
#   max_tokens             the completion budget per call kind — score (the
#                          scoring call), box (one box-loop ask / refine /
#                          verify), select (references "auto"), describe (a
#                          reference's description). Reasoning tokens count
#                          against it before the JSON answer
#   timeout_s              seconds ONE request may take. Responses are not
#                          streamed, so it bounds the whole generation (queue
#                          + prefill + reasoning + answer). A timeout is not
#                          retried
#   max_concurrent         requests to THIS model in flight across every job
#                          (a slot per HTTP request; a retry takes a fresh one)
#   text_char_budget       characters of a page's text layer pasted into a
#                          scoring prompt; the rest is dropped and the prompt
#                          says so

default: muse-glimmer

models:
  muse-glimmer:
    description: >-
      Muse Glimmer 30B on vLLM (ai/vllm, GPU pair 0-1, shared with qwen3.8 —
      only one of the two runs at a time). Vision, 3 images per prompt:
      boxes, references and contrastive references. The default.
    url: http://muse-glimmer:8000/v1/chat/completions
    served_name: muse-glimmer
    api_key_env: null
    vision: true
    # Must match muse-glimmer's --limit-mm-per-prompt '{"image": 3}'.
    max_images_per_prompt: 3
    # The stock chat template reads `reasoning_strength` (low | medium |
    # high | xhigh; it defaults to high) and writes "Reasoning strength:
    # <value>." into the system text itself. `low` keeps every classifier call
    # cheap. Check what a request renders on the box with:
    #   curl -s muse-glimmer:8000/tokenize -H 'content-type: application/json' \
    #     -d '{"model":"muse-glimmer","messages":[{"role":"user","content":"hi"}],
    #          "chat_template_kwargs":{"reasoning_strength":"low"},"return_token_strs":true}'
    reasoning: {style: chat_template_kwargs, key: reasoning_strength, value: low}
    # No sampling overrides: --generation-config auto applies Meta's
    # published defaults, and the model card warns against greedy decoding.
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    max_tokens: {score: 8192, box: 1024, select: 2048, describe: 1024}
    # Not streamed: a scoring call that spends most of its 8192 tokens
    # reasoning in a full batch can pass two minutes.
    timeout_s: 240
    # muse-glimmer schedules 8 (--max-num-seqs 8). The classifier takes 6 and
    # leaves 2 for the LiteLLM chat chains muse-glimmer also serves: their
    # overflow hook spills chat to the next order (in the end, Claude) once
    # vLLM's waiting queue stays non-empty, so filling all 8 here would push
    # chat off the local model.
    max_concurrent: 6
    # ~15k tokens: a long contract cannot crowd out the image or the answer.
    text_char_budget: 60000

  qwen2.5-vl:
    description: >-
      Qwen2.5-VL-7B-Instruct on vLLM (the vllm-qwen-vl service in ai/vllm) —
      the old manual fallback for when muse-glimmer is not running. Vision,
      one image per prompt, so no references; an 8192-token context, so small
      budgets. Only answers while vllm-qwen-vl is up.
    url: http://vllm-qwen-vl:8000/v1/chat/completions
    served_name: Qwen/Qwen2.5-VL-7B-Instruct
    api_key_env: null
    vision: true
    # vLLM's default of one image per prompt (the service sets no
    # --limit-mm-per-prompt).
    max_images_per_prompt: 1
    reasoning: {style: none}
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    # --max-model-len 8192 covers prompt AND answer: one ~1000-px page is
    # ~1300 tokens, so the answer budgets and the text budget below leave the
    # prompt room. It does not reason, so the JSON answer is all a budget buys.
    max_tokens: {score: 1024, box: 256, select: 512, describe: 512}
    timeout_s: 120
    max_concurrent: 2
    text_char_budget: 8000

  qwen3.5-4b:
    description: >-
      Qwen3.5-4B (Q4_K_M) on llama.cpp, CPU only (the qwen3.5-4b service in
      ai/llama). Text only, no thinking. The model route-policy's
      llm_classifier evaluator scores conversation transcripts with — one
      text document per job, one presence criterion per route. Slow: seconds
      per call, tens of seconds for a long transcript, so not a document
      model.
    url: http://qwen3.5-4b:8000/v1/chat/completions
    served_name: qwen3.5-4b
    api_key_env: null
    vision: false
    max_images_per_prompt: 0
    reasoning: {style: none}
    # Qwen3.5 thinks by default and its template switches it with
    # enable_thinking — a boolean, which `reasoning.value` (a string) cannot
    # carry, so it rides here. The server's --chat-template-kwargs defaults
    # it off as well. Sampling is the server's (see the service's command).
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    json_mode: true
    token_param: max_tokens
    # score = the server's --n-predict 512 (it clamps anything larger); with
    # no thinking the JSON answer is all it buys. box / select / describe are
    # image work a text-only model is refused at submit — required, unused.
    max_tokens: {score: 512, box: 64, select: 64, describe: 64}
    # CPU prefill of a ~4k-token transcript plus the answer, with the other
    # slot busy.
    timeout_s: 90
    # = the server's --parallel 2: one slot per request in flight.
    max_concurrent: 2
    # ~3-4k tokens, well inside a 16k slot. route-policy's history.max_chars
    # must not exceed it.
    text_char_budget: 12000

  qwen3.8-solo:
    description: >-
      Qwen3.8-27B (AWQ INT4) on vLLM, one GPU (the qwen3.8-solo service in
      ai/vllm) — order 1 of LiteLLM's local-general / -code / -private
      chains and order 2 of local-reasoning. Text only, low reasoning. A
      benchmark candidate for route-policy's llm_classifier, not a document
      model: every call takes one of the 3 sequences chat runs on.
    url: http://qwen3.8-solo:8000/v1/chat/completions
    served_name: qwen3.8-solo
    api_key_env: null
    # LiteLLM declares no vision for it; the classifier sends it text only.
    vision: false
    max_images_per_prompt: 0
    # The shared fixed template (ai/jinja/qwen_fixed_chat_template.jinja)
    # reads reasoning_effort: none | minimal | low | medium | high | xhigh …
    # (unset = medium, what the chains send; local-code sends high). `low`
    # keeps thinking on, briefly; --reasoning-parser qwen3 strips it, so
    # `content` is the JSON alone.
    reasoning: {style: chat_template_kwargs, key: reasoning_effort, value: low}
    # No sampling overrides: vLLM's --generation-config auto applies the
    # checkpoint's generation_config.json, as for muse-glimmer.
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    # Reasoning counts against score first, as on muse-glimmer at `low`.
    max_tokens: {score: 8192, box: 1024, select: 2048, describe: 1024}
    timeout_s: 240
    # --max-num-seqs 3, and all three are chat's (order 1 of three chains).
    # One here: a classifier call that queues makes vllm:num_requests_waiting
    # positive, and the LiteLLM overflow hook then spills chat off this
    # model — to muse-glimmer, and on to Claude.
    max_concurrent: 1
    # ~15k tokens + the 8192 answer, far inside --max-model-len 131072.
    text_char_budget: 60000
