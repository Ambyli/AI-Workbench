# The classifier's model registry — every model a job or a criterion may
# select by id, validated at startup by llm/models.py and served (without
# secrets) as GET /models.
#
#   POST /assess {"model": "<id>"}            the job's model
#   criterion options.model: "<id>"            one llm criterion's model (or a
#                                              cv criterion's llm fallback)
#   POST /references {"model": "<id>"}         the creation job's model
#
# Precedence: a criterion's options.model, then the request's model, then
# `default` below. Nothing ever picks an external model on its own: the
# default is local, and an external entry is only used when a request names
# it. An external entry sends document pages and text to that provider —
# GET /models reports each entry's host so a caller can see where data goes.
#
# Editing this file on the box takes effect with `docker restart classifier`
# (it is bind-mounted read-only; the classifier is recreate-class, so compose
# cannot see the edit). A file that does not validate stops the container at
# startup with the reason in `docker logs classifier`.
#
# Fields (every one is checked; an unknown key is a startup error):
#
#   description            what it is and what it is good for (GET /models)
#   url                    the FULL chat-completions URL, http:// or https://
#   served_name            the request body's "model" (vLLM --served-model-name,
#                          or the provider's model name)
#   api_key_env            NAME of the env var holding the key; null = no auth.
#                          Keys are never in this file. The variable must also
#                          be listed in docker-compose.classifier.yml's
#                          `environment:` as `- NAME=${NAME:-}`. Unset or empty
#                          → the entry loads but is unavailable (selecting it
#                          is a 400; an unavailable default stops startup). A
#                          key on a plain http:// URL to a dotted host (an IP
#                          or a public name) is a startup error — keys only go
#                          over https, or to a service name on ai_shared.
#   api_key_header         "Authorization" (default) → "Bearer <key>"; any
#                          other header name carries the raw key
#   vision                 true = the model takes images. false = text only:
#                          it scores from the page's text layer alone, and
#                          boxes, references and visual cv fallbacks are
#                          refused at submit
#   max_images_per_prompt  images one request may carry; must not exceed the
#                          server's limit (entry <= server): vLLM's
#                          --limit-mm-per-prompt, whose default when the flag
#                          is unset is 999 images, not one. 3 = contrastive
#                          references (PASS + FAIL example + candidate), 2 =
#                          one example per call, 1 = no references. 0 (and
#                          only 0) for a text-only model
#   reasoning              how the reasoning depth is sent:
#                            {style: chat_template_kwargs, key: <var>, value: <v>}
#                              → "chat_template_kwargs": {<var>: <v>} in the
#                              body (Muse Glimmer: reasoning_strength; the
#                              qwen family: reasoning_effort)
#                            {style: system_line, value: "<line>"}
#                              → <line> appended to every system prompt, for a
#                              model whose template has no variable. Never for
#                              Muse Glimmer: a "reasoning strength" line in the
#                              system prompt OVERRIDES its template variable
#                            {style: none} (or null) → nothing sent
#   extra_body             merged into every request body (sampling, other
#                          chat_template_kwargs). May not set model, messages,
#                          the token field or response_format, nor the
#                          reasoning key itself (a load-time error, not a
#                          silent override)
#   json_mode              send response_format {"type": "json_object"}
#   token_param            max_tokens | max_completion_tokens (newer OpenAI)
#   max_tokens             the completion budget per call kind — score (the
#                          scoring call), box (one box-loop ask / refine /
#                          verify), select (references "auto"), describe (a
#                          reference's description). Reasoning tokens count
#                          against it before the JSON answer
#   timeout_s              seconds ONE request may take. Responses are not
#                          streamed, so it bounds the whole generation (queue
#                          + prefill + reasoning + answer). A timeout is not
#                          retried
#   max_concurrent         requests to THIS model in flight across every job
#                          (a slot per HTTP request; a retry takes a fresh one)
#   text_char_budget       characters of a page's text layer pasted into a
#                          scoring prompt; the rest is dropped and the prompt
#                          says so
#   confidence             OPTIONAL — how an llm result's confidence is
#                          MEASURED (detail.confidence) and which number is the
#                          headline `confidence`. No block = {method: stated}:
#                          nothing extra is requested, safe for any provider.
#                          Every model difference is a knob here, never code:
#     method               stated (default) | logprobs | sampling
#                            stated   the model's own 0-100 number only
#                            logprobs the score token's probability
#                                     distribution, from the response's token
#                                     log-probabilities. Known to work: vLLM,
#                                     llama.cpp, OpenAI non-reasoning chat
#                                     models. NOT available: Claude, OpenAI
#                                     reasoning models (o-series / gpt-5
#                                     reasoning) — use stated or sampling there.
#                                     Costs request/response size only
#                            sampling n answers to the same prompt; their
#                                     scores make the distribution, their
#                                     verdicts the `agreement`. Multiplies the
#                                     model's work by n — on an external entry,
#                                     its cost too
#     logprobs:            used by method logprobs
#       request            merged into the SCORE request body only (box /
#                          select / describe calls never change). Default
#                          {logprobs: true, top_logprobs: 20}; whatever this
#                          provider's API wants. May not set model, messages,
#                          the token field, response_format,
#                          chat_template_kwargs, stream or n
#       entries_path       where [{token, logprob, top_logprobs}] lives in the
#                          response. Default choices.0.logprobs.content
#       top_key            the alternatives list's key in each entry. Default
#                          top_logprobs
#       number_tokens      auto (default) | single | digits — how the tokenizer
#                          writes 10: one token (muse-glimmer) or `1`,`0`
#                          (the qwen family). auto reads it from the stream;
#                          a pinned value the stream contradicts is logged and
#                          the stream wins
#       min_coverage       the share of the score position's probability that
#                          must be on SOME number (default 0.5); below it the
#                          fallback is reported
#     sampling:            used by method sampling
#       n                  samples per score call (default 5, 2-32)
#       via                n_param (default: `n` in ONE request — vLLM, OpenAI;
#                          it holds n slots of max_concurrent, so max_concurrent
#                          must be >= n or the load fails) | repeat (n requests,
#                          one slot each — for a provider without `n`)
#       extra_body         merged into the sampling score body after
#                          extra_body (e.g. a temperature); default {} = the
#                          server's sampling. Same refused keys as above
#     fallback             stated — reported when the method yields nothing
#                          (no logprobs in the response, low coverage, no
#                          sample parsed). The scoring call never fails
#                          because of its measurement
#     headline             stated (default) | calibrated. SHADOW until a
#                          calibration is fitted: the top-level confidence
#                          stays the model's own number and the measured
#                          signals sit in detail.confidence. calibrated needs
#                          `calibration`
#     calibration          null (default) | {signal, points: [[x, y], ...],
#                          n, fitted_on, ground_truth} — the block
#                          bin/confidence_calibration.py prints. signal is one
#                          the method produces (stated: stated; logprobs: +
#                          verdict_probability, certainty; sampling: +
#                          agreement); points are non-decreasing, x in [0, 1],
#                          y in [0, 100]. Re-fit after a model, prompt or
#                          reasoning change
#   fast                   OPTIONAL — this entry can answer an llm criterion
#                          with options.mode "fast": reasoning OFF, ONE
#                          generated token (a digit 0-9 for the 1-10 rating,
#                          score = digit + 1), the answer read from that
#                          token's probabilities (common.logprobs
#                          .option_distribution) instead of from what it
#                          wrote — prefill plus one token, no reason written.
#                          No block = mode "fast" on this entry is a 400 that
#                          names the entries that have one. Only for a model
#                          whose reasoning can be turned OFF (Muse Glimmer's
#                          lowest level is `low`, so it has none). The
#                          response is read at confidence.logprobs
#                          .entries_path / top_key (where this provider keeps
#                          the entries). Fields:
#     chat_template_kwargs merged LAST into a fast body's chat_template_kwargs,
#                          after the entry's own extra_body ones with the
#                          entry's `reasoning` key DROPPED: the switch that
#                          turns reasoning off. The qwen family:
#                          {enable_thinking: false} — NOT reasoning_effort:
#                          none, with which vLLM's qwen3 parser files the
#                          answer under reasoning_content and content comes
#                          back null (measured 2026-11-12)
#     extra_body           merged into a fast body after the entry's
#                          extra_body. Default {temperature: 0}: greedy, so a
#                          written answer is the most probable path (the
#                          logprobs read are the raw ones, before
#                          temperature). May not set model, messages, the
#                          token field, response_format, chat_template_kwargs
#                          (the field above), stream, n, logprobs or
#                          top_logprobs. A fast body never carries
#                          response_format, the sampling n or the confidence
#                          request keys, and its token field is 1
#     top_logprobs         alternatives asked for at the answer position
#                          (default 20, at least 11 so all ten digits fit).
#                          NEVER above the server's own ceiling: vLLM's
#                          --max-logprobs (default 20; -1 = no cap) answers a
#                          request over it with a 400, which the classifier
#                          reports as "the server refused top_logprobs K".
#                          To raise it: raise the server's --max-logprobs
#                          first (ai/vllm/docker-compose.vllm.yml, then `make
#                          up vllm <service>`), then this value, then `docker
#                          restart classifier`. More alternatives make the
#                          probability cap (below) fire less
#     min_coverage         the share of the answer position's probability
#                          that must fall on the labels (default 0.5); below
#                          it the readout is incomplete and the unit fails
#                          naming mode "reasoned"
#     max_unseen_mass      the probability cap (default 0.02; above 0, at most
#                          1): what labels missing from the top_logprobs list
#                          hold is ESTIMATED as (labels missing) x (the
#                          smallest listed probability), at most 1 - coverage
#                          — one spelling per label, so a heuristic, not a
#                          guarantee (a label also matches as " 3", "[3", …);
#                          at or above this the readout is refused, naming
#                          top_logprobs and --max-logprobs. A confident answer
#                          whose other labels simply fell off the list stays
#                          far below it
#     strip_markers        strings removed from the caller text a fast prompt
#                          carries (the criterion name, the text layer):
#                          chat-template markers that would turn reasoning
#                          back on (ai/jinja/qwen_fixed_chat_template.jinja
#                          reads <|think_on|>, <|think_low|>, … in any user
#                          or system text). Default []
#     calibration          {} (default: the raw readout is reported) | per
#                          answer type ({rating: ...} today): {temperature,
#                          bias, n, fitted_on, ground_truth} — p ∝
#                          exp(logprob / temperature) before the verdict
#                          band is chosen (bias: a Platt offset for two-way
#                          answers, unused by rating). The fitting tool,
#                          bin/confidence_calibration.py --mode fast, is
#                          ZT-603 phase 2 (not built yet): until it is, leave
#                          {}. Re-fit after a model, prompt or template change

default: muse-glimmer

models:
  muse-glimmer:
    description: >-
      Muse Glimmer 30B on vLLM (ai/vllm, GPU pair 0-1, shared with qwen3.8 —
      only one of the two runs at a time). Vision, 3 images per prompt:
      boxes, references and contrastive references. The default.
    url: http://muse-glimmer:8000/v1/chat/completions
    served_name: muse-glimmer
    api_key_env: null
    vision: true
    # Must match muse-glimmer's --limit-mm-per-prompt '{"image": 3}'.
    max_images_per_prompt: 3
    # The stock chat template reads `reasoning_strength` (low | medium |
    # high | xhigh; it defaults to high) and writes "Reasoning strength:
    # <value>." into the system text itself. `low` keeps every classifier call
    # cheap. Check what a request renders on the box with:
    #   curl -s muse-glimmer:8000/tokenize -H 'content-type: application/json' \
    #     -d '{"model":"muse-glimmer","messages":[{"role":"user","content":"hi"}],
    #          "chat_template_kwargs":{"reasoning_strength":"low"},"return_token_strs":true}'
    reasoning: {style: chat_template_kwargs, key: reasoning_strength, value: low}
    # No sampling overrides: --generation-config auto applies Meta's
    # published defaults, and the model card warns against greedy decoding.
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    max_tokens: {score: 8192, box: 1024, select: 2048, describe: 1024}
    # Not streamed: a scoring call that spends most of its 8192 tokens
    # reasoning in a full batch can pass two minutes.
    timeout_s: 240
    # muse-glimmer schedules 8 (--max-num-seqs 8). The classifier takes 6 and
    # leaves 2 for the LiteLLM chat chains muse-glimmer also serves: their
    # overflow hook spills chat to the next order (in the end, Claude) once
    # vLLM's waiting queue stays non-empty, so filling all 8 here would push
    # chat off the local model.
    max_concurrent: 6
    # ~15k tokens: a long contract cannot crowd out the image or the answer.
    text_char_budget: 60000
    # Probed 2026-10-22 (vLLM 0.29, spec decode, reasoning parser): logprobs
    # come back, `10` is ONE token, the stream includes the reasoning. Shadow:
    # the headline stays the stated number until a calibration is fitted.
    # number_tokens is pinned to what /tokenize showed: under `auto`, when `10`
    # is not among a position's top tokens a `1` alternative cannot be told
    # from the start of `10` and is reported unresolved (a lower bound); pinned,
    # it is score 1 exactly.
    confidence: {method: logprobs, logprobs: {number_tokens: single}}
    # No `fast` block: its template's lowest reasoning level is `low` — the
    # reasoning cannot be turned off, so options.mode "fast" is a 400 here.

  qwen2.5-vl:
    description: >-
      Qwen2.5-VL-7B-Instruct on vLLM (the vllm-qwen-vl service in ai/vllm) —
      the old manual fallback for when muse-glimmer is not running. Vision,
      one image per prompt, so no references; an 8192-token context, so small
      budgets. Only answers while vllm-qwen-vl is up.
    url: http://vllm-qwen-vl:8000/v1/chat/completions
    served_name: Qwen/Qwen2.5-VL-7B-Instruct
    api_key_env: null
    vision: true
    # One image per prompt by choice: the 8192-token context has no room for a
    # second page. The service sets no --limit-mm-per-prompt, so vLLM's own
    # limit is its default of 999 — the rule is entry <= server.
    max_images_per_prompt: 1
    reasoning: {style: none}
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    # --max-model-len 8192 covers prompt AND answer: one ~1000-px page is
    # ~1300 tokens, so the answer budgets and the text budget below leave the
    # prompt room. It does not reason, so the JSON answer is all a budget buys.
    max_tokens: {score: 1024, box: 256, select: 512, describe: 512}
    timeout_s: 120
    max_concurrent: 2
    text_char_budget: 8000
    # Not running, so never probed: the model's own number only.
    confidence: {method: stated}

  qwen3.5-4b:
    description: >-
      Qwen3.5-4B (Q4_K_M) on llama.cpp, CPU only (the qwen3.5-4b service in
      ai/llama). Text only, no thinking. The model route-policy's
      llm_classifier evaluator scores conversation transcripts with — one
      text document per job, one presence criterion per route. Slow: seconds
      per call, tens of seconds for a long transcript, so not a document
      model.
    url: http://qwen3.5-4b:8000/v1/chat/completions
    served_name: qwen3.5-4b
    api_key_env: null
    vision: false
    max_images_per_prompt: 0
    reasoning: {style: none}
    # Qwen3.5 thinks by default and its template switches it with
    # enable_thinking — a boolean, which `reasoning.value` (a string) cannot
    # carry, so it rides here. The server's --chat-template-kwargs defaults
    # it off as well. Sampling is the server's (see the service's command).
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    json_mode: true
    token_param: max_tokens
    # score = the server's --n-predict 512 (it clamps anything larger); with
    # no thinking the JSON answer is all it buys. box / select / describe are
    # image work a text-only model is refused at submit — required, unused.
    max_tokens: {score: 512, box: 64, select: 64, describe: 64}
    # CPU prefill of a ~4k-token transcript plus the answer, with the other
    # slot busy.
    timeout_s: 90
    # = the server's --parallel 2: one slot per request in flight.
    max_concurrent: 2
    # ~3-4k tokens, well inside a 16k slot. route-policy's history.max_chars
    # must not exceed it.
    text_char_budget: 12000
    # Probed 2026-10-22 (llama.cpp): logprobs come back, digits split, real
    # spread. This is route-policy's latency path: if
    # classifier_llm_call_seconds{kind="score",model="qwen3.5-4b"} p50 grows
    # by more than ~10% with it on, set it back to {method: stated}.
    confidence: {method: logprobs}
    # Probed 2026-11-12 (llama.cpp): with thinking off and one token the
    # readout answers in ~0.2 s after a ~2 s first call; digits and letters are
    # single tokens; a yes / no split A 0.86 + [A 0.12 (the matcher sums the
    # bracket variant). top_logprobs 20 = what was probed (llama.cpp's
    # n_probs); thinking is already off in extra_body, said again here so the
    # fast body never depends on it.
    fast:
      chat_template_kwargs: {enable_thinking: false}
      top_logprobs: 20

  qwen3.8-solo:
    description: >-
      Qwen3.8-27B (AWQ INT4) on vLLM, one GPU (the qwen3.8-solo service in
      ai/vllm) — a vision document model AND a chat model: order 1 of
      LiteLLM's local-general / -code / -private chains and order 2 of
      local-reasoning, so chat shares its 3 sequences. Vision, 3 images per
      prompt (boxes, references, contrastive references), low reasoning.
      Fast-capable: options.mode "fast" turns reasoning off and reads a
      one-token answer (~0.2-0.6 s per criterion).
    url: http://qwen3.8-solo:8000/v1/chat/completions
    served_name: qwen3.8-solo
    api_key_env: null
    # Probed 2026-11-12: Qwen3_5ForConditionalGeneration with an unquantised
    # vision tower; an image (and three in one request) is accepted. LiteLLM
    # still declares no vision for its chat chains — that is LiteLLM's.
    vision: true
    # Three accepted (0a). The service sets no --limit-mm-per-prompt, so
    # vLLM's limit is its default of 999 — the rule is entry <= server.
    max_images_per_prompt: 3
    # The shared fixed template (ai/jinja/qwen_fixed_chat_template.jinja)
    # reads reasoning_effort: none | minimal | low | medium | high | xhigh …
    # (unset = medium, what the chains send; local-code sends high). `low`
    # keeps thinking on, briefly; --reasoning-parser qwen3 strips it, so
    # `content` is the JSON alone.
    reasoning: {style: chat_template_kwargs, key: reasoning_effort, value: low}
    # No sampling overrides: vLLM's --generation-config auto applies the
    # checkpoint's generation_config.json, as for muse-glimmer.
    extra_body: {}
    json_mode: true
    token_param: max_tokens
    # Reasoning counts against score first, as on muse-glimmer at `low`.
    max_tokens: {score: 8192, box: 1024, select: 2048, describe: 1024}
    timeout_s: 240
    # = --max-num-seqs 3: the classifier may take all three (decision
    # 2026-11-12 — overflow is not a concern here). Chat shares them: while
    # the classifier holds all three, a chat turn queues
    # (vllm:num_requests_waiting > 0) and the LiteLLM overflow hook spills it
    # to the chain's next order. A fast readout holds its slot for ~0.2-0.6 s.
    max_concurrent: 3
    # ~15k tokens + the 8192 answer, far inside --max-model-len 131072.
    text_char_budget: 60000
    # Probed 2026-10-22: logprobs come back, digits split (`1`,`0`), and the
    # stream includes the reasoning tokens — the score is read from the
    # answer part only.
    confidence: {method: logprobs}
    # Probed 2026-11-12 (phase 0a): with enable_thinking false and one token
    # the answer lands in `content` (0.16 s on a synthetic page; ~0.3-0.6 s
    # expected on a ~2k-token page), every digit and capital letter is one
    # token, and `[B`-style variants carry 0.5-12% (summed by the matcher).
    fast:
      # Not reasoning_effort: none — vLLM's qwen3 parser then files the one
      # token under reasoning_content and content is null. The entry's
      # reasoning_effort (above) is dropped from a fast body.
      chat_template_kwargs: {enable_thinking: false}
      # = qwen3.8-solo's --max-logprobs 64 (ai/vllm/docker-compose.vllm.yml);
      # never above it. Raise both together (the server first).
      top_logprobs: 64
      # The shared template (ai/jinja/qwen_fixed_chat_template.jinja) turns
      # thinking back ON when a user or system text contains any of these,
      # whatever enable_thinking says; <|think_off|> only turns it off.
      strip_markers:
        - "<|think_on|>"
        - "<|think_minimal|>"
        - "<|think_low|>"
        - "<|think_medium|>"
        - "<|think_high|>"
        - "<|think_xhigh|>"
        - "<|think_max|>"
        - "<|think_extreme|>"
        - "<|think_ultracode|>"
