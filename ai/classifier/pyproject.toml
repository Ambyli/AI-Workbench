[project]
name = "classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastapi",
    "uvicorn",
    "httpx",
    "opencv-python-headless",
    "numpy",
    "pydantic",
    "python-multipart",
    "Pillow",
    # common.documents — document loading, OCR, and text matching. Listed
    # here rather than pulled via common[documents] so this service's lock
    # entry is explicit. rapidocr 3.x does NOT depend on an inference engine,
    # so onnxruntime has to be requested separately.
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.22.0",
    "aiosqlite",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
]
