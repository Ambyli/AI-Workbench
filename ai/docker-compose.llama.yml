  glm5.2:
    networks:
      - shared
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: glm5.2
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_GLM52}:8000"
    volumes:
      - llama_data:/root/.cache/huggingface
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    command: >
      -hf unsloth/GLM-5.2-GGUF:UD-IQ1_S
      -a glm5.2
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -ot "blk\.([0-9]|[1-4][0-9])\.ffn_(gate|down|up)_exps\.=CPU"
      -c 32768
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja

volumes:
  llama_data:
