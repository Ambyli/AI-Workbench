# HAProxy front for the LAN host ports of every swap-class service and of three
# recreate-class HTTP APIs, plus a few internal-only listeners.
#
# One `listen` section per fronted service. Its NAME is the service's compose
# key (litellm, oauth2-proxy, ...): scripts/deploy.py looks the backend up by
# that name in the stats CSV to wait for a new copy to be UP before it retires
# the old one, and skips the wait for any service without a section here. Its
# FIRST `bind` is the LAN listener -- the port the edge publishes (`name lan`)
# and the one deploy.py reads. A later bind is either internal (`name
# internal`, only litellm has one), never published, or the same service over
# TLS (`name lan-tls`, only litellm so far), published and filtered exactly
# like `lan`.
#
# TLS (EDGE.md § TLS): a `lan-tls` bind serves /certs/edge.pem, the Let's
# Encrypt certificate the `edge-certs` container keeps in the `edge_certs`
# volume (a self-signed placeholder until it has one). Giving another service
# TLS is one line here -- `bind :<port> name lan-tls ssl crt /certs/edge.pem
# alpn h2,http/1.1` after its `lan` bind -- plus its `ports:` entry in
# docker-compose.edge.yml. A section whose rules are limited to the LAN with
# `lan_bind` (litellm) matches both names; every other section's rules
# apply to all of its binds already.
#
# Internal-only listeners are `frontend` sections, never `listen`, so deploy.py
# never mistakes them for a service: 127.0.0.1:8404 (stats CSV for deploy.py
# and the healthcheck), :8405 (Prometheus exporter) and :8407 (read-only status
# page behind oauth2-proxy at chat.zeoenergy.com/edge/). Reachable on ai_shared
# by `edge:<port>`, never published.
#
# Each section resolves `<service>:<port>` through Docker's embedded DNS
# (127.0.0.11) every second. While a deploy runs two copies, DNS returns both
# addresses and `server-template` fills two of its three slots; health checks
# decide which slots get traffic. When the old copy closes its listener on
# SIGTERM, its health check fails and any request that hits it first gets
# "connection refused" -- `retry-on conn-failure` + `option redispatch 1`
# resend it to another server. Only failed CONNECTIONS are retried, never a
# request that reached a server, so nothing is ever executed twice.
#
# Every LAN bind rejects a client whose source address is not in
# EDGE_ALLOWED_CIDRS (403, naming the address). Internal binds never do: the
# semantic router's traffic arrives on litellm's internal bind from an
# ai_shared address. When no copy of a service is healthy (a recreate-class
# service restarting, a failed deploy) the edge answers 503 + Retry-After with
# a message naming the service instead of HAProxy's default page.
#
# Health-check paths copy each service's own compose healthcheck. After an
# edit, `make up edge` validates this file (haproxy -c) inside the running edge
# and reloads it hitlessly only if it passes: EDGE.md § Changing haproxy.cfg.
# The environment variables used below are set by the edge compose file's
# `environment:` block; changing one in .env recreates the edge.
#
# Verified against the HAProxy 3.4 configuration manual (v3.4.6,
# https://docs.haproxy.org/3.4/configuration.html): server-template,
# resolvers, retry-on, option redispatch, http-check send/expect, 2.3
# environment variables ("${VAR[*]}" multi-word expansion, "${VAR-default}"),
# 2.4 conditional blocks (.if/streq), http-error, http-request return /
# track-sc0 / use-service, stick-table, sc0_trackers, so_name, sha2, the
# stats directives, `stats socket` (mode, level; no expose-fd needed in
# master-worker mode) and `bind ... ssl crt ... alpn`; and the management
# guide's `set ssl cert` / `commit ssl cert`. Checked with the haproxy 3.4.6
# binary from the official haproxy:3.4.6-alpine image: `haproxy -c` (it
# refuses a missing `crt` file), plus a run against stub backends (403 / 429
# / 503 bodies, the stick-table key, slot release at stream end; TLS + h2 on
# 4443 sharing the allow-list and per-key count with 4001; a runtime
# certificate push over the socket, and a USR2 reload re-reading the file).
# `haproxy -c` warns "log format ignored" for the three `no log` frontends;
# harmless.

# EDGE_ALLOWED_CIDRS is SPACE-separated ("${EDGE_ALLOWED_CIDRS[*]}" below
# expands it to one ACL pattern per word). An empty allow-list would still
# parse -- as an ACL that never matches, so every LAN client would get a 403.
# Fail the config instead (`haproxy -c` in `make up edge`, or the container's
# start), so the mistake is loud. A COMMA-separated value also fails, on this
# line, with "expected ')' ... in argument 1 of predicate 'streq'".
.if streq("${EDGE_ALLOWED_CIDRS-}","")
    .alert "EDGE_ALLOWED_CIDRS is empty: set it in .env (space-separated CIDRs; 0.0.0.0/0 ::/0 allows everyone). See ai/edge/EDGE.md."
.endif

global
    log stdout format raw local0 info
    maxconn 4096
    # Runtime API for `edge-certs` only: it pushes a renewed certificate into
    # the running workers (`set ssl cert` + `commit ssl cert`, admin level),
    # no restart. /run/haproxy-api is the `edge_api` volume, shared with
    # edge-certs alone (edge-certs makes it root:99 0770 so HAProxy, uid/gid
    # 99, can create the socket). Never a TCP address: on ai_shared anyone
    # could reach it. No `expose-fd listeners`: in master-worker mode (-W,
    # how the image runs HAProxy) a USR2 reload passes the listeners over the
    # master's socketpairs, and the new worker binds this socket again.
    stats socket /run/haproxy-api/admin.sock mode 660 level admin

# Docker's embedded DNS, reachable from any container on a user-defined network.
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    # Re-resolve every second, so a new copy is picked up within ~1 s of
    # starting and a removed one leaves the pool as soon as DNS drops it.
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Backends see this container's address as the peer; the LAN client's
    # address is appended to X-Forwarded-For.
    option forwardfor
    # One server connection per request. A pooled keep-alive connection to a
    # retiring copy could be closed under a request that was already sent --
    # a failure retry-on must not repeat. A fresh connection to a closed
    # listener fails at connect time instead, which is safe to retry.
    option http-server-close
    retries 3
    retry-on conn-failure
    # Pick a different server on every retry (default: only on the last).
    option redispatch 1
    # Long-lived requests (streamed chats) dominate; spread by open connections.
    balance leastconn
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout check 5s
    # Upgraded connections (WebSocket: Supabase Realtime, Studio, Streamlit /
    # Vite HMR in sandboxes, Open WebUI via oauth2-proxy).
    timeout tunnel 1h
    # init-addr none: start even when a backend service is not running yet;
    # its servers stay in MAINT until DNS returns an address.
    default-server inter 2s fall 2 rise 2 init-addr none resolvers docker resolve-prefer ipv4
    # No healthy copy: a short plain-text 503 naming the service, instead of
    # HAProxy's "No server is available" page. API listeners override this
    # with a JSON body of the same meaning. be_name is the listen section's
    # name, i.e. the compose service key.
    http-error status 503 content-type "text/plain; charset=utf-8" hdr Retry-After 10 lf-string "%[be_name] has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds.\n"

# Never published: deploy.py reads http://127.0.0.1:8404/stats;csv through
# `docker exec`, and the compose healthcheck probes /stats.
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    # Required: without it the CSV's `addr` column is empty for every server
    # ("shown only if show-legends is set", src/stats-proxy.c in 3.4.6), and
    # deploy.py cannot tell which server is the new copy -- every swap of a
    # fronted service then aborts after 60 s. Loopback-only, so nothing leaks.
    stats show-legends
    stats refresh 10s
    no log

# ── Prometheus exporter (edge:8405 on ai_shared, never published) ───────────
# HAProxy's built-in exporter (the official image is built with USE_PROMEX=1).
# Scraped by the litellm stack's prometheus (ai/litellm/prometheus.yml).
frontend metrics
    bind :8405 name internal
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

# ── Read-only status page (edge:8407 on ai_shared, never published) ─────────
# Reached at chat.zeoenergy.com/edge/ after Google sign-in: oauth2-proxy has
# http://edge:8407/edge/ in OAUTH2_PROXY_UPSTREAMS and forwards the path
# unchanged. No `stats admin`, so the page is read-only (no enable / disable /
# drain buttons). Anything on ai_shared can read it too; it shows backend
# addresses and health, no secrets.
frontend status
    bind :8407 name internal
    no log
    # /edge/ is the readable page (status/index.html: one row per service,
    # copies up, open connections, req/s, 5xx), which polls the built-in
    # report's CSV at /edge/raw/;csv. The file is read when the config loads,
    # so an edit needs `make up edge` (a hitless reload), and the whole
    # response must fit one buffer (tune.bufsize 16 KB minus tune.maxrewrite):
    # keep it under 12 KB, as test_deploy.py checks.
    http-request redirect location /edge/ code 302 if { path /edge }
    http-request redirect location /edge/raw/ code 302 if { path /edge/raw }
    http-request return status 200 content-type "text/html; charset=utf-8" file /usr/local/etc/haproxy/status/index.html hdr Cache-Control no-store if { path /edge/ /edge/index.html }
    http-request return status 404 unless { path_beg /edge/ }
    stats enable
    stats uri /edge/raw/
    stats refresh 10s
    stats show-legends
    stats hide-version

# ── litellm (PORT_LITELLM, default 4001; TLS PORT_LITELLM_TLS, default host
#    443 -> listener 4443; internal 14000) ─────────────────────────────────
# A non-streamed `auto` turn sends nothing back for up to 870 s (LiteLLM's
# stream_timeout + timeout), so both inactivity timers sit above that -- and
# above the semantic router's 840 s Envoy listener timeout, which reaches
# LiteLLM through the internal bind (unit-tests/litellm/test_timeouts.py).
#
# Three binds:
#   lan       the published plain-HTTP LAN port. Source allow-list and the
#             per-key concurrency limit apply on it and on lan-tls only.
#   lan-tls   :4443, the same service over TLS with the Let's Encrypt
#             certificate (EDGE.md § TLS), published as PORT_LITELLM_TLS
#             (host 443 by default: api.zeoenergy.com, split-horizon).
#             ALPN offers h2 and http/1.1; LiteLLM itself is always reached
#             over HTTP/1.1, and streamed responses are forwarded as they
#             arrive either way. Plain `lan` stays until clients have moved.
#   internal  :14000, never published. vllm-sr-envoy's four chain clusters
#             point here (ai/semantic-router/config.yaml base_url
#             http://edge:14000/v1) instead of at litellm:4000: Envoy's
#             LOGICAL_DNS clusters pin ONE address, which used to be a
#             LiteLLM copy that a swap retires; the edge never swaps, and it
#             picks a healthy copy per request. Every `auto` turn arrives here
#             with the same key (SEMANTIC_ROUTER_LITELLM_KEY) from an ai_shared
#             address, so neither limit may apply to it.
listen litellm
    bind :4001 name lan
    bind :4443 name lan-tls ssl crt /certs/edge.pem alpn h2,http/1.1
    bind :14000 name internal
    timeout client 900s
    timeout server 900s
    acl lan_bind so_name -m str lan lan-tls
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" if lan_bind !lan_allowed
    # Per-key concurrency on the LAN binds (EDGE_LITELLM_MAX_CONCURRENT_PER_KEY,
    # 0 = off; lan and lan-tls share one count per key). The stick-table key is a SHA-256 of the Authorization header
    # (else of x-api-key, which Anthropic-style clients send; else the source
    # address), never the raw token, so `show table litellm` cannot leak a
    # key. Tracking started by `http-request track-sc0` lasts for the stream
    # -- the request and its whole response, streamed or not -- so a long
    # chat holds its slot until its last byte, or until the client goes away.
    # sc0_trackers counts this request too: `gt N` refuses the (N+1)th.
    .if !streq("${EDGE_LITELLM_MAX_CONCURRENT_PER_KEY-8}",0)
    stick-table type string len 64 size 10k expire 10m
    acl has_bearer req.hdr(authorization) -m found
    acl has_api_key req.hdr(x-api-key) -m found
    http-request track-sc0 req.hdr(authorization),sha2(256),hex if lan_bind has_bearer
    http-request track-sc0 req.hdr(x-api-key),sha2(256),hex if lan_bind !has_bearer has_api_key
    http-request track-sc0 src if lan_bind !has_bearer !has_api_key
    http-request return status 429 content-type application/json hdr Retry-After 10 lf-string '{"error":{"message":"edge: this API key already has '"${EDGE_LITELLM_MAX_CONCURRENT_PER_KEY-8}"' requests in flight on the LAN ports (EDGE_LITELLM_MAX_CONCURRENT_PER_KEY); retry when one finishes","type":"rate_limit_error","code":429}}' if lan_bind { sc0_trackers gt "${EDGE_LITELLM_MAX_CONCURRENT_PER_KEY-8}" }
    .endif
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"error":{"message":"litellm has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds.","type":"service_unavailable","code":503}}'
    option httpchk
    http-check send meth GET uri /health/liveliness ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 litellm:4000 check

# ── oauth2-proxy (PORT_OAUTH2_PROXY, default 4180) ───────────────────────────
# Fronts Open WebUI for LAN clients; chats keep the same 900 s budget, and
# Open WebUI's socket.io websockets ride `timeout tunnel`.
listen oauth2-proxy
    bind :4180 name lan
    timeout client 900s
    timeout server 900s
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    option httpchk
    http-check send meth GET uri /ping ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 oauth2-proxy:4180 check

# ── kokoro-api (PORT_KOKORO_API, default 8004) ──────────────────────────────
listen kokoro-api
    bind :8004 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"detail":"kokoro-api has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds."}'
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 kokoro-api:8000 check

# ── madlad-api (PORT_MADLAD_API, default 8008) ──────────────────────────────
listen madlad-api
    bind :8008 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"detail":"madlad-api has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds."}'
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 madlad-api:8000 check

# ── searxng (PORT_SEARXNG, default 8009) ────────────────────────────────────
listen searxng
    bind :8009 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 searxng:8080 check

# ── sandbox-proxy (PORT_SANDBOX_PROXY, default 8011) ────────────────────────
# Operator smoke tests of /{sandbox_id}/; Streamlit and Vite HMR upgrade to
# websockets (timeout tunnel).
listen sandbox-proxy
    bind :8011 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 sandbox-proxy:80 check

# ── superset (PORT_SUPERSET, default 8016) ──────────────────────────────────
# Superset runs AUTH_REMOTE_USER and trusts X-Auth-Request-Email as the
# logged-in user with no password check. On this LAN port nothing has
# authenticated the caller -- oauth2-proxy reaches superset:8088 directly, not
# through here -- so a client-supplied identity header is always a spoof.
# Strip them, so the port can never be used to log in as someone else. This
# makes the edge STRICTER than the old direct publish, never looser.
listen superset
    bind :8016 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-request del-header X-Auth-Request-Email
    http-request del-header X-Auth-Request-User
    http-request del-header X-Auth-Request-Preferred-Username
    http-request del-header X-Forwarded-Email
    http-request del-header X-Forwarded-User
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 superset:8088 check

# ── supabase-api (PORT_SUPABASE_API, default 8022) ──────────────────────────
# Envoy gateway: every route needs an API key or basic auth, so the check is a
# TCP connect -- the same probe its compose healthcheck uses. Realtime and
# Studio websockets ride `timeout tunnel`.
listen supabase-api
    bind :8022 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"message":"supabase-api has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds."}'
    server-template app 3 supabase-api:8000 check

# ── vllm-sr-envoy (PORT_SEMANTIC_ROUTER, default 8025) ──────────────────────
# The semantic router's bearer-checked listener; TCP check like its compose
# healthcheck. Bodies are buffered, so nothing comes back until the chain
# has answered (up to the 840 s listener timeout).
listen vllm-sr-envoy
    bind :8025 name lan
    timeout client 900s
    timeout server 900s
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"error":{"message":"vllm-sr-envoy has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds.","type":"service_unavailable","code":503}}'
    server-template app 3 vllm-sr-envoy:8899 check

# ── Recreate-class HTTP APIs ────────────────────────────────────────────────
# These three are NOT swapped (each compose file says why) and keep their
# container_name. They are fronted only so that their recreate downtime
# returns the 503 + Retry-After below instead of "connection refused".
# deploy.py's edge checks run only in the swap path, so nothing waits on
# these backends during `make up`.

# ── classifier (PORT_CLASSIFIER, default 8005) ──────────────────────────────
# POST /assess and /references fetch every `type: "url"` document at submit,
# one after another, each bounded by the classifier's 120 s FETCH_TIMEOUT
# (plus 10 s per SVG image when CLASSIFIER_SVG_FETCH_IMAGES is on); uploads
# and base64 submits return in well under a second, and the work itself runs
# in the job queue. 600 s covers a submit with several slow URL documents.
listen classifier
    bind :8005 name lan
    timeout client 600s
    timeout server 600s
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"detail":"classifier has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds."}'
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 classifier:8000 check

# ── sandbox-runner (PORT_SANDBOX_RUNNER, default 8012) ──────────────────────
# Longest requests: a spawn (POST /run, /create) waits up to 30 s for the
# sandbox to bind its port; exec is hard-capped at 120 s
# (ai/sandbox/runner/constants.py). The default 300 s covers both.
listen sandbox-runner
    bind :8012 name lan
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"detail":"sandbox-runner has no healthy copy right now: it is restarting or being deployed. Retry in a few seconds."}'
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 sandbox-runner:8000 check

# ── detector (PORT_DETECTOR, default 8021) ──────────────────────────────────
# /health answers 503 until the OWLv2 weights are resident, so a detector that
# is still loading gets this listener's 503 too. POST /detect: an image-URL
# fetch (20 s + 10 s connect, ai/detector/config.py), then one inference --
# a few hundred ms on the GPU, a few seconds on the CPU fallback -- behind a
# lock, so concurrent callers queue. 120 s.
listen detector
    bind :8021 name lan
    timeout client 120s
    timeout server 120s
    acl lan_allowed src "${EDGE_ALLOWED_CIDRS[*]}"
    http-request return status 403 content-type "text/plain; charset=utf-8" lf-string "edge: %[src] is not in EDGE_ALLOWED_CIDRS\n" unless lan_allowed
    http-error status 503 content-type application/json hdr Retry-After 10 lf-string '{"detail":"detector has no healthy copy right now: it is restarting, deploying or still loading its model. Retry in a few seconds."}'
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 detector:8000 check
