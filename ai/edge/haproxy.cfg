# HAProxy front for the LAN host ports of every swap-class service.
#
# One `listen` section per service. Its NAME is the service's compose key
# (litellm, oauth2-proxy, ...): scripts/deploy.py looks the backend up by that
# name in the stats CSV to wait for a new copy to be UP before it retires the
# old one, and skips the wait for any service without a section here.
#
# Each section resolves `<service>:<port>` through Docker's embedded DNS
# (127.0.0.11) every second. While a deploy runs two copies, DNS returns both
# addresses and `server-template` fills two of its three slots; health checks
# decide which slots get traffic. When the old copy closes its listener on
# SIGTERM, its health check fails and any request that hits it first gets
# "connection refused" -- `retry-on conn-failure` + `option redispatch 1`
# resend it to another server. Only failed CONNECTIONS are retried, never a
# request that reached a server, so nothing is ever executed twice.
#
# Health-check paths copy each service's own compose healthcheck. After an
# edit, `make up edge` validates this file (haproxy -c) inside the running edge
# and reloads it hitlessly only if it passes: EDGE.md § Changing haproxy.cfg.
#
# Verified against the HAProxy 3.4 configuration manual (server-template,
# resolvers, retry-on, option redispatch, http-check send/expect).

global
    log stdout format raw local0 info
    maxconn 4096

# Docker's embedded DNS, reachable from any container on a user-defined network.
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    # Re-resolve every second, so a new copy is picked up within ~1 s of
    # starting and a removed one leaves the pool as soon as DNS drops it.
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Backends see this container's address as the peer; the LAN client's
    # address is appended to X-Forwarded-For.
    option forwardfor
    # One server connection per request. A pooled keep-alive connection to a
    # retiring copy could be closed under a request that was already sent --
    # a failure retry-on must not repeat. A fresh connection to a closed
    # listener fails at connect time instead, which is safe to retry.
    option http-server-close
    retries 3
    retry-on conn-failure
    # Pick a different server on every retry (default: only on the last).
    option redispatch 1
    # Long-lived requests (streamed chats) dominate; spread by open connections.
    balance leastconn
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout check 5s
    # Upgraded connections (WebSocket: Supabase Realtime, Studio, Streamlit /
    # Vite HMR in sandboxes, Open WebUI via oauth2-proxy).
    timeout tunnel 1h
    # init-addr none: start even when a backend service is not running yet;
    # its servers stay in MAINT until DNS returns an address.
    default-server inter 2s fall 2 rise 2 init-addr none resolvers docker resolve-prefer ipv4

# Never published: deploy.py reads http://127.0.0.1:8404/stats;csv through
# `docker exec`, and the compose healthcheck probes /stats.
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    no log

# ── litellm (PORT_LITELLM, default 4001) ────────────────────────────────────
# A non-streamed `auto` turn sends nothing back for up to 870 s (LiteLLM's
# stream_timeout + timeout), so both inactivity timers sit above that.
listen litellm
    bind :4001
    timeout client 900s
    timeout server 900s
    option httpchk
    http-check send meth GET uri /health/liveliness ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 litellm:4000 check

# ── oauth2-proxy (PORT_OAUTH2_PROXY, default 4180) ───────────────────────────
# Fronts Open WebUI for LAN clients; chats keep the same 900 s budget, and
# Open WebUI's socket.io websockets ride `timeout tunnel`.
listen oauth2-proxy
    bind :4180
    timeout client 900s
    timeout server 900s
    option httpchk
    http-check send meth GET uri /ping ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 oauth2-proxy:4180 check

# ── kokoro-api (PORT_KOKORO_API, default 8004) ──────────────────────────────
listen kokoro-api
    bind :8004
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 kokoro-api:8000 check

# ── madlad-api (PORT_MADLAD_API, default 8008) ──────────────────────────────
listen madlad-api
    bind :8008
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 madlad-api:8000 check

# ── searxng (PORT_SEARXNG, default 8009) ────────────────────────────────────
listen searxng
    bind :8009
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 searxng:8080 check

# ── sandbox-proxy (PORT_SANDBOX_PROXY, default 8011) ────────────────────────
# Operator smoke tests of /{sandbox_id}/; Streamlit and Vite HMR upgrade to
# websockets (timeout tunnel).
listen sandbox-proxy
    bind :8011
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 sandbox-proxy:80 check

# ── superset (PORT_SUPERSET, default 8016) ──────────────────────────────────
# Superset runs AUTH_REMOTE_USER and trusts X-Auth-Request-Email as the
# logged-in user with no password check. On this LAN port nothing has
# authenticated the caller -- oauth2-proxy reaches superset:8088 directly, not
# through here -- so a client-supplied identity header is always a spoof.
# Strip them, so the port can never be used to log in as someone else. This
# makes the edge STRICTER than the old direct publish, never looser.
listen superset
    bind :8016
    http-request del-header X-Auth-Request-Email
    http-request del-header X-Auth-Request-User
    http-request del-header X-Auth-Request-Preferred-Username
    http-request del-header X-Forwarded-Email
    http-request del-header X-Forwarded-User
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template app 3 superset:8088 check

# ── supabase-api (PORT_SUPABASE_API, default 8022) ──────────────────────────
# Envoy gateway: every route needs an API key or basic auth, so the check is a
# TCP connect -- the same probe its compose healthcheck uses. Realtime and
# Studio websockets ride `timeout tunnel`.
listen supabase-api
    bind :8022
    server-template app 3 supabase-api:8000 check

# ── vllm-sr-envoy (PORT_SEMANTIC_ROUTER, default 8025) ──────────────────────
# The semantic router's bearer-checked listener; TCP check like its compose
# healthcheck. Bodies are buffered, so nothing comes back until the chain
# has answered (up to the 840 s listener timeout).
listen vllm-sr-envoy
    bind :8025
    timeout client 900s
    timeout server 900s
    server-template app 3 vllm-sr-envoy:8899 check
