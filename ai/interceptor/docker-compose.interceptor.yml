networks:
  shared:
    external: true
    name: ai_shared

services:
  interceptor:
    networks:
      - shared
    build:
      context: ../..
      dockerfile: ai/interceptor/Dockerfile.interceptor
    container_name: interceptor
    restart: unless-stopped
    environment:
      - INTERCEPTOR_PROFILES_ROOT=/data/profiles
      # Base of the CDP debug port pool; the pool spans [base, base+MAX_CONCURRENT).
      - INTERCEPTOR_DEBUG_PORT=9224
      # Max simultaneous captures. Each active slot is ~200-400 MB RAM (Chrome)
      # plus, on same-profile collision, ~20-80 MB disk for the profile clone.
      - INTERCEPTOR_MAX_CONCURRENT=${INTERCEPTOR_MAX_CONCURRENT:-8}
      - INTERCEPTOR_CAPTURE_WINDOW_SECONDS=${INTERCEPTOR_CAPTURE_WINDOW_SECONDS:-20}
      # Default render wait for POST /screenshot + the screenshot_url MCP tool.
      # Chrome needs ~4-5s of it to boot and navigate before the page paints.
      - INTERCEPTOR_SCREENSHOT_WAIT_SECONDS=${INTERCEPTOR_SCREENSHOT_WAIT_SECONDS:-15}
    volumes:
      - interceptor_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  interceptor_data:
