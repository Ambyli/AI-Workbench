networks:
  shared:
    external: true
    name: ai_shared

services:
  interceptor:
    networks:
      - shared
    build:
      context: ../..
      dockerfile: ai/interceptor/Dockerfile.interceptor
    container_name: interceptor
    restart: unless-stopped
    environment:
      - INTERCEPTOR_PROFILES_ROOT=/data/profiles
      # Base of the CDP debug port pool; the pool spans [base, base+MAX_CONCURRENT).
      - INTERCEPTOR_DEBUG_PORT=9224
      # Max simultaneous captures. Each active slot is ~200-400 MB RAM (Chrome)
      # plus, on same-profile collision, ~20-80 MB disk for the profile clone.
      - INTERCEPTOR_MAX_CONCURRENT=${INTERCEPTOR_MAX_CONCURRENT:-8}
      - INTERCEPTOR_CAPTURE_WINDOW_SECONDS=${INTERCEPTOR_CAPTURE_WINDOW_SECONDS:-20}
      # Default render wait for POST /screenshot + the screenshot_url MCP tool.
      # Chrome needs ~4-5s of it to boot and navigate before the page paints.
      - INTERCEPTOR_SCREENSHOT_WAIT_SECONDS=${INTERCEPTOR_SCREENSHOT_WAIT_SECONDS:-15}
      # Per-profile credentials for login_actions (<profile>.json, re-read on
      # every request). Deliberately outside /data/profiles: a profile refresh
      # rmtree's its dir, and /data/profiles/* is listed as profiles.
      - INTERCEPTOR_LOGINS_DIR=/config/logins
      # Credentials the logins files reference as ${ENV:INTERCEPTOR_LOGIN_*}.
      # One pair per profile; set the values in .env. Empty (not :?) so a
      # missing pair fails only that profile's login_actions, with a 400.
      - INTERCEPTOR_LOGIN_ENPHASE_USERNAME=${INTERCEPTOR_LOGIN_ENPHASE_USERNAME:-}
      - INTERCEPTOR_LOGIN_ENPHASE_PASSWORD=${INTERCEPTOR_LOGIN_ENPHASE_PASSWORD:-}
    volumes:
      - interceptor_data:/data
      # Read-only: the service only ever reads these. The files hold only
      # ${ENV:…} references, so they are checked in.
      - ./logins:/config/logins:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  interceptor_data:
