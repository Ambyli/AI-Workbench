networks:
  shared:
    external: true
    name: ai_shared
  internal:
    driver: bridge

services:
  litellm:
    networks:
      - shared
      - internal
    build:
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${PORT_LITELLM}:4000"
    environment:
      STORE_MODEL_IN_DB: "True"
      # Overflow hook for the chain aliases (overflow.py, below). Defaults
      # match the code; see ai/litellm/LITELLM.md > Chain aliases.
      OVERFLOW_BUSY_AFTER_S: ${OVERFLOW_BUSY_AFTER_S:-2}
      OVERFLOW_IDLE_AFTER_S: ${OVERFLOW_IDLE_AFTER_S:-5}
      OVERFLOW_POLL_INTERVAL_S: ${OVERFLOW_POLL_INTERVAL_S:-1}
      OVERFLOW_PROBE_TIMEOUT_S: ${OVERFLOW_PROBE_TIMEOUT_S:-0.75}
      # The `auto` footer (a "---" rule + "*<model> - <chain>*" line naming
      # the backend under each answer from the semantic router), also in
      # overflow.py. true|false|1|0.
      # See ai/litellm/LITELLM.md > The `auto` footer.
      AUTO_FOOTER_ENABLED: ${AUTO_FOOTER_ENABLED:-true}
    env_file:
      - ../../.env
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      # litellm_settings.callbacks: ["overflow.handler"] is resolved relative
      # to the config file's directory, so this must sit next to
      # /app/config.yaml. The v1.95.0 runtime image has no /app/overflow.py
      # of its own to shadow.
      - ./overflow.py:/app/overflow.py:ro
    command:
      - "--config=/app/config.yaml"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    networks:
      - internal
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "${PORT_POSTGRES}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
      
  prometheus:
    image: prom/prometheus:latest
    restart: always
    container_name: prometheus
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

volumes:
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data
