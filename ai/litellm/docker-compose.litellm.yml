networks:
  shared:
    external: true
    name: ai_shared
  internal:
    driver: bridge

services:
  litellm:
    networks:
      - shared
      - internal
    build:
      context: .
      dockerfile: Dockerfile.litellm
    # Deployed side by side by `make up litellm` (scripts/deploy.py): a new
    # `litellm-<hash>` starts next to the old one, and the old one retires
    # once the new one is healthy. That is why there is no container_name
    # (two copies run at once) and no `ports:` -- PORT_LITELLM is published by
    # ai/edge, which routes to whichever copy is healthy. The hash covers
    # litellm_config.yaml and overflow.py too, so editing either and running
    # `make up litellm` deploys it. See ai/edge/EDGE.md.
    labels:
      com.zeo.deploy: swap
    restart: unless-stopped
    # `docker stop` on the retiring copy waits this long for in-flight
    # requests: an `auto` turn may take 870 s (stream_timeout + timeout),
    # inside Open WebUI's 900 s budget.
    stop_grace_period: 900s
    environment:
      STORE_MODEL_IN_DB: "True"
      # Overflow hook for the chain aliases (overflow.py, below). Defaults
      # match the code; see ai/litellm/LITELLM.md > Chain aliases.
      OVERFLOW_BUSY_AFTER_S: ${OVERFLOW_BUSY_AFTER_S:-2}
      OVERFLOW_IDLE_AFTER_S: ${OVERFLOW_IDLE_AFTER_S:-5}
      OVERFLOW_POLL_INTERVAL_S: ${OVERFLOW_POLL_INTERVAL_S:-1}
      OVERFLOW_PROBE_TIMEOUT_S: ${OVERFLOW_PROBE_TIMEOUT_S:-0.75}
      # Context fit: exact prompt counts from each local vLLM's /tokenize,
      # asked only when a high chars-per-token estimate reaches
      # MIN_FRACTION x the deployment's max_input_tokens. See
      # ai/litellm/LITELLM.md > The overflow hook.
      OVERFLOW_TOKENIZE_MIN_FRACTION: ${OVERFLOW_TOKENIZE_MIN_FRACTION:-0.6}
      OVERFLOW_TOKENIZE_CHARS_PER_TOKEN: ${OVERFLOW_TOKENIZE_CHARS_PER_TOKEN:-2.5}
      OVERFLOW_TOKENIZE_TIMEOUT_S: ${OVERFLOW_TOKENIZE_TIMEOUT_S:-5}
      # The `auto` footer (a "---" rule + "*<model> - <chain>*" line naming
      # the backend under each answer from the semantic router), also in
      # overflow.py. true|false|1|0.
      # See ai/litellm/LITELLM.md > The `auto` footer.
      AUTO_FOOTER_ENABLED: ${AUTO_FOOTER_ENABLED:-true}
      # Code-tool remap (overflow.py): local-general whose history CALLED a
      # tool whose name matches this regex in full -> local-code (offered but
      # uncalled tools don't count). `-` not `:-` ON PURPOSE:
      # unset uses the default below (== overflow.DEFAULT_CODE_ROUTE_TOOL_REGEX,
      # unit-tests/litellm/test_code_route.py checks), but an EMPTY value in
      # .env must reach the hook, because empty turns the remap off.
      # See ai/litellm/LITELLM.md > local-code: what it adds.
      CODE_ROUTE_TOOL_REGEX: ${CODE_ROUTE_TOOL_REGEX-sandbox-mcp_.+|run_command|get_process_status|send_process_input|kill_process|replace_file_content|read_user_terminal|send_user_terminal_input}
      # Code cooldown: a chat stays on local-code until this many exchanges
      # (user messages) in a row neither called a code tool nor matched the
      # router's code_kw, then drops to local-general. 0 = only the current
      # exchange counts. code_kw is read from the router's own config.yaml,
      # mounted below, so the two always agree.
      CODE_ROUTE_COOLDOWN: ${CODE_ROUTE_COOLDOWN:-3}
      CODE_ROUTE_ROUTER_CONFIG: /app/semantic-router-config.yaml
    env_file:
      - ../../.env
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      # litellm_settings.callbacks: ["overflow.handler"] is resolved relative
      # to the config file's directory, so this must sit next to
      # /app/config.yaml. The v1.95.0 runtime image has no /app/overflow.py
      # of its own to shadow.
      - ./overflow.py:/app/overflow.py:ro
      # The semantic router's config, read-only, for its `code_kw` signal
      # (the code cooldown above). Holds no secrets: its api_keys are the
      # __SEMANTIC_ROUTER_*_KEY__ placeholders. A code_kw edit
      # therefore changes this service's deploy hash too: `make up litellm`
      # after `make up semantic-router FORCE=1`.
      - ../semantic-router/config.yaml:/app/semantic-router-config.yaml:ro
    command:
      - "--config=/app/config.yaml"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # Recreated (with downtime) by `make up`: a data directory can have only one
  # Postgres. scripts/deploy.py says so when it runs.
  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    networks:
      - internal
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "${PORT_POSTGRES}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  # Recreated (with downtime) by `make up`: the TSDB under /prometheus is
  # locked by one process, so a second copy cannot start beside the first.
  prometheus:
    image: prom/prometheus:latest
    restart: always
    container_name: prometheus
    # Every scrape target in prometheus.yml (litellm, classifier, detector,
    # vllm-sr-router, edge) is reached by service name over ai_shared. Without
    # this block prometheus sat only on this stack's default network, where
    # none of them live -- not even litellm, which is on shared + internal.
    # It needs nothing on `internal` (litellm_db is not scraped).
    networks:
      - shared
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # The LiteLLM key the `litellm` scrape job sends (prometheus.yml,
      # credentials_file). The whole folder, so a missing key is a scrape error
      # on that one job rather than Docker creating a directory in its place.
      # git ignores everything in it but its own .gitignore -- see LITELLM.md >
      # Prometheus scrape key. prometheus runs as nobody: the key file must be
      # world-readable (it can only read /metrics).
      - ./secrets:/etc/prometheus/secrets:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

volumes:
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data
