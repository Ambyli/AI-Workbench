  # vLLM Semantic Router (ai/semantic-router/). One model name that picks a
  # decision from the request's signals and forwards the request, unchanged
  # apart from its `model`, to ONE of the four chain aliases above
  # (privacy_local -> local-private, code -> local-code, reasoning ->
  # local-reasoning, everything else -> local-general). Every decision is
  # `static`: one upstream call per turn, no looper fan-out, no confidence
  # escalation.
  #
  # `openai/vllm-sr/auto` is not a provider path: `openai/` selects
  # LiteLLM's OpenAI-compatible client and `vllm-sr/auto` is the literal
  # model name in the request body. It must equal
  # global.router.auto_model_name in ai/semantic-router/config.yaml, which
  # is the ONE name that triggers auto-routing -- every other model name a
  # caller sends the router is treated as an explicit selection.
  #
  # api_base points at Envoy, not at the router: the router is an ext_proc
  # server behind that listener and has no OpenAI surface of its own.
  #
  # RECURSION: the routed request comes back into this same LiteLLM with
  # SEMANTIC_ROUTER_LITELLM_KEY (the router rewrites Authorization). That
  # key is scoped to the FOUR chain aliases (local-general, local-code,
  # local-reasoning, local-private) and must never be able to call `auto`.
  # See ai/semantic-router/SEMANTIC_ROUTER.md > Recursion guard.
  #
  # stream_timeout AND timeout 870 because Envoy runs ext_proc with BUFFERED
  # request AND response bodies: nothing comes back until the chain's answer
  # is complete, including any time local-private spends queued in vLLM --
  # so this per-read limit is effectively a time-to-complete-answer limit.
  # `timeout` is set too: a non-streaming `auto` call otherwise fell back to
  # request_timeout. 870 sits strictly between Open WebUI's 900 s total
  # (AIOHTTP_CLIENT_TIMEOUT) and listeners[0].timeout: 840s in the router
  # config, so the innermost layer gives up first: Envoy's route timeout
  # fires at 840, never this one or Open WebUI's. (Envoy's 504 maps to a
  # litellm Timeout, exception_mapping_utils.py:465, which num_retries: 1
  # retries once on `auto` -- Open WebUI's 900 s total then cuts that retry
  # ~60 s in, so the user sees the error at ~900 s either way.) Keep the
  # order 900 > 870 > 840 when changing any of the three --
  # unit-tests/litellm/test_timeouts.py fails otherwise.
  #
  # ONLY ONE ROUTER ALIAS EXISTS ON PURPOSE. vllm-sr 0.3.0 has no
  # `entrypoints:` block and no per-algorithm model names -- UserConfig is
  # extra="forbid" over {version, listeners, providers, routing, global,
  # setup}. A caller who wants a specific chain calls it by name instead
  # (with a key scoped to it).
  - model_name: auto
    litellm_params:
      model: openai/vllm-sr/auto
      api_base: http://vllm-sr-envoy:8899/v1
      api_key: os.environ/SEMANTIC_ROUTER_LISTENER_KEY
      max_tokens: 16384
      stream_timeout: 870
      timeout: 870
    model_info:
      # The largest prompt every path out of `auto` can still serve LOCALLY:
      # 245760, muse-glimmer's window. All four chains contain muse-glimmer
      # and the pre-call check skips qwen3.8-solo (114688) for anything
      # longer, so each chain -- and local-private, which is where both
      # `auto` fallbacks land -- reaches 245760 without Claude. A higher
      # number would let a prompt through that only a Claude deployment
      # could take (and local-private would refuse); a lower one (the old
      # 114688) refuses prompts muse-glimmer could answer. Keep in step with
      # routing.modelCards[].context_window_size in the router config.
      max_input_tokens: 245760
      max_output_tokens: 16384
