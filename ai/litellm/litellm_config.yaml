litellm_settings:
  num_retries: 1
  # TIMEOUT BUDGET -- one layer inside the other:
  #   Open WebUI 900 (AIOHTTP_CLIENT_TIMEOUT, a hard total incl. streaming)
  #   > chain deployments, per read: local orders 1/2: 240, Claude order 3: 300.
  # `auto` adds no layer: it is rewritten to a chain in the same pass
  # (router_settings.model_group_alias, below). The ai/edge HAProxy's
  # `listen litellm` (900 s inactivity) sits outside both.
  # See ai/litellm/LITELLM.md > Chain timeouts.
  #
  # Every LiteLLM timeout is passed to httpx as httpx.Timeout(x) -- a
  # PER-READ inactivity limit, not a total. For `stream: true` the value
  # used is request stream_timeout > deployment stream_timeout >
  # router_settings.stream_timeout > request_timeout; otherwise timeout /
  # request_timeout (router.py:3143-3175 at v1.95.0). The 15-minute TOTAL
  # is enforced by Open WebUI; request_timeout: 900 is LiteLLM's default
  # per-attempt timeout for anything that sets none of its own, matched to
  # Open WebUI so LiteLLM is never the one that cuts a slow-but-alive call.
  # The per-deployment stream_timeout values below are stall detectors.
  request_timeout: 900
  drop_params: true
  turn_off_message_logging: true
  json_logs: false
  # The BACKSTOP context gate for the chain aliases below. _pre_call_checks
  # drops any deployment whose model_info.max_input_tokens is smaller than
  # the prompt before the order filter picks the lowest order left
  # (router.py:10694-10720 at v1.95.0) -- but it counts with
  # litellm.token_counter(messages=messages) (router.py:10147): tiktoken,
  # messages only, no tool definitions. That undercounts Qwen prompts (a
  # 122,881-token prompt by vLLM's count got through to qwen3.8-solo on
  # 2026-10-12 and was refused there). The real gate is the overflow hook's
  # CONTEXT FIT step (callbacks, below), which drops a too-long deployment
  # on vLLM's own /tokenize count first; this check still catches what the
  # hook could not measure (tokenize failed, deployment not in a chain).
  enable_pre_call_checks: true
  # Overflow hook for the chain aliases (local-general / local-code /
  # local-reasoning / local-private). ai/litellm/overflow.py, mounted at
  # /app/overflow.py next to /app/config.yaml -- get_instance_fn resolves
  # "overflow.handler" relative to the config file's directory
  # (proxy/types_utils/utils.py:30-56). It polls each local vLLM's /metrics
  # about once a second and, inside a chain, drops a local deployment that
  # has had a waiting queue for OVERFLOW_BUSY_AFTER_S or whose probe fails,
  # so LiteLLM's order filter moves to the next order. Before that it
  # checks CONTEXT FIT: for a long prompt it asks each local vLLM's
  # /tokenize for the exact count (messages + tools) and hard-drops a
  # deployment the prompt does not fit (OVERFLOW_TOKENIZE_*). It never
  # drops a Claude deployment for being busy and never empties a group:
  # local-private queues locally instead. See ai/litellm/LITELLM.md >
  # Chain aliases.
  callbacks: ["overflow.handler"]
  # Prometheus metrics. LiteLLM mounts /metrics ONLY when "prometheus" is in
  # success_callback (proxy_server.py: PrometheusLogger._mount_metrics_endpoint
  # in the success_callback branch, v1.93-1.95); without it /metrics is a 404
  # behind the auth middleware (401 without a key). failure_callback records
  # the failed requests too. Scraped by the litellm stack's prometheus with a
  # /metrics-only virtual key: LITELLM.md > Prometheus scrape key.
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  # Three independent fallback maps. `fallbacks` fires on generic failures
  # (connection refused while a vLLM container is still loading, 5xx, timeouts)
  # after num_retries is exhausted; `context_window_fallbacks` fires ONLY on
  # ContextWindowExceededError. An alias listed in one is not covered by the
  # other -- "Available Model Group Fallbacks=None" in an error means the alias
  # is missing from `fallbacks`.
  fallbacks:
    - {"qwen3.6":       ["claude-sonnet-5"]}
    - {"qwen3.8":       ["claude-sonnet-5"]}
    - {"qwen3.8-solo":  ["claude-sonnet-5"]}
    - {"qwen3.8-flash": ["claude-sonnet-5"]}
    - {"glm5.2":        ["claude-sonnet-5"]}
    - {"glm5.3-flash":  ["claude-sonnet-5"]}
    - {"muse-glimmer":  ["claude-sonnet-5"]}
    # `auto` has NO entry: the pre-call hook rewrites it to a chain alias
    # before routing, and this map is looked up by the model group actually
    # called (router_settings.model_group_alias, below).
    # The chain aliases (local-general / local-code / local-reasoning /
    # local-private) have NO entry here on purpose: their failover is
    # in-group, by `order`. A failed order-1 call is retried at order 2
    # then 3 by the router's order-based fallback (router.py:6132-6182 at
    # v1.95.0), which runs before -- and instead of needing -- this map.
  context_window_fallbacks:
    - {"qwen3.6":       ["claude-sonnet-5"]}
    - {"qwen3.8":       ["claude-sonnet-5"]}
    - {"qwen3.8-solo":  ["claude-sonnet-5"]}
    - {"qwen3.8-flash": ["claude-sonnet-5"]}
    - {"glm5.2":        ["claude-sonnet-5"]}
    - {"glm5.3-flash":  ["claude-sonnet-5"]}
    - {"muse-glimmer":  ["claude-sonnet-5"]}
    # No chain alias appears here either, and no `auto`. Inside a chain the
    # overflow hook's context fit (backed by the pre-call check) already
    # skips too-small deployments, and LiteLLM deliberately
    # skips order-based fallback for ContextWindowExceededError
    # (router.py:6132-6148 at v1.95.0). local-private, with no Claude
    # deployment, therefore FAILS on a prompt over 245760. The other chains
    # hand such a prompt to their Claude deployment, which declares no
    # window -- but NOT a request the client sent as `auto`: the overflow
    # hook keeps that one on its local deployments, so vLLM refuses it.
    # Claude is load overflow for `auto`, never a bigger window (the old
    # `auto` deployment's max_input_tokens: 245760 enforced the same).

router_settings:
  # A TIMEOUT inside a chain goes straight to the next `order`, with no
  # same-order retry. Without this, num_retries: 1 above would re-pick
  # order 1 first (the order filter still prefers it) and spend a second
  # 240 s on the backend that just timed out. A per-group RetryPolicy
  # overrides num_retries for that exception type only
  # (router_utils/get_retry_from_policy.py; field TimeoutErrorRetries,
  # types/router.py:105; Router(model_group_retry_policy=...), router.py:331;
  # applied in async_function_with_retries, router.py:6505-6521, all at
  # v1.95.0). With 0 retries the Timeout re-raises into the order-based
  # fallback (router.py:6132-6171), which tries the next order level.
  # Other errors (connection refused, 5xx) keep num_retries: 1.
  # The proxy passes every key of this block that is a Router.__init__ arg
  # through to the Router (proxy_server.py:5012-5016).
  #
  # This policy governs a timeout BEFORE response headers. A stall AFTER
  # headers (vLLM sends them before its first token) surfaces inside the
  # stream instead. Measured at v1.95.0 against an openai-compatible
  # deployment: the read timeout has no status code, maps to
  # APIConnectionError (exception_mapping_utils.py:482-490), is wrapped as
  # MidStreamFallbackError (streaming_handler.py:2153-2217), and the
  # Router's mid-stream fallback (router.py:2066-2150) moves to the next
  # order with no same-order retry -- re-prompting with the partial answer
  # as a prefix if some content had already streamed. Only a mid-stream
  # error that maps to a 4xx is raised with no fallback
  # (streaming_handler.py:2202-2206). Both paths are regression-tested in
  # unit-tests/litellm/test_timeouts.py. A backend that is merely QUEUEING
  # is handled earlier, by the overflow hook, before a call is ever made.
  #
  # Do NOT use allowed_fails_policy for this: setting it switches every
  # deployment to legacy cooldown.
  model_group_retry_policy:
    local-general:   {TimeoutErrorRetries: 0}
    local-code:      {TimeoutErrorRetries: 0}
    local-reasoning: {TimeoutErrorRetries: 0}
    local-private:   {TimeoutErrorRetries: 0}

  # `auto` -- the route-policy engine's entrypoint (ai/route-policy/). The
  # pre-call hook (hooks/routing/policy_client.py) awaits the engine's
  # /decide on every `auto` request and rewrites `model` to the chain alias
  # it chose, so LiteLLM serves that chain in the SAME pass, streamed. This
  # alias only serves `auto` when nothing rewrote it. It is resolved at
  # deployment selection (router.py:10465 at v1.95.0), AFTER the pre-call
  # hook (common_request_processing.py:1274), so the hook still sees
  # "auto"; it is listed in /v1/models (Open WebUI offers it -- do not set
  # `hidden`), passes key checks (auth_checks.py:2978) and is routable as is
  # (route_llm_request.py:562). local-private, because a request the engine
  # did not route has had its prompt checked for PII by nobody -- the hook's
  # own fallback for a slow, failing or shadow-mode engine is local-private
  # too. NEVER point it at a chain with a Claude deployment. The client
  # still sees "model": "auto" in the response. `auto` has no `fallbacks` /
  # `context_window_fallbacks` / retry-policy entry: those are looked up by
  # the model group actually called, which after the rewrite is the chain.
  model_group_alias:
    auto: local-private

general_settings:
  master_key: os.environ/DEFAULT_LITELLM_MASTER_KEY
  database_url: os.environ/DEFAULT_LITELLM_DATABASE_URL
  enable_metrics: true
  store_model_in_db: true
  default_max_tokens: 16384
  always_include_stream_usage: true
  # auth: true on every entry. A config-file pass-through WITHOUT it runs no
  # key check at all (LiteLLM v1.95.0 _register_pass_through_endpoint) — any
  # caller, keyless, reaches the service, and none of these services has auth
  # of its own. With it: the master key / proxy-admin keys pass; a virtual key
  # gets 403 unless its own or its team's metadata lists the route, e.g.
  #   {"allowed_passthrough_routes": ["/v1/classifier", "/v1/detector"]}
  # (exact or prefix match). Set it inside `metadata` as a proxy admin — the
  # top-level `allowed_passthrough_routes` key field is Enterprise-only. See
  # ai/litellm/LITELLM.md § Pass-through auth.
  pass_through_endpoints:
    - path: "/v1/classifier"
      target: "http://classifier:8000"
      include_subpath: true
      # PATCH: PATCH /references/{id} edits a saved reference's title /
      # description / tags (ai/classifier/API.md § References).
      methods: ["GET", "POST", "PATCH", "DELETE"]
      forward_headers: true
      auth: true
    - path: "/v1/detector"
      target: "http://detector:8000"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
      auth: true
    - path: "/v1/madlad"
      target: "http://madlad-api:8000"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
      auth: true
    - path: "/v1/interceptor"
      target: "http://interceptor:8080"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
      auth: true
    - path: "/v1/roofix"
      target: "http://roofix:8080"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
      auth: true
    - path: "/v1/sandbox"
      target: "http://sandbox-runner:8000"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
      auth: true
    # The route-policy service (ai/route-policy/ROUTE_POLICY.md): /decide,
    # /observe, /evaluate, /rulesets, /bindings, /chats/{id}/decisions,
    # /evaluator-types. Operators only -- the hook itself calls
    # http://route-policy:8000 directly, never through this path.
    - path: "/v1/route-policy"
      target: "http://route-policy:8000"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
      auth: true

mcp_servers:
  kokoro_tts:
    url: http://kokoro-api:8000/mcp
    transport: "http"

  madlad_translate:
    url: http://madlad-api:8000/mcp
    transport: "http"

  detector:
    url: http://detector:8000/mcp
    transport: "http"

  interceptor:
    url: http://interceptor:8080/mcp
    transport: "http"

  sandbox:
    url: http://sandbox-runner:8000/mcp
    transport: "http"

  trino:
    url: http://trino-mcp:8080/mcp
    transport: "http"

  phoenix:
    url: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_URL
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_AUTH_VALUE

  gmail:
    url: "https://gmailmcp.googleapis.com/mcp/v1"
    transport: "http"
    auth_type: oauth2
    oauth2_flow: authorization_code
    delegate_auth_to_upstream: true

model_list:
  - model_name: os.environ/DEFAULT_LITELLM_MODEL_NAME
    litellm_params:
      model: os.environ/DEFAULT_LITELLM_MODEL
      api_base: os.environ/DEFAULT_LITELLM_MODEL_API_BASE
      api_key: os.environ/DEFAULT_LITELLM_MODEL_API_KEY
      max_tokens: 16384
      stream_timeout: 300

  - model_name: kokoro
    litellm_params:
      model: openai/kokoro
      api_base: http://kokoro-api:8000/v1
      api_key: none
      stream_timeout: 300
    model_info:
      mode: audio

  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6
      api_base: http://qwen3.6:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 0.6
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8
    litellm_params:
      model: openai/qwen3.8
      api_base: http://qwen3.8:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8-solo
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: http://qwen3.8-flash:8000/v1
      api_key: none
      max_tokens: 65536
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 600
    model_info:
      # qwen3.8-flash runs -c 1048576 --parallel 2 -> 524288 ctx per slot,
      # --n-predict 65536. input + output must equal the slot size; keep
      # these three in sync with ai/llama/docker-compose.llama.yml.
      max_input_tokens: 458752
      max_output_tokens: 65536

  - model_name: glm5.2
    litellm_params:
      model: openai/glm5.2
      api_base: http://glm5.2:8000/v1
      api_key: none
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 40
        min_p: 0
      stream_timeout: 600
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 32768

  - model_name: glm5.3-flash
    litellm_params:
      model: openai/glm5.3-flash
      api_base: http://glm5.3-flash:8000/v1
      api_key: none
      max_tokens: 32768
      # Model card defaults: temperature 1.0 / top_p 0.95.
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      # CPU-only backend (ai/llama/docker-compose.llama.yml -> glm5.3-flash):
      # prompt processing runs at low hundreds of tok/s, so time-to-first-token
      # on a long, uncached prompt is minutes, not seconds. 1800 s is the
      # per-read budget (httpx.Timeout) before LiteLLM gives up on a silent
      # stream. A caller through Open WebUI is cut at Open WebUI's 900 s
      # TOTAL first (AIOHTTP_CLIENT_TIMEOUT), so 1800 only matters to
      # direct API callers.
      stream_timeout: 1800
    model_info:
      # glm5.3-flash runs -c 262144 --parallel 1 -> one 262144 slot,
      # --n-predict 32768. input + output must equal the slot size; keep
      # these three in sync with ai/llama/docker-compose.llama.yml.
      max_input_tokens: 229376
      max_output_tokens: 32768

  - model_name: muse-glimmer
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
      api_key: none
      max_tokens: 16384
      # Meta's published sampling: temperature 1.0 / top_p 0.95 / top_k 64.
      # The model card warns against greedy decoding.
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
      stream_timeout: 300
    model_info:
      # muse-glimmer runs --max-model-len 262144; input + output must fit.
      # Keep in sync with ai/vllm/docker-compose.vllm.yml.
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true

  - model_name: qwen2.5-vl
    litellm_params:
      model: openai/Qwen/Qwen2.5-VL-7B-Instruct
      api_base: http://vllm-qwen-vl:8000/v1
      api_key: none
      max_tokens: 8192
      stream_timeout: 300
    model_info:
      mode: image

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      stream_timeout: 300

  # Not in any fallback map, so it is never spent silently on someone
  # else's behalf. A routed `auto` turn reaches Opus only as order 3 of the
  # `local-reasoning` chain below -- a separate deployment, overflow only.
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      stream_timeout: 300

  # =========================================================================
  # CHAIN ALIASES -- what the route-policy engine routes `auto` to.
  # =========================================================================
  # Policy: local models first, for COST. Claude is reached ONLY when both
  # local deployments in a chain are busy or down -- never on a quality
  # judgement. Customer / PII data must NEVER reach Claude (local-private).
  #
  #   alias             order 1        order 2        order 3
  #   local-general     qwen3.8-solo   muse-glimmer   claude-sonnet-5
  #   local-code        qwen3.8-solo   muse-glimmer   claude-sonnet-5
  #   local-reasoning   muse-glimmer   qwen3.8-solo   claude-opus-5-5
  #   local-private     qwen3.8-solo   muse-glimmer   -- NONE --
  #
  # HOW A REQUEST PICKS A DEPLOYMENT (LiteLLM v1.95.0,
  # router.py::async_get_healthy_deployments, 10606-10740):
  #   cooldown filter -> overflow hook (async_callback_filter_deployments,
  #   10686: context fit, then busy/down) -> pre-call context check (10694,
  #   the tiktoken backstop) -> order filter (10716-10720: keep only the
  #   LOWEST `order` still present).
  # So order 1 answers while it is up and not queueing. The overflow hook
  # (ai/litellm/overflow.py) drops a local deployment whose vLLM has had a
  # waiting queue for OVERFLOW_BUSY_AFTER_S, or whose /metrics probe fails;
  # the order filter then picks order 2, and only with both locals dropped
  # order 3. The hook never drops a deployment without an api_base (Claude)
  # and never empties a group.
  # A deployment that fails AT CALL TIME is retried (num_retries) and then
  # LiteLLM's order-based fallback walks the remaining order levels of the
  # same group (router.py:6132-6182) -- no `fallbacks` entry needed, and
  # none exists for these aliases. A TIMEOUT is not retried at the same
  # order: router_settings.model_group_retry_policy sends a pre-header
  # timeout straight to the next order, and a stall after headers takes
  # the mid-stream fallback to the next order (see router_settings).
  #
  # TIMEOUTS. Every chain deployment sets BOTH stream_timeout and timeout
  # (per-read, httpx.Timeout): 240 on the local orders 1 and 2, 300 on the
  # Claude order 3. They sit inside Open WebUI's 900 s total, so a stalled
  # local backend fails over while the turn still has budget: three
  # pre-header timeouts in a row cost 240 + 240 + 300 = 780 s < 900. These
  # are NOT copied from the standalone aliases (which keep their own
  # stream_timeout) -- they are the chain's budget. See LITELLM.md > Chain
  # timeouts.
  #
  # EACH DEPLOYMENT CALLS ITS BACKEND DIRECTLY. litellm_params below are
  # copies of the standalone qwen3.8-solo / muse-glimmer / claude-sonnet-5 /
  # claude-opus-5-5 entries above (keep them in sync when those change), NOT
  # references to those aliases: pointing a chain at an alias would recurse
  # through LiteLLM, and -- worse -- drag in that alias's own
  # `fallbacks: -> claude-sonnet-5`, which is exactly the silent cloud path
  # local-private exists to close. The standalone aliases are unchanged and
  # still callable directly.
  #
  # model_info.max_input_tokens is per DEPLOYMENT and load-bearing: it is
  # what lets the overflow hook's context fit (vLLM's exact /tokenize count,
  # messages + tools) skip qwen3.8-solo (114688) for a long prompt and land
  # on muse-glimmer (245760); enable_pre_call_checks reads it too, as the
  # tiktoken backstop. The hook also checks count + max_tokens against the
  # backend's max_model_len, which /tokenize reports. The Claude deployments
  # declare none, matching their standalone aliases.

  # -- local-general: the catch-all; the engine's default route ---------------
  - model_name: local-general
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      order: 1
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: local-general
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
      api_key: none
      order: 2
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true

  - model_name: local-general
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      order: 3
      stream_timeout: 300
      timeout: 300

  # -- local-code: same ladder as local-general, tuned for coding -------------
  # Reached when the route-policy engine routes `auto` here (its code-text,
  # code-tools and sticky-code evaluators: a code-like message, or a chat
  # that has called a sandbox / Open Terminal tool), or by a direct call.
  # Differences from local-general, all per deployment (see
  # ai/litellm/LITELLM.md > local-code: what it adds):
  #   * litellm_system_prompt -- the same coding rules on all three orders,
  #     defined once with the YAML anchor &code_system_prompt and reused with
  #     *code_system_prompt (PyYAML safe_load, which the proxy uses, resolves
  #     both). LiteLLM merges it IN FRONT of the first system message for
  #     that deployment only (main.py, add_system_prompt_to_messages(...,
  #     merge_with_first_system=True)) and never sends the key itself. It
  #     must never contain a "Reasoning strength:" line: muse-glimmer's
  #     template would take that over the reasoning_strength kwarg below.
  #   * deeper reasoning through each local model's OWN chat-template kwarg:
  #     qwen reasoning_effort high (the fixed template maps high -> xhigh,
  #     ai/jinja/qwen_fixed_chat_template.jinja), muse reasoning_strength
  #     xhigh (its stock template defaults to high). A client that sends its
  #     own chat_template_kwargs (or extra_body) REPLACES these, it does not
  #     merge with them.
  #   * max_tokens 32768 on both locals (Qwen's own SWE-bench setting). A
  #     client-sent max_tokens still wins. (`auto` is an alias with no
  #     litellm_params of its own, so it adds none.)
  # Sampling is unchanged: qwen's is already Qwen's official Thinking preset,
  # muse's is Meta's published defaults. Timeouts are unchanged too: xhigh
  # turns are slower, and a qwen turn that goes silent for 240 s fails over
  # to muse (unit-tests/litellm/test_timeouts.py keeps the nesting).
  - model_name: local-code
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      order: 1
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          reasoning_effort: high
      litellm_system_prompt: &code_system_prompt |-
        You are working on code with tools.
        - Your turn ends as soon as you reply without a tool call. Never announce a step ("let me...", "I'll now...") - make the tool call instead.
        - Change existing files with edit_file (exact old_string -> new_string). Use write_files only for new files or complete rewrites. Read only the lines you need with read_file (offset/limit).
        - When a tool returns an error, diagnose it and retry in the same turn.
        - Run the code or its tests to verify before saying it works.
        - Reply without a tool call only when the task is done (say what changed) or you need a decision from the user (ask it).
      stream_timeout: 240
      timeout: 240
    model_info:
      # 98304, not qwen's 114688, ON PURPOSE: qwen3.8-solo runs
      # --max-model-len 131072, and with this deployment's 32768-token
      # answer budget the overflow hook's context fit (count + max_tokens <=
      # max_model_len) already skips qwen above 131072 - 32768 = 98304. Saying
      # so here keeps LiteLLM's own pre-call check (the tiktoken backstop) on
      # the same line instead of letting it pass prompts qwen cannot answer
      # in full. Longer local-code prompts go to muse-glimmer.
      max_input_tokens: 98304
      max_output_tokens: 32768

  - model_name: local-code
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
      api_key: none
      order: 2
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
        chat_template_kwargs:
          reasoning_strength: xhigh
      litellm_system_prompt: *code_system_prompt
      stream_timeout: 240
      timeout: 240
    model_info:
      # --max-model-len 262144: 229376 input + 32768 output. 245760 (the
      # other chains' value) would let the context fit drop muse for prompts
      # between 229376 and 245760 anyway; this keeps the backstop honest.
      max_input_tokens: 229376
      max_output_tokens: 32768
      supports_vision: true

  - model_name: local-code
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      order: 3
      litellm_system_prompt: *code_system_prompt
      stream_timeout: 300
      timeout: 300

  # -- local-reasoning: the reasoner leads; Opus is the overflow ---------------
  - model_name: local-reasoning
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
      api_key: none
      order: 1
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true

  - model_name: local-reasoning
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      order: 2
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: local-reasoning
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      order: 3
      stream_timeout: 300
      timeout: 300

  # -- local-private: LOCAL ONLY ----------------------------------------------
  # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  # !! NO CLAUDE DEPLOYMENT, AND NO ENTRY IN `fallbacks` OR                  !!
  # !! `context_window_fallbacks` -- EVER. This group serves the route-     !!
  # !! policy engine's privacy route (PII / customer data), and every        !!
  # !! `auto` request the engine did not route (slow, failing, shadow mode,  !!
  # !! or the `auto` alias itself) -- i.e. whenever nobody has checked the   !!
  # !! prompt for PII. Customer data must never reach Anthropic, so when     !!
  # !! both local models are busy the overflow hook returns the group        !!
  # !! unchanged and the request QUEUES inside vLLM, and when both are down  !!
  # !! it FAILS. Adding a cloud deployment, or a fallback entry for this     !!
  # !! alias, turns the privacy guarantee into a best-effort hint. Do not,   !!
  # !! not even "temporarily".                                               !!
  # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  - model_name: local-private
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      order: 1
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: local-private
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
