litellm_settings:
  num_retries: 1
  request_timeout: 300
  drop_params: true
  turn_off_message_logging: true
  json_logs: false
  enable_pre_call_checks: true
  # Three independent fallback maps. `fallbacks` fires on generic failures
  # (connection refused while a vLLM container is still loading, 5xx, timeouts)
  # after num_retries is exhausted; `context_window_fallbacks` fires ONLY on
  # ContextWindowExceededError. An alias listed in one is not covered by the
  # other -- "Available Model Group Fallbacks=None" in an error means the alias
  # is missing from `fallbacks`.
  fallbacks:
    - {"qwen3.6":       ["claude-sonnet-5"]}
    - {"qwen3.8":       ["claude-sonnet-5"]}
    - {"qwen3.8-solo":  ["claude-sonnet-5"]}
    - {"qwen3.8-flash": ["claude-sonnet-5"]}
    - {"glm5.2":        ["claude-sonnet-5"]}
    - {"glm5.3-flash":  ["claude-sonnet-5"]}
    - {"muse-glimmer":  ["claude-sonnet-5"]}
    # `auto` is the semantic router (ai/semantic-router/). Stopping
    # vllm-sr-envoy, or a router that fails its readiness check, must not
    # take the chat down -- fall back to the pool's workhorse, then to
    # Anthropic. Do NOT list a router entrypoint as its own fallback.
    - {"auto":          ["qwen3.8", "claude-sonnet-5"]}
  context_window_fallbacks:
    - {"qwen3.6":       ["claude-sonnet-5"]}
    - {"qwen3.8":       ["claude-sonnet-5"]}
    - {"qwen3.8-solo":  ["claude-sonnet-5"]}
    - {"qwen3.8-flash": ["claude-sonnet-5"]}
    - {"glm5.2":        ["claude-sonnet-5"]}
    - {"glm5.3-flash":  ["claude-sonnet-5"]}
    - {"muse-glimmer":  ["claude-sonnet-5"]}
    # A prompt too long for the router's smallest candidate goes to the
    # long-context backend directly rather than being routed.
    - {"auto":          ["qwen3.8-flash"]}

general_settings:
  master_key: os.environ/DEFAULT_LITELLM_MASTER_KEY
  database_url: os.environ/DEFAULT_LITELLM_DATABASE_URL
  enable_metrics: true
  store_model_in_db: true
  default_max_tokens: 16384
  always_include_stream_usage: true
  pass_through_endpoints:
    - path: "/v1/classifier"
      target: "http://classifier:8000"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
    - path: "/v1/madlad"
      target: "http://madlad-api:8000"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
    - path: "/v1/interceptor"
      target: "http://interceptor:8080"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
    - path: "/v1/roofix"
      target: "http://roofix:8080"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
    - path: "/v1/sandbox"
      target: "http://sandbox-runner:8000"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true

mcp_servers:
  kokoro_tts:
    url: http://kokoro-api:8000/mcp
    transport: "http"

  madlad_translate:
    url: http://madlad-api:8000/mcp
    transport: "http"

  interceptor:
    url: http://interceptor:8080/mcp
    transport: "http"

  sandbox:
    url: http://sandbox-runner:8000/mcp
    transport: "http"

  trino:
    url: http://trino-mcp:8080/mcp
    transport: "http"

  phoenix:
    url: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_URL
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_AUTH_VALUE

  gmail:
    url: "https://gmailmcp.googleapis.com/mcp/v1"
    transport: "http"
    auth_type: oauth2
    oauth2_flow: authorization_code
    delegate_auth_to_upstream: true

model_list:
  - model_name: os.environ/DEFAULT_LITELLM_MODEL_NAME
    litellm_params:
      model: os.environ/DEFAULT_LITELLM_MODEL
      api_base: os.environ/DEFAULT_LITELLM_MODEL_API_BASE
      api_key: os.environ/DEFAULT_LITELLM_MODEL_API_KEY
      max_tokens: 16384
      stream_timeout: 300

  - model_name: kokoro
    litellm_params:
      model: openai/kokoro
      api_base: http://kokoro-api:8000/v1
      api_key: none
      stream_timeout: 300
    model_info:
      mode: audio

  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6
      api_base: http://qwen3.6:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 0.6
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8
    litellm_params:
      model: openai/qwen3.8
      api_base: http://qwen3.8:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8-solo
    litellm_params:
      model: openai/qwen3.8-solo
      api_base: http://qwen3.8-solo:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: http://qwen3.8-flash:8000/v1
      api_key: none
      max_tokens: 65536
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 600
    model_info:
      # qwen3.8-flash runs -c 1048576 --parallel 2 -> 524288 ctx per slot,
      # --n-predict 65536. input + output must equal the slot size; keep
      # these three in sync with ai/llama/docker-compose.llama.yml.
      max_input_tokens: 458752
      max_output_tokens: 65536

  - model_name: glm5.2
    litellm_params:
      model: openai/glm5.2
      api_base: http://glm5.2:8000/v1
      api_key: none
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 40
        min_p: 0
      stream_timeout: 600
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 32768

  - model_name: glm5.3-flash
    litellm_params:
      model: openai/glm5.3-flash
      api_base: http://glm5.3-flash:8000/v1
      api_key: none
      max_tokens: 32768
      # Model card defaults: temperature 1.0 / top_p 0.95.
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      # CPU-only backend (ai/llama/docker-compose.llama.yml -> glm5.3-flash):
      # prompt processing runs at low hundreds of tok/s, so time-to-first-token
      # on a long, uncached prompt is minutes, not seconds. 1800 s is the
      # time-to-first-chunk budget before LiteLLM gives up on the stream.
      stream_timeout: 1800
    model_info:
      # glm5.3-flash runs -c 262144 --parallel 1 -> one 262144 slot,
      # --n-predict 32768. input + output must equal the slot size; keep
      # these three in sync with ai/llama/docker-compose.llama.yml.
      max_input_tokens: 229376
      max_output_tokens: 32768

  - model_name: muse-glimmer
    litellm_params:
      model: openai/muse-glimmer
      api_base: http://muse-glimmer:8000/v1
      api_key: none
      max_tokens: 16384
      # Meta's published sampling: temperature 1.0 / top_p 0.95 / top_k 64.
      # The model card warns against greedy decoding.
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
      stream_timeout: 300
    model_info:
      # muse-glimmer runs --max-model-len 262144; input + output must fit.
      # Keep in sync with ai/vllm/docker-compose.vllm.yml.
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true

  - model_name: qwen2.5-vl
    litellm_params:
      model: openai/Qwen/Qwen2.5-VL-7B-Instruct
      api_base: http://vllm-qwen-vl:8000/v1
      api_key: none
      max_tokens: 8192
      stream_timeout: 300
    model_info:
      mode: image

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      stream_timeout: 300

  # vLLM Semantic Router (ai/semantic-router/). One model name that picks a
  # decision from the request's signals and then runs a bounded multi-model
  # algorithm -- confidence escalation, a parallel ratings fan-out, or a
  # two-round remom reasoning loop -- over the aliases above.
  #
  # `openai/vllm-sr/auto` is not a provider path: `openai/` selects
  # LiteLLM's OpenAI-compatible client and `vllm-sr/auto` is the literal
  # model name in the request body. It must equal
  # global.router.auto_model_name in ai/semantic-router/config.yaml, which
  # is the ONE name that triggers auto-routing -- every other model name a
  # caller sends the router is treated as an explicit selection.
  #
  # api_base points at Envoy, not at the router: the router is an ext_proc
  # server behind that listener and has no OpenAI surface of its own.
  #
  # RECURSION: the router calls this same LiteLLM back, once per candidate,
  # with SEMANTIC_ROUTER_LITELLM_KEY. That key is scoped to the six concrete
  # aliases and must never be able to call `auto`. See
  # ai/semantic-router/SEMANTIC_ROUTER.md > Recursion guard.
  #
  # stream_timeout 1800 (not 300) because Envoy runs ext_proc with BUFFERED
  # request AND response bodies: nothing comes back until the last candidate
  # in the round has finished. This is the time-to-first-chunk budget for a
  # full ratings or remom turn, and it mirrors listeners[0].timeout: 1800s in
  # the router config. Lowering one without the other produces a LiteLLM
  # timeout on a request Envoy is still happily serving.
  #
  # ONLY ONE ROUTER ALIAS EXISTS ON PURPOSE. vllm-sr 0.3.0 has no
  # `entrypoints:` block and no per-algorithm model names -- UserConfig is
  # extra="forbid" over {version, listeners, providers, routing, global,
  # setup}, and algorithms attach to decisions, which are selected by
  # signals. So there is no `auto-fusion` / `auto-remom` / `auto-flow` /
  # `auto-ratings` to point at; the algorithm is chosen by what the user
  # asks, not by which alias they pick. (Fusion and Workflows do not exist
  # in this release at all -- the looper set is confidence / ratings /
  # remom.) Revisit when upstream ships multiple entrypoints.
  - model_name: auto
    litellm_params:
      model: openai/vllm-sr/auto
      api_base: http://vllm-sr-envoy:8899/v1
      api_key: os.environ/SEMANTIC_ROUTER_LISTENER_KEY
      max_tokens: 16384
      stream_timeout: 1800
    model_info:
      # The smallest window any candidate `auto` can actually land on:
      # qwen3.6 / qwen3.8 / qwen3.8-solo all cap at 114688. glm5.2 is
      # declared to the router but is not in any decision's modelRefs, so
      # its 32768 does not bind here. Raising this above the smallest
      # reachable candidate means the router accepts a prompt one of its own
      # rungs will reject mid-escalation.
      max_input_tokens: 114688
      max_output_tokens: 16384