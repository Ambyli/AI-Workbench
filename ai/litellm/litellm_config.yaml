  # -- local-private: LOCAL ONLY ----------------------------------------------
  # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  # !! NO CLAUDE DEPLOYMENT, AND NO ENTRY IN `fallbacks` OR                  !!
  # !! `context_window_fallbacks` -- EVER. This group serves the semantic    !!
  # !! router's privacy_local decision (PII / customer data) and is the      !!
  # !! `auto` fallback when the router itself is down, i.e. whenever nobody  !!
  # !! has checked the prompt for PII. Customer data must never reach       !!
  # !! Anthropic, so when both local models are busy the overflow hook       !!
  # !! returns the group unchanged and the request QUEUES inside vLLM, and   !!
  # !! when both are down it FAILS. Adding a cloud deployment, or a          !!
  # !! fallback entry for this alias, turns the privacy guarantee into a     !!
  # !! best-effort hint. Do not, not even "temporarily".                     !!
  # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  - model_name: local-private
