litellm_settings:
  num_retries: 1
  request_timeout: 300
  drop_params: true
  turn_off_message_logging: true
  json_logs: false
  enable_pre_call_checks: true
  context_window_fallbacks:
    - {"qwen3.6":       ["claude-sonnet-5"]}
    - {"qwen3.8":       ["claude-sonnet-5"]}
    - {"qwen3.8-flash": ["claude-sonnet-5"]}
    - {"glm5.2":        ["claude-sonnet-5"]}

general_settings:
  master_key: os.environ/DEFAULT_LITELLM_MASTER_KEY
  database_url: os.environ/DEFAULT_LITELLM_DATABASE_URL
  enable_metrics: true
  store_model_in_db: true
  default_max_tokens: 16384
  always_include_stream_usage: true
  pass_through_endpoints:
    - path: "/v1/classifier"
      target: "http://classifier:8000"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
    - path: "/v1/madlad"
      target: "http://madlad-api:8000"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
    - path: "/v1/interceptor"
      target: "http://interceptor:8080"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true
    - path: "/v1/roofix"
      target: "http://roofix:8080"
      include_subpath: true
      methods: ["GET", "POST"]
      forward_headers: true
    - path: "/v1/sandbox"
      target: "http://sandbox-runner:8000"
      include_subpath: true
      methods: ["GET", "POST", "DELETE"]
      forward_headers: true

mcp_servers:
  kokoro_tts:
    url: http://kokoro-api:8000/mcp
    transport: "http"

  madlad_translate:
    url: http://madlad-api:8000/mcp
    transport: "http"

  interceptor:
    url: http://interceptor:8080/mcp
    transport: "http"

  sandbox:
    url: http://sandbox-runner:8000/mcp
    transport: "http"

  trino:
    url: http://trino-mcp:8080/mcp
    transport: "http"

  phoenix:
    url: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_URL
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/DEFAULT_LITELLM_MCP_PHOENIX_AUTH_VALUE

  gmail:
    url: "https://gmailmcp.googleapis.com/mcp/v1"
    transport: "http"
    auth_type: oauth2
    oauth2_flow: authorization_code
    delegate_auth_to_upstream: true

model_list:
  - model_name: os.environ/DEFAULT_LITELLM_MODEL_NAME
    litellm_params:
      model: os.environ/DEFAULT_LITELLM_MODEL
      api_base: os.environ/DEFAULT_LITELLM_MODEL_API_BASE
      api_key: os.environ/DEFAULT_LITELLM_MODEL_API_KEY
      max_tokens: 16384
      stream_timeout: 300

  - model_name: kokoro
    litellm_params:
      model: openai/kokoro
      api_base: http://kokoro-api:8000/v1
      api_key: none
      stream_timeout: 300
    model_info:
      mode: audio

  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6
      api_base: http://qwen3.6:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 0.6
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8
    litellm_params:
      model: openai/qwen3.8
      api_base: http://qwen3.8:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: http://qwen3.8-flash:8000/v1
      api_key: none
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 20
        min_p: 0
      stream_timeout: 300
    model_info:
      max_input_tokens: 114688
      max_output_tokens: 16384

  - model_name: glm5.2
    litellm_params:
      model: openai/glm5.2
      api_base: http://glm5.2:8000/v1
      api_key: none
      max_tokens: 32768
      temperature: 1.0
      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 40
        min_p: 0
      stream_timeout: 600
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 32768

  - model_name: qwen2.5-vl
    litellm_params:
      model: openai/Qwen/Qwen2.5-VL-7B-Instruct
      api_base: http://vllm-qwen-vl:8000/v1
      api_key: none
      max_tokens: 8192
      stream_timeout: 300
    model_info:
      mode: image

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      stream_timeout: 300