      top_p: 0.95
      frequency_penalty: 0
      presence_penalty: 0
      extra_body:
        top_k: 64
      stream_timeout: 240
      timeout: 240
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true
