global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # LiteLLM authenticates /metrics (require_auth_for_metrics_endpoint defaults
  # to on) and answered this job 401 without a key. The key is a virtual key
  # restricted to the /metrics routes (`allowed_routes`), kept out of git in
  # ai/litellm/secrets/. Turning the auth off instead would publish /metrics on
  # https://api.zeoenergy.com/metrics, since the tunnel goes straight to
  # litellm. See ai/litellm/LITELLM.md > Prometheus scrape key.
  - job_name: "litellm"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/prometheus_metrics.key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: "classifier"
    static_configs:
      - targets: ["classifier:8000"]

  # vLLM Semantic Router. Metrics port is 9190 on the default /metrics path
  # (cli/consts.py DEFAULT_METRICS_PORT; cli/runtime_stack.py builds
  # http://<router>:9190/metrics, and the CLI's own bundled scrape config
  # cli/templates/prometheus.serve.yaml targets the same port with no
  # metrics_path override). 9190 is never published on the host — this
  # reaches it by service DNS over ai_shared, which is the only reason
  # vllm-sr-router joins that network at all.
  - job_name: "semantic-router"
    static_configs:
      - targets: ["vllm-sr-router:9190"]

  - job_name: "detector"
    static_configs:
      - targets: ["detector:8000"]

  # The ai/edge HAProxy's built-in Prometheus exporter (official image built
  # with USE_PROMEX=1). edge:8405 is an internal-only frontend on ai_shared,
  # never published. Per-backend health, sessions, 503s / 429s, queue time.
  # See ai/edge/EDGE.md > Metrics.
  - job_name: "edge"
    static_configs:
      - targets: ["edge:8405"]
