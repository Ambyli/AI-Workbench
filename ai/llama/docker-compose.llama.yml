networks:
  shared:
    external: true
    name: ai_shared

services:
  # Template — copy and rename to add another llama.cpp-served model:
  # some-model:
  #   networks:
  #     - shared
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda
  #   container_name: some-model
  #   restart: unless-stopped
  #   environment:
  #     - HF_TOKEN=${HF_TOKEN}
  #   ports:
  #     - "${PORT_LLAMA_SOME_MODEL}:8000"
  #   volumes:
  #     - llama_data:/root/.cache/huggingface
  #   runtime: nvidia
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   command: >
  #     -hf owner/repo:QUANT
  #     -a some-model
  #     --host 0.0.0.0 --port 8000
  #     -ngl 999
  #     -c 32768

  # Recreated (with downtime) by `make up`: it holds the model on GPUs (experts
  # offloaded to RAM) and publishes a host port; a second copy would need a
  # second copy's worth of VRAM and RAM.
  glm5.2:
    networks:
      - shared
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: glm5.2
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_GLM52}:8000"
    volumes:
      # llama-server stores -hf / -hfd downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub (override: LLAMA_CACHE / HF_HUB_CACHE).
      - llama_data:/root/.cache/huggingface
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    command: >
      -hf unsloth/GLM-5.2-GGUF:UD-IQ1_S
      -a glm5.2
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -ot "blk\.([0-9]|[12][0-9]|3[0-8])\.ffn_(gate|down|up)_exps\.=CPU"
      -ot "blk\.(39|4[0-9]|5[01])\.ffn_(gate|down|up)_exps\.=CUDA0"
      -ot "blk\.(5[2-9]|6[0-4])\.ffn_(gate|down|up)_exps\.=CUDA1"
      -ot "blk\.(6[5-9]|7[0-7])\.ffn_(gate|down|up)_exps\.=CUDA2"
      -c 65536
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      --load-mode none

  # Recreated (with downtime) by `make up`: it holds the model on a GPU and
  # publishes a host port; a second copy would need a second copy's worth of
  # VRAM.
  qwen3.8-flash:
    networks:
      - shared
    # NOT the stock ghcr.io/ggml-org/llama.cpp:server-cuda image. Mainline has no
    # MTP graph for the qwen4exp architecture (ggml-org/llama.cpp#28243 / #27836
    # still open), so the MTP draft head below cannot load there. Unsloth's
    # prebuilt "mix" releases carry the patch (unslothai/llama.cpp#144) — see
    # Dockerfile.llama-unsloth. Bump LLAMA_UNSLOTH_TAG in .env to upgrade, then
    # `up -d --build --force-recreate qwen3.8-flash`. LLAMA_UNSLOTH_VARIANT and
    # LLAMA_CUDA_RUNTIME_IMAGE must agree on the CUDA major (13.x here — the
    # host driver is R580 / CUDA 13.0).
    build:
      context: ../..
      dockerfile: ai/llama/Dockerfile.llama-unsloth
      args:
        LLAMA_UNSLOTH_TAG: ${LLAMA_UNSLOTH_TAG:-b10796-mix-659e406}
        LLAMA_UNSLOTH_VARIANT: ${LLAMA_UNSLOTH_VARIANT:-cuda13-portable}
        BASE_IMAGE: ${LLAMA_CUDA_RUNTIME_IMAGE:-nvidia/cuda:13.3.1-runtime-ubuntu22.04}
    image: llama-unsloth:${LLAMA_UNSLOTH_TAG:-b10796-mix-659e406}-${LLAMA_UNSLOTH_VARIANT:-cuda13-portable}
    # Local-only image name: never try to pull it from a registry. Without
    # this, `up` / `pull` print "pull access denied for llama-unsloth" before
    # falling back to the build (harmless, but noisy and confusing).
    pull_policy: build
    container_name: qwen3.8-flash
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_QWEN38_FLASH}:8000"
    volumes:
      # llama-server stores -hf / -hfd downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub (override: LLAMA_CACHE / HF_HUB_CACHE).
      - llama_data:/root/.cache/huggingface
      # Shared Qwen chat template — see ai/jinja/README.md. Same file the vLLM
      # `qwen3.8` service mounts. Kept read-only; --jinja below tells llama.cpp
      # to render it with its Jinja engine.
      - ../jinja/qwen_fixed_chat_template.jinja:/config/qwen_fixed_chat_template.jinja:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    # Sampling defaults are the "Thinking mode" values recommended on
    # https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
    #   temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0
    # These are server defaults; clients can override per-request via the
    # OpenAI-compatible fields (temperature, top_p, ...).
    #
    # SPECULATIVE DECODING via MTP (Multi-Token Prediction) draft head:
    # The repo ships companion heads under MTP/ (see MTP/README.md on the HF
    # page). llama-server runs the tiny head ahead to propose tokens and the
    # main model verifies them in one forward pass — output is unchanged,
    # Unsloth measures 1.3-1.7x tok/s at concurrency 1 with greedy sampling.
    #
    # How the two models are pulled:
    #   -hf  <repo>:<quant>   main model, quant TAG (not a path) after the colon
    #   -hfd <repo>           draft repo — same repo, NO tag
    #   -md  MTP/<file>.gguf  exact repo-relative path of the head. With -hfd
    #                         set, -md doubles as the HF file selector, so the
    #                         head auto-downloads into the llama_data cache next
    #                         to the main weights. A `repo:MTP/file` tag on -hfd
    #                         does NOT work (the tag is matched as a quant), and
    #                         sidecar auto-discovery never searches MTP/.
    #   --spec-type draft-mtp explicit; MTP/README.md: "Always pass -md".
    #   --spec-draft-n-max 2  README default (docs page shows 5). Higher drafts
    #                         more per verify pass but acceptance per token
    #                         drops. Measured on the 3x A6000 box at temp 1.0:
    #                         2 -> ~50 tok/s, 3 -> ~45 tok/s. Keep at 2.
    #   -devd CUDA2           pin the draft head to the GPU holding the main
    #                         model's output layer (last device under
    #                         --tensor-split 1,1,1). The shared-* head borrows
    #                         that tensor, so co-locating avoids a cross-GPU
    #                         copy on every draft step.
    # shared-Q8_0 is the README's recommended head: borrows the embedding and
    # output projection from the main model (~1.3 GB smaller) and is the fastest
    # measured. Because it borrows, the automatic --fit memory probe cannot load
    # it standalone and logs ONE expected error pair at startup:
    #   E llama_model_load: error loading model: borrow_shared_tensor: ...
    #   W operator(): failed to measure the memory of the extra model, fitting without it
    # Speculation still runs. -c / -ngl / --tensor-split are all set explicitly
    # below, so the unmeasured draft only matters if VRAM is already tight.
    # Confirm it is active by grepping the log for `draft acceptance =`.
    # Caveat: Unsloth measured MTP as a net LOSS (~0.85x) at concurrency 8 —
    # it pays off for one or two simultaneous streams, not a busy server.
    # Hence --parallel 2: two slots of 524288 ctx each (-c is split evenly
    # across slots). --n-predict 65536 is the hard per-request output cap;
    # the LiteLLM qwen3.8-flash entry mirrors it as max_tokens /
    # max_output_tokens with max_input_tokens = 524288 - 65536 = 458752.
    # Change the three together — llama-server clamps any client max_tokens
    # to --n-predict, and LiteLLM uses max_input_tokens to decide when to
    # fall back to claude-sonnet-5.
    # Split mode is the default `layer` pipeline. `--split-mode tensor` was
    # tried on b10796-mix-659e406 and refused at load:
    #   LLAMA_SPLIT_MODE_TENSOR not implemented for architecture 'qwen4exp'
    # `row` is not viable either — MoE expert tensors cannot be row-split, so
    # they all land on the main GPU and 111 GB of experts will not fit.
    # REASONING BUDGET: --reasoning-budget caps thinking at N tokens; when the
    # cap is hit llama-server injects --reasoning-budget-message into the
    # thought stream and closes the think block, so the model must answer or
    # call a tool. 8192 is well under the 65536 --n-predict output cap, so
    # long final answers are unaffected. -1 restores unlimited thinking.
    # Both flags exist in the pinned Unsloth build (b10796-mix-659e406).
    # Do NOT paste a `#` comment inside the `command: >` block — YAML's
    # folded scalar has no comment syntax and it'll be folded into the
    # command string as a literal `#`, breaking arg parsing.
    command: >
      -hf unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
      -hfd unsloth/Qwen3.8-Flash-Next-GGUF
      -md MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngld 999
      -devd CUDA2
      -a qwen3.8-flash
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -c 1048576
      --parallel 2
      --n-predict 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --flash-attn on
      --jinja
      --chat-template-file /config/qwen_fixed_chat_template.jinja
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --reasoning-budget 8192
      --reasoning-budget-message "Time to stop thinking. Give the final answer or make the tool call now."

  # Recreated (with downtime) by `make up`: its 148 GB model is mlocked in RAM,
  # which has room for one copy, and it publishes a host port.
  glm5.3-flash:
    networks:
      - shared
    # CPU-ONLY service — no `runtime: nvidia`, no GPU reservation. Weights, KV
    # cache and the MTP draft head all live in system RAM; the three A6000s
    # stay free for the vLLM / GPU llama services. Same Dockerfile as
    # qwen3.8-flash, but the `cpu` tarball flavour on a plain ubuntu:22.04
    # base (the tarballs are built on GitHub's ubuntu-22.04 runner).
    #
    # Why the Unsloth prebuild and not ghcr.io/ggml-org/llama.cpp:server:
    # mainline has NOT merged the glm5next architecture (GLM-5.3-Flash) —
    # ggml-org/llama.cpp#27754 is still open (2026-09-09) and the stock image
    # dies with `unknown model architecture: 'glm5next'`. Unsloth's mix
    # releases carry #27754; its head branch (unslothai glm5next/upstream)
    # also contains the NextN/MTP draft graph for this arch, so `--spec-type
    # draft-mtp` works. Pinned separately from qwen3.8-flash via
    # LLAMA_UNSLOTH_CPU_TAG so bumping one never rebuilds / re-validates the
    # other. Bump: edit .env, then
    #   docker compose -f ai/llama/docker-compose.llama.yml up -d --build --force-recreate glm5.3-flash
    build:
      context: ../..
      dockerfile: ai/llama/Dockerfile.llama-unsloth
      args:
        LLAMA_UNSLOTH_TAG: ${LLAMA_UNSLOTH_CPU_TAG:-b10840-mix-d5c17a0}
        LLAMA_UNSLOTH_VARIANT: cpu
        BASE_IMAGE: ubuntu:22.04
    image: llama-unsloth:${LLAMA_UNSLOTH_CPU_TAG:-b10840-mix-d5c17a0}-cpu
    # Local-only image name: never try to pull it from a registry.
    pull_policy: build
    container_name: glm5.3-flash
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_GLM53_FLASH}:8000"
    volumes:
      # llama-server stores -hf downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub. Shared with the other llama services.
      - llama_data:/root/.cache/huggingface
    # `--load-mode mmap+mlock` below pins the weights so the kernel cannot
    # page them out under memory pressure (a page-out on a 150 GB working set
    # means multi-second stalls per token). Docker's default memlock ulimit is
    # 64 KB, which makes mlock fail with a "failed to mlock" warning and fall
    # back to plain mmap — lift it here.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      # First start downloads ~148 GB (UD-Q3_K_XL) and then pages every byte
      # into RAM for mlock — well past the GPU services' 900 s.
      start_period: 1800s
    # MODEL CHOICE: GLM-5.3-Flash (321B total / 18B active, 288 experts, 8
    # routed per token) rather than full GLM-5.3 (754B / 40B active). On a
    # CPU-only ~200 GB box the full model does not fit at any quant (smallest
    # UD-IQ1_S is 217 GB) and its 40B active params would also read >2x the
    # bytes per token — CPU decode is memory-bandwidth bound, so tok/s scales
    # with active bytes, not total size. Z.ai reports Flash beating GLM-5.2 on
    # their benchmarks anyway.
    #
    # QUANT (LLAMA_GLM53_FLASH_QUANT): K-quants only. IQ*_XXS / IQ1 / IQ2 use
    # codebook lookups with no fast CPU matmul path and run roughly half the
    # speed of a K-quant of similar size on CPU. Sizes from the model card:
    #   UD-Q2_K_XL  109 GB  ~78% accuracy retained  — fallback if RAM is tight
    #   UD-Q3_K_XL  148 GB  (default)               — fits 200 GB with ~50 GB spare
    #   UD-Q4_K_XL  200 GB  ~93% accuracy retained  — needs a 256 GB+ RAM upgrade
    # Whatever the quant, the WHOLE file is mlocked: weights + ~10-15 GB for KV,
    # compute buffers and the draft head must fit in free RAM alongside every
    # other container on the box — glm5.2's CPU-offloaded experts (blk 0-38 via
    # -ot, ~70 GB at UD-IQ1_S) do not coexist with this service in 200 GB.
    #
    # THREADS / NUMA: -t is left at llama.cpp's default (= physical cores the
    # container can see). On a dual-socket host add `--numa distribute` (and
    # drop the page cache first, per the flag's own help text) through
    # LLAMA_GLM53_FLASH_EXTRA_ARGS — it is the single biggest CPU knob and
    # cannot be guessed from here.
    #
    # MTP SPECULATIVE DECODING: the NextN draft head is embedded in the main
    # GGUF (blk.45.nextn.* tensors — 45 trunk layers + 1 NextN block), so there
    # is no -hfd / -md pair like qwen3.8-flash; `--spec-type draft-mtp` alone
    # makes llama-server load the extra layer and run it as the drafter.
    # Verification is exact, so output is unchanged. The upstream MTP PR for
    # this arch (ggml-org/llama.cpp#27917) measures acceptance 0.74 / mean
    # draft len 4.1 and a 15-30% decode speedup on a heavily CPU-bound box at
    # n_max 3; Unsloth measures up to 3.3x at long context on GPU. CPU decode
    # is bandwidth bound, so verifying 3 tokens costs about the same weight
    # traffic as 1 — n_max 3 rather than the GPU-tuned 2. Confirm it is on
    # by grepping the log for `draft acceptance =`. If tok/s is worse with
    # it (many concurrent streams, or high sampling temperature lowering
    # acceptance), delete the two --spec-* lines.
    #
    # CONTEXT / OUTPUT: -c 262144 with --parallel 1 = one 256k slot. KV is
    # cheap here (MLA/DSA layers + recurrent KDA state), so RAM is not the
    # limit — CPU prefill is: expect low hundreds of tok/s for prompt
    # processing, i.e. minutes for a 100k-token prompt (llama-server's slot
    # prompt cache means only the new suffix is re-processed on follow-ups).
    # --n-predict 32768 caps output per request; the LiteLLM glm5.3-flash
    # entry mirrors it (max_tokens / max_output_tokens = 32768,
    # max_input_tokens = 262144 - 32768 = 229376). Change all three together.
    #
    # THINKING: the GGUF's chat template reads reasoning_effort from
    # --chat-template-kwargs and accepts exactly 'low' | 'high'; anything
    # else (including 'medium') falls through to 'max'. At CPU speeds a
    # 'max' think block can run 20k+ tokens = tens of minutes per turn, so
    # the default is 'low' (LLAMA_GLM53_FLASH_REASONING_EFFORT) plus the
    # --reasoning-budget hard cap: when 8192 thinking tokens are hit,
    # llama-server injects --reasoning-budget-message and closes the think
    # block so the model must answer or call a tool. -1 disables the cap.
    #
    # SAMPLING: model card defaults temperature 1.0 / top_p 0.95 (DeepSWE-style
    # agentic coding: 0.95 / 1.0). Server defaults; clients override per call.
    #
    # Deliberately NOT set: -ngl (this build has no GPU backend), -t (see
    # above), --cache-type-k/-v (MLA KV is small; f16 keeps the DSA indexer
    # path exact), --flash-attn (auto). NVIDIA-only workarounds from the
    # #27754 thread (NVIDIA_TF32_OVERRIDE=0, -fa off) do not apply on CPU.
    # Do NOT paste a `#` comment inside the `command: >` block — YAML's folded
    # scalar has no comment syntax and it would become a literal argument.
    command: >
      -hf unsloth/GLM-5.3-Flash-GGUF:${LLAMA_GLM53_FLASH_QUANT:-UD-Q3_K_XL}
      -a glm5.3-flash
      --host 0.0.0.0 --port 8000
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -c 262144
      --parallel 1
      --n-predict 32768
      --load-mode mmap+mlock
      --jinja
      --chat-template-kwargs '{"reasoning_effort":"${LLAMA_GLM53_FLASH_REASONING_EFFORT:-low}"}'
      --reasoning-budget 8192
      --reasoning-budget-message "Time to stop thinking. Give the final answer or make the tool call now."
      --temp 1.0
      --top-p 0.95
      ${LLAMA_GLM53_FLASH_EXTRA_ARGS:-}

  # Recreated (with downtime) by `make up`: it loads its model into RAM before
  # it answers and publishes a host port, which a second copy could not bind.
  qwen3.5-4b:
    networks:
      - shared
    # CPU-ONLY, like glm5.3-flash: no `runtime: nvidia`, no GPU reservation.
    # A small text model for route-policy's `llm_classifier` evaluator, which
    # reaches it ONLY through the document classifier's model registry
    # (ai/classifier/models.yaml, entry `qwen3.5-4b`): route-policy submits a
    # rendered transcript to POST /assess and the classifier calls this
    # server. It is NOT in LiteLLM, so it is in no chain and no fallback.
    #
    # Same build and image as glm5.3-flash: Qwen3.5's hybrid Gated DeltaNet
    # architecture is in mainline llama.cpp, and the Unsloth cpu build is
    # mainline plus extras, already running on the box. One image for both
    # CPU services, so bumping LLAMA_UNSLOTH_CPU_TAG rebuilds and recreates
    # both:
    #   docker compose -f ai/llama/docker-compose.llama.yml up -d --build --force-recreate glm5.3-flash qwen3.5-4b
    build:
      context: ../..
      dockerfile: ai/llama/Dockerfile.llama-unsloth
      args:
        LLAMA_UNSLOTH_TAG: ${LLAMA_UNSLOTH_CPU_TAG:-b10840-mix-d5c17a0}
        LLAMA_UNSLOTH_VARIANT: cpu
        BASE_IMAGE: ubuntu:22.04
    image: llama-unsloth:${LLAMA_UNSLOTH_CPU_TAG:-b10840-mix-d5c17a0}-cpu
    # Local-only image name: never try to pull it from a registry.
    pull_policy: build
    container_name: qwen3.5-4b
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_QWEN35_4B}:8000"
    volumes:
      # llama-server stores -hf downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub. Shared with the other llama services.
      - llama_data:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      # First start downloads ~2.7 GB (Q4_K_M): minutes at worst, not the
      # half hour glm5.3-flash's 148 GB needs.
      start_period: 600s
    # QUANT (LLAMA_QWEN35_4B_QUANT): Q4_K_M, 2.74 GB. K-quants only on CPU
    # (see glm5.3-flash). Q6_K (3.53 GB) / Q8_0 (4.48 GB) are the steps up if
    # the benchmark says quality, not speed, is what limits it.
    #
    # TEXT ONLY: the repo also ships a vision projector (mmproj-*.gguf,
    # ~670 MB), which -hf downloads and loads by default. --no-mmproj skips
    # both; the classifier entry is `vision: false` and never sends an image.
    #
    # NO MLOCK, unlike glm5.3-flash: a 2.7 GB file read on every token stays
    # hot in the page cache, and if the kernel does evict it while the model
    # is idle, re-reading it costs a second or two on the next call — not the
    # per-token stalls of a 150 GB working set. So no --load-mode
    # mmap+mlock and no memlock ulimit.
    #
    # THREADS: .env.example sets -t 16 (LLAMA_QWEN35_4B_THREADS) together
    # with `--cpu-range 0-15` (`-Cr`, in LLAMA_QWEN35_4B_EXTRA_ARGS): the
    # box's 32 vCPUs are split 0-15 for this model, 24-31 for the signals
    # sidecar (its own cpuset, SIGNALS_CPUSET; ai/signals/SIGNALS.md) and
    # 16-23 for everything else. glm5.3-flash, which takes every physical
    # core by default, has been off for months; at -t 8 unpinned a verdict
    # took ~60-100 s (prompt 25-50 tok/s), so this model gets 16 idle cores.
    # The fallback below stays 8 on purpose: 16 threads only make sense with
    # the range, and a .env without the two lines keeps the old behaviour.
    # Before turning glm5.3-flash on, give it a range outside 0-15 and 24-31
    # through LLAMA_GLM53_FLASH_EXTRA_ARGS — a range on one side only still
    # lets the other's threads run on those cores.
    #
    # CONTEXT / OUTPUT: -c 32768 with --parallel 2 = two 16k slots, one per
    # classifier request in flight (the registry entry's max_concurrent: 2).
    # A scoring prompt is the transcript (text_char_budget 12000 characters,
    # ~3-4k tokens) plus ~600 tokens of rubric, and --n-predict 512 caps the
    # answer — the entry's max_tokens.score. Change the three together.
    #
    # THINKING: Qwen3.5 thinks by default; its template reads enable_thinking.
    # A classifier call wants the JSON answer, not minutes of CPU reasoning,
    # so the server default is off (the registry entry also sends it per
    # request). A request that sends enable_thinking: true still turns it on.
    #
    # SAMPLING: the model card's instruct (non-thinking) preset — temperature
    # 0.7, top_p 0.8, top_k 20, min_p 0 — WITHOUT its presence_penalty 1.5.
    # The classifier sends no sampling of its own (llm/prompts.py: the server
    # applies the model's published sampling, like every registry model), so
    # these are what every scoring call gets. A presence penalty lowers every
    # token already in the answer, and a ~100-token JSON answer is mostly
    # repetition by design: the quotes, colons and keys of the scaffold, and
    # the digits of `score` again in `confidence`. It is a guard against long
    # free-text loops, which --n-predict 512 caps here anyway; the card's own
    # precise-coding preset sets it to 0 too.
    #
    # Do NOT paste a `#` comment inside the `command: >` block — YAML's folded
    # scalar has no comment syntax and it would become a literal argument.
    command: >
