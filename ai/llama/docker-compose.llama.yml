networks:
  shared:
    external: true
    name: ai_shared

services:
  # Template — copy and rename to add another llama.cpp-served model:
  # some-model:
  #   networks:
  #     - shared
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda
  #   container_name: some-model
  #   restart: unless-stopped
  #   environment:
  #     - HF_TOKEN=${HF_TOKEN}
  #   ports:
  #     - "${PORT_LLAMA_SOME_MODEL}:8000"
  #   volumes:
  #     - llama_data:/root/.cache/huggingface
  #   runtime: nvidia
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   command: >
  #     -hf owner/repo:QUANT
  #     -a some-model
  #     --host 0.0.0.0 --port 8000
  #     -ngl 999
  #     -c 32768

  glm5.2:
    networks:
      - shared
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: glm5.2
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_GLM52}:8000"
    volumes:
      - llama_data:/root/.cache/huggingface
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    command: >
      -hf unsloth/GLM-5.2-GGUF:UD-IQ1_S
      -a glm5.2
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -ot "blk\.([0-9]|[12][0-9]|3[0-8])\.ffn_(gate|down|up)_exps\.=CPU"
      -ot "blk\.(39|4[0-9]|5[01])\.ffn_(gate|down|up)_exps\.=CUDA0"
      -ot "blk\.(5[2-9]|6[0-4])\.ffn_(gate|down|up)_exps\.=CUDA1"
      -ot "blk\.(6[5-9]|7[0-7])\.ffn_(gate|down|up)_exps\.=CUDA2"
      -c 65536
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      --load-mode none

  qwen3.8-flash:
    networks:
      - shared
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen3.8-flash
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_QWEN38_FLASH}:8000"
    volumes:
      - llama_data:/root/.cache/huggingface
      # Shared Qwen chat template — see ai/jinja/README.md. Same file the vLLM
      # `qwen3.8` service mounts. Kept read-only; --jinja below tells llama.cpp
      # to render it with its Jinja engine.
      - ../jinja/qwen_fixed_chat_template.jinja:/config/qwen_fixed_chat_template.jinja:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    # Sampling defaults are the "Thinking mode" values recommended on
    # https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
    #   temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0
    # These are server defaults; clients can override per-request via the
    # OpenAI-compatible fields (temperature, top_p, ...).
    #
    # SPECULATIVE DECODING via MTP (Multi-Token Prediction) draft model:
    # The model ships companion MTP draft files (see the HF page). llama-server
    # runs the tiny draft ahead to propose 4-16 tokens per step and the main
    # 125B/6B-active model verifies them in one forward pass — Unsloth claims
    # 1.3-1.7x tok/s uplift with no quality loss.
    # The MTP draft lives at MTP/mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf inside
    # the same repo — MTP/ is a directory containing multiple quants (Q4_K_M,
    # Q8_0, BF16, plus shared-embedding variants), so the tag after the colon
    # is the full file path relative to repo root, not a quant tag.
    #
    # ⚠ If `-hfd` with a file-path tag still errors on startup, fall back
    # to the pre-downloaded local-file variant by replacing the `-hfd ...`
    # line in the command block with:
    #   --model-draft /root/.cache/huggingface/mtp-Q4_K_M.gguf
    # after downloading the file into the llama_data volume:
    #   docker run --rm -v ai-llama_llama_data:/c curlimages/curl \
    #     -sL -o /c/mtp-Q4_K_M.gguf \
    #     https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF/resolve/main/MTP/mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf
    # Do NOT paste a `#` comment inside the `command: >` block — YAML's
    # folded scalar has no comment syntax and it'll be folded into the
    # command string as a literal `#`, breaking arg parsing.
    command: >
      -hf unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
      -hfd unsloth/Qwen3.8-Flash-Next-GGUF:MTP/mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf
      -ngld 999
      --spec-draft-n-max 16
      --spec-draft-n-min 4
      -a qwen3.8-flash
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -c 1048576
      --parallel 4
      --n-predict 16384
      --cache-type-k q8_0
      --cache-type-v q8_0
      --flash-attn on
      --jinja
      --chat-template-file /config/qwen_fixed_chat_template.jinja
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0

volumes:
  llama_data:
