networks:
  shared:
    external: true
    name: ai_shared

services:
  # Template — copy and rename to add another llama.cpp-served model:
  # some-model:
  #   networks:
  #     - shared
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda
  #   container_name: some-model
  #   restart: unless-stopped
  #   environment:
  #     - HF_TOKEN=${HF_TOKEN}
  #   ports:
  #     - "${PORT_LLAMA_SOME_MODEL}:8000"
  #   volumes:
  #     - llama_data:/root/.cache/huggingface
  #   runtime: nvidia
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   command: >
  #     -hf owner/repo:QUANT
  #     -a some-model
  #     --host 0.0.0.0 --port 8000
  #     -ngl 999
  #     -c 32768

  glm5.2:
    networks:
      - shared
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: glm5.2
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_GLM52}:8000"
    volumes:
      # llama-server stores -hf / -hfd downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub (override: LLAMA_CACHE / HF_HUB_CACHE).
      - llama_data:/root/.cache/huggingface
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    command: >
      -hf unsloth/GLM-5.2-GGUF:UD-IQ1_S
      -a glm5.2
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -ot "blk\.([0-9]|[12][0-9]|3[0-8])\.ffn_(gate|down|up)_exps\.=CPU"
      -ot "blk\.(39|4[0-9]|5[01])\.ffn_(gate|down|up)_exps\.=CUDA0"
      -ot "blk\.(5[2-9]|6[0-4])\.ffn_(gate|down|up)_exps\.=CUDA1"
      -ot "blk\.(6[5-9]|7[0-7])\.ffn_(gate|down|up)_exps\.=CUDA2"
      -c 65536
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      --load-mode none

  qwen3.8-flash:
    networks:
      - shared
    # NOT the stock ghcr.io/ggml-org/llama.cpp:server-cuda image. Mainline has no
    # MTP graph for the qwen4exp architecture (ggml-org/llama.cpp#28243 / #27836
    # still open), so the MTP draft head below cannot load there. Unsloth's
    # prebuilt "mix" releases carry the patch (unslothai/llama.cpp#144) — see
    # Dockerfile.llama-unsloth. Bump LLAMA_UNSLOTH_TAG in .env to upgrade, then
    # `up -d --build --force-recreate qwen3.8-flash`.
    build:
      context: ../..
      dockerfile: ai/llama/Dockerfile.llama-unsloth
      args:
        LLAMA_UNSLOTH_TAG: ${LLAMA_UNSLOTH_TAG:-b10796-mix-659e406}
        LLAMA_UNSLOTH_VARIANT: ${LLAMA_UNSLOTH_VARIANT:-cuda12-portable}
    image: llama-unsloth:${LLAMA_UNSLOTH_TAG:-b10796-mix-659e406}-${LLAMA_UNSLOTH_VARIANT:-cuda12-portable}
    container_name: qwen3.8-flash
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_ARG_HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_LLAMA_QWEN38_FLASH}:8000"
    volumes:
      # llama-server stores -hf / -hfd downloads in a HF-hub layout under
      # $HOME/.cache/huggingface/hub (override: LLAMA_CACHE / HF_HUB_CACHE).
      - llama_data:/root/.cache/huggingface
      # Shared Qwen chat template — see ai/jinja/README.md. Same file the vLLM
      # `qwen3.8` service mounts. Kept read-only; --jinja below tells llama.cpp
      # to render it with its Jinja engine.
      - ../jinja/qwen_fixed_chat_template.jinja:/config/qwen_fixed_chat_template.jinja:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    # Sampling defaults are the "Thinking mode" values recommended on
    # https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
    #   temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0
    # These are server defaults; clients can override per-request via the
    # OpenAI-compatible fields (temperature, top_p, ...).
    #
    # SPECULATIVE DECODING via MTP (Multi-Token Prediction) draft head:
    # The repo ships companion heads under MTP/ (see MTP/README.md on the HF
    # page). llama-server runs the tiny head ahead to propose tokens and the
    # main model verifies them in one forward pass — output is unchanged,
    # Unsloth measures 1.3-1.7x tok/s at concurrency 1 with greedy sampling.
    #
    # How the two models are pulled:
    #   -hf  <repo>:<quant>   main model, quant TAG (not a path) after the colon
    #   -hfd <repo>           draft repo — same repo, NO tag
    #   -md  MTP/<file>.gguf  exact repo-relative path of the head. With -hfd
    #                         set, -md doubles as the HF file selector, so the
    #                         head auto-downloads into the llama_data cache next
    #                         to the main weights. A `repo:MTP/file` tag on -hfd
    #                         does NOT work (the tag is matched as a quant), and
    #                         sidecar auto-discovery never searches MTP/.
    #   --spec-type draft-mtp explicit; MTP/README.md: "Always pass -md".
    #   --spec-draft-n-max 2  README default (docs page shows 5); higher drafts
    #                         more but acceptance per token drops.
    # shared-Q8_0 is the README's recommended head: borrows the embedding and
    # output projection from the main model (~1.3 GB smaller) and is the fastest
    # measured. Because it borrows, the automatic --fit memory probe cannot load
    # it standalone and logs ONE expected error pair at startup:
    #   E llama_model_load: error loading model: borrow_shared_tensor: ...
    #   W operator(): failed to measure the memory of the extra model, fitting without it
    # Speculation still runs. -c / -ngl / --tensor-split are all set explicitly
    # below, so the unmeasured draft only matters if VRAM is already tight.
    # Confirm it is active by grepping the log for `draft acceptance =`.
    # Caveat: Unsloth measured MTP as a net LOSS (~0.85x) at concurrency 8 —
    # it pays off for one or two simultaneous streams, not a busy server.
    # Hence --parallel 2: two slots of 524288 ctx each (-c is split evenly
    # across slots). --n-predict 65536 is the hard per-request output cap;
    # the LiteLLM qwen3.8-flash entry mirrors it as max_tokens /
    # max_output_tokens with max_input_tokens = 524288 - 65536 = 458752.
    # Change the three together — llama-server clamps any client max_tokens
    # to --n-predict, and LiteLLM uses max_input_tokens to decide when to
    # fall back to claude-sonnet-5.
    # Split mode is the default `layer` pipeline. `--split-mode tensor` was
    # tried on b10796-mix-659e406 and refused at load:
    #   LLAMA_SPLIT_MODE_TENSOR not implemented for architecture 'qwen4exp'
    # `row` is not viable either — MoE expert tensors cannot be row-split, so
    # they all land on the main GPU and 111 GB of experts will not fit.
    # Do NOT paste a `#` comment inside the `command: >` block — YAML's
    # folded scalar has no comment syntax and it'll be folded into the
    # command string as a literal `#`, breaking arg parsing.
    command: >
      -hf unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
      -hfd unsloth/Qwen3.8-Flash-Next-GGUF
      -md MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngld 999
      -a qwen3.8-flash
      --host 0.0.0.0 --port 8000
      -ngl 999
      --tensor-split 1,1,1
      -c 1048576
      --parallel 2
      --n-predict 65536
      --cache-type-k q8_0
      --cache-type-v q8_0
      --flash-attn on
      --jinja
      --chat-template-file /config/qwen_fixed_chat_template.jinja
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0

volumes:
  llama_data:
