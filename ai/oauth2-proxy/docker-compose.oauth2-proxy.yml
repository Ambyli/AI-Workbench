networks:
  shared:
    external: true
    name: ai_shared

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    networks:
      - shared
    restart: unless-stopped
    ports:
      - "${PORT_OAUTH2_PROXY}:4180"
    volumes:
      - ./sa-key.json:/etc/oauth2-proxy/sa-key.json:ro
      - ./templates:/etc/oauth2-proxy/templates:ro
    environment:
      # All values are sourced from .env — edit there, not here.

      # Provider + listener
      OAUTH2_PROXY_PROVIDER: "${OAUTH2_PROXY_PROVIDER}"
      OAUTH2_PROXY_HTTP_ADDRESS: "${OAUTH2_PROXY_HTTP_ADDRESS}"
      OAUTH2_PROXY_REVERSE_PROXY: "${OAUTH2_PROXY_REVERSE_PROXY}"

      # Identity headers passed to Open WebUI
      OAUTH2_PROXY_PASS_USER_HEADERS: "${OAUTH2_PROXY_PASS_USER_HEADERS}"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "${OAUTH2_PROXY_SET_XAUTHREQUEST}"

      # OAuth client — reused from Open WebUI's Google OAuth 2.0 client.
      OAUTH2_PROXY_CLIENT_ID: "${OPENWEBUI_GOOGLE_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OPENWEBUI_GOOGLE_CLIENT_SECRET}"

      # Session / cookie config
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_DOMAINS: "${OAUTH2_PROXY_COOKIE_DOMAINS}"
      OAUTH2_PROXY_COOKIE_EXPIRE: "${OAUTH2_PROXY_COOKIE_EXPIRE}"
      OAUTH2_PROXY_COOKIE_REFRESH: "${OAUTH2_PROXY_COOKIE_REFRESH}"
      # SameSite=none lets the cookie flow in cross-site subresource
      # requests (needed for sandbox iframes rendered inside OpenWebUI's
      # tool-result frame). See .env for the full rationale.
      OAUTH2_PROXY_COOKIE_SAMESITE: "${OAUTH2_PROXY_COOKIE_SAMESITE:-lax}"

      # Routing
      OAUTH2_PROXY_UPSTREAMS: "${OAUTH2_PROXY_UPSTREAMS}"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_REDIRECT_URL}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${OAUTH2_PROXY_WHITELIST_DOMAINS}"

      # Access rules — Google Workspace domain + group gating
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OAUTH2_PROXY_EMAIL_DOMAINS}"
      OAUTH2_PROXY_GOOGLE_GROUPS: "${OAUTH2_PROXY_GOOGLE_GROUPS}"
      OAUTH2_PROXY_GOOGLE_ADMIN_EMAIL: "${OAUTH2_PROXY_GOOGLE_ADMIN_EMAIL}"
      OAUTH2_PROXY_GOOGLE_SERVICE_ACCOUNT_JSON: "${OAUTH2_PROXY_GOOGLE_SERVICE_ACCOUNT_JSON}"

      # Branded sign-in and error pages. See ai/oauth2-proxy/OAUTH2_PROXY.md.
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: "${OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR}"

      # Skip auth for the /assets/ prefix so the sign-in / error pages can
      # <img src="/assets/logo.png"> before the user is signed in. The path
      # is served by the `oauth2-assets` sidecar below via multi-upstream
      # routing (longest-prefix match in OAUTH2_PROXY_UPSTREAMS).
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "${OAUTH2_PROXY_SKIP_AUTH_ROUTES}"

  # Serves the repo's assets/ folder over the ai_shared network at
  # http://oauth2-assets:80/assets/*. oauth2-proxy routes /assets/* here
  # via multi-upstream longest-prefix match; skip-auth lets browsers fetch
  # the logo pre-login. Only files under assets/ are exposed.
  oauth2-assets:
    image: nginx:alpine
    container_name: oauth2-assets
    networks:
      - shared
    restart: unless-stopped
    volumes:
      - ../../assets:/usr/share/nginx/html/assets:ro

  # Second oauth2-proxy instance — fronts n8n on its own subdomain
  # (n8n.zeoenergy.com). Colocated with the openwebui-side oauth2-proxy
  # above so all SSO gates live in one file. Shares SA-key + branded
  # templates + Google OAuth client with the openwebui instance; distinct
  # cookie name / secret / redirect URL / upstream / cookie domain.
  #
  # Why a second instance instead of adding n8n to OAUTH2_PROXY_UPSTREAMS
  # above? n8n's built-in subpath routing (`N8N_PATH=/n8n/`) is broken
  # upstream (n8n-io/n8n#19635, #18596) as of 1.108.2 — static assets
  # hit the SPA fallback and return HTML. Subdomain deployment sidesteps
  # the bug, and a second oauth2-proxy is the cheapest way to gate a
  # second hostname without migrating the existing instance to alpha
  # config with per-Host routing.
  #
  # Cloudflare tunnel maps n8n.zeoenergy.com → oauth2-proxy-n8n:4180.
  oauth2-proxy-n8n:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy-n8n
    networks:
      - shared
    restart: unless-stopped
    volumes:
      # Shared with the openwebui oauth2-proxy above — one SA key + one
      # template set. Same paths as the openwebui service (same directory).
      - ./sa-key.json:/etc/oauth2-proxy/sa-key.json:ro
      - ./templates:/etc/oauth2-proxy/templates:ro
    environment:
      # All values sourced from .env — edit there, not here.

      # Shared with the openwebui oauth2-proxy (same tenant, same access gate).
      OAUTH2_PROXY_PROVIDER: "${OAUTH2_PROXY_PROVIDER}"
      OAUTH2_PROXY_HTTP_ADDRESS: "${OAUTH2_PROXY_HTTP_ADDRESS}"
      OAUTH2_PROXY_REVERSE_PROXY: "${OAUTH2_PROXY_REVERSE_PROXY}"
      OAUTH2_PROXY_PASS_USER_HEADERS: "${OAUTH2_PROXY_PASS_USER_HEADERS}"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "${OAUTH2_PROXY_SET_XAUTHREQUEST}"
      OAUTH2_PROXY_CLIENT_ID: "${OPENWEBUI_GOOGLE_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OPENWEBUI_GOOGLE_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_EXPIRE: "${OAUTH2_PROXY_COOKIE_EXPIRE}"
      OAUTH2_PROXY_COOKIE_REFRESH: "${OAUTH2_PROXY_COOKIE_REFRESH}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OAUTH2_PROXY_EMAIL_DOMAINS}"
      OAUTH2_PROXY_GOOGLE_GROUPS: "${OAUTH2_PROXY_GOOGLE_GROUPS}"
      OAUTH2_PROXY_GOOGLE_ADMIN_EMAIL: "${OAUTH2_PROXY_GOOGLE_ADMIN_EMAIL}"
      OAUTH2_PROXY_GOOGLE_SERVICE_ACCOUNT_JSON: "${OAUTH2_PROXY_GOOGLE_SERVICE_ACCOUNT_JSON}"
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: "${OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR}"

      # Instance-specific overrides. Distinct cookie name so cookies don't
      # collide with the chat.zeoenergy.com session; distinct cookie secret
      # so signing keys are independent; distinct redirect URL / whitelist
      # / upstream / cookie domain for the subdomain.
      OAUTH2_PROXY_COOKIE_NAME: "${OAUTH2_PROXY_N8N_COOKIE_NAME}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_N8N_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_DOMAINS: "${OAUTH2_PROXY_N8N_COOKIE_DOMAINS}"
      OAUTH2_PROXY_COOKIE_SAMESITE: "${OAUTH2_PROXY_N8N_COOKIE_SAMESITE}"
      OAUTH2_PROXY_UPSTREAMS: "${OAUTH2_PROXY_N8N_UPSTREAMS}"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_N8N_REDIRECT_URL}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${OAUTH2_PROXY_N8N_COOKIE_DOMAINS}"
