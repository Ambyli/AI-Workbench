<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Zeo AI Chat</title>
<link rel="icon" type="image/png" href="/assets/Zeo%20Favicon%20Black.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0b;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #141414;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .logo {
    width: 220px;
    max-width: 100%;
    height: auto;
    margin-bottom: 28px;
    background: #ffffff;
    padding: 18px 24px;
    border-radius: 10px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: #ffffff;
  }
  .subtitle {
    font-size: 14px;
    color: #a3a3a3;
    margin: 0 0 28px 0;
    line-height: 1.5;
  }
  .alert {
    background: #3a1a1a;
    border: 1px solid #5a2222;
    color: #ffb4b4;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: left;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 12px 16px;
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #e6e6e6; }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #666666;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" alt="Zeo Energy" src="/assets/ZEO%20Gif.gif">
    <h1>Sign in to Zeo AI Chat</h1>
    <p class="subtitle">Use your Zeo Energy Google account to continue.</p>

    {{ if or (eq .StatusCode 400) (eq .StatusCode 401) }}
    <div class="alert" role="alert">Sign-in failed. Please try again with your @zeoenergy.com account.</div>
    {{ end }}

    <form method="GET" action="{{.ProxyPrefix}}/start">
      <input type="hidden" name="rd" value="{{.Redirect}}">
      <button class="btn" type="submit">Sign in with {{.ProviderName}}</button>
    </form>

    {{ if and (ne .Footer "-") (ne .Footer "") }}
    <p class="footer">{{.Footer}}</p>
    {{ end }}
  </div>
</body>
</html>
