networks:
  shared:
    external: true
    name: ai_shared

  # Second, deliberately narrow network shared ONLY with open-terminal
  # (ai/open-terminal/docker-compose.open-terminal.yml). The terminal is a
  # root-capable shell driven by a model, so it is kept off ai_shared — from
  # there it could reach roofix-db / sandbox-db / minio (all dev-default
  # credentials), litellm, n8n's credential store, and sandbox-runner, which
  # mounts docker.sock. openwebui straddles both networks because its backend
  # is the ONLY thing that proxies terminal traffic; the browser never talks
  # to open-terminal directly and never sees the API key.
  # Created by `make network`. See ai/open-terminal/OPEN_TERMINAL.md.
  terminal:
    external: true
    name: terminal_net

services:
  openwebui:
    # Locally built: upstream's pinned release plus ai/openwebui/patches/*.patch
    # (Dockerfile.openwebui; OPENWEBUI.md § Custom image). The upstream tag is
    # OPENWEBUI_VERSION in .env. Bump it, then
    #   make build openwebui && make up openwebui
    # A patch that no longer applies fails the build — regenerate it, never force.
    build:
      context: ../..
      dockerfile: ai/openwebui/Dockerfile.openwebui
      args:
        OPENWEBUI_VERSION: ${OPENWEBUI_VERSION:-v0.11.3}
    image: openwebui-zeo:${OPENWEBUI_VERSION:-v0.11.3}
    # Local-only image name: never try to pull it from a registry.
    pull_policy: build
    networks:
      - shared
      # Adding terminal_net changes the container's network list, so applying
      # it needs a RECREATE (`make up openwebui`), not a restart.
      - terminal
    container_name: openwebui
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 (host-loopback) ONLY — NOT 0.0.0.0.
      #
      # Trusted-header SSO (WEBUI_AUTH_TRUSTED_EMAIL_HEADER below) signs in
      # whoever X-Forwarded-Email names. Stock upstream would accept that
      # header from anyone who can reach :8080; the Zeo patch
      # (WEBUI_AUTH_TRUSTED_ACCESS_TOKEN_HEADER) additionally demands that
      # account's live Google access token, so a bare header is no longer
      # enough. The loopback bind stays regardless — it is free, and it keeps
      # the stock behaviour safe should the patch ever be disabled.
      #
      # External access still works: cloudflared → oauth2-proxy → openwebui
      # all happen over the ai_shared Docker network, none of which uses
      # this host publish. Only direct-from-host debugging (curl on the
      # server itself, or a local browser hitting http://localhost:8007)
      # goes through the loopback binding.
      #
      # If you re-open this to 0.0.0.0, you MUST also blank out
      # OPENWEBUI_WEBUI_AUTH_TRUSTED_EMAIL_HEADER / _NAME_HEADER in .env,
      # or every LAN device becomes an admin account creator.
      - "127.0.0.1:${PORT_OPENWEBUI}:8080"
    environment:
      # All values are sourced from .env — edit there, not here.
      OPENAI_API_BASE_URL: "${OPENWEBUI_OPENAI_API_BASE_URL}"
      OPENAI_API_KEY: "${OPENWEBUI_OPENAI_API_KEY}"
      ENABLE_OLLAMA_API: "${OPENWEBUI_ENABLE_OLLAMA_API}"
      # Display name — tab title, PWA manifest, OpenSearch descriptor.
      # Open WebUI force-appends " (Open WebUI)" to any value other than
      # "Open WebUI" itself. Read on EVERY boot, unlike the PersistentConfig
      # values further down. See ai/openwebui/OPENWEBUI.md § Branding.
      WEBUI_NAME: "${OPENWEBUI_WEBUI_NAME}"
      WEBUI_SECRET_KEY: "${OPENWEBUI_SECRET_KEY}"
      # Encryption keys for data at rest in openwebui_data, kept SEPARATE from
      # the session secret on purpose. Both default to WEBUI_SECRET_KEY
      # upstream, which means rotating the session secret (which only needs to
      # log users out) also makes every stored MCP OAuth client blob and every
      # stored MCP access token undecryptable — the cause of the
      # /oauth/clients/<id>/authorize 404 after a secret rotation. Setting them
      # independently decouples the two. The `:-${OPENWEBUI_SECRET_KEY}` keeps
      # upstream behaviour when the box .env hasn't defined them yet.
      #   CLIENT_INFO  → the dynamically registered MCP OAuth client (the blob)
      #   SESSION_TOKEN → each user's MCP access/refresh tokens
      # See ai/openwebui/OPENWEBUI.md § Encryption keys.
      OAUTH_CLIENT_INFO_ENCRYPTION_KEY: "${OPENWEBUI_OAUTH_CLIENT_INFO_ENCRYPTION_KEY:-${OPENWEBUI_SECRET_KEY}}"
      OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: "${OPENWEBUI_OAUTH_SESSION_TOKEN_ENCRYPTION_KEY:-${OPENWEBUI_SECRET_KEY}}"
      WEBUI_URL: "${OPENWEBUI_WEBUI_URL}"
      ENABLE_SIGNUP: "${OPENWEBUI_ENABLE_SIGNUP}"
      DEFAULT_USER_ROLE: "${OPENWEBUI_DEFAULT_USER_ROLE}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN}"
      HF_TOKEN: "${HF_TOKEN}"

      # OAuth — Google sign-in. Credentials must be issued in Google Cloud
      # Console; the redirect URI registered there must be
      # ${OPENWEBUI_WEBUI_URL}/oauth/google/callback
      ENABLE_OAUTH_SIGNUP: "${OPENWEBUI_ENABLE_OAUTH_SIGNUP}"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "${OPENWEBUI_OAUTH_MERGE_ACCOUNTS_BY_EMAIL}"
      GOOGLE_CLIENT_ID: "${OPENWEBUI_GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${OPENWEBUI_GOOGLE_CLIENT_SECRET}"
      OPENID_PROVIDER_URL: "${OPENWEBUI_OPENID_PROVIDER_URL}"

      # FALLBACK sign-in path — only used when the trusted headers further
      # down are blank. Then Open WebUI runs its own Google OIDC with the
      # credentials above: AUTO_REDIRECT skips its login page, and
      # UPDATE_NAME/PICTURE_ON_LOGIN re-read `name` / `picture` on every login.
      # Kept configured so disabling the trusted-header patch is one edit.
      #
      # These are oauth.* config keys: ENABLE_OAUTH_PERSISTENT_CONFIG defaults
      # to false upstream, so they never read from the DB and env applies on
      # every boot — unlike ENABLE_WEB_SEARCH and the AUDIO_TTS_* block further
      # down, which a DB row shadows once saved in the Admin UI.
      OAUTH_AUTO_REDIRECT: "${OPENWEBUI_OAUTH_AUTO_REDIRECT}"
      # Required by OAUTH_AUTO_REDIRECT — the frontend only auto-redirects
      # when the deployment is unambiguously SSO-only. A ui.* key, so a DB
      # row shadows it — and the 0.11 upgrade migration created one from the
      # old config blob. See OPENWEBUI.md § Single sign-on before trusting env.
      ENABLE_LOGIN_FORM: "${OPENWEBUI_ENABLE_LOGIN_FORM}"
      OAUTH_UPDATE_NAME_ON_LOGIN: "${OPENWEBUI_OAUTH_UPDATE_NAME_ON_LOGIN}"
      OAUTH_UPDATE_PICTURE_ON_LOGIN: "${OPENWEBUI_OAUTH_UPDATE_PICTURE_ON_LOGIN}"

      # Trusted-header SSO — the ONE gate. oauth2-proxy signs the user in
      # with Google and forwards X-Forwarded-Email; Open WebUI signs them in
      # from that. NAME_HEADER stays blank on purpose: oauth2-proxy's
      # X-Forwarded-User is Google's numeric `sub`, not a name.
      #
      # ACCESS_TOKEN_HEADER is a ZEO PATCH (Dockerfile.openwebui, patch 0002;
      # OPENWEBUI.md § Single sign-on). With it set, the sign-in is refused
      # unless Google confirms the forwarded token is live, issued to
      # GOOGLE_CLIENT_ID, and belongs to X-Forwarded-Email — and the account's
      # display name + picture are taken from Google's userinfo on every
      # sign-in. Blank BOTH the email and access-token headers to fall back to
      # Open WebUI's own two-hop Google OIDC (the OAUTH_* block above).
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: "${OPENWEBUI_WEBUI_AUTH_TRUSTED_EMAIL_HEADER}"
      WEBUI_AUTH_TRUSTED_NAME_HEADER: "${OPENWEBUI_WEBUI_AUTH_TRUSTED_NAME_HEADER}"
      WEBUI_AUTH_TRUSTED_ACCESS_TOKEN_HEADER: "${OPENWEBUI_WEBUI_AUTH_TRUSTED_ACCESS_TOKEN_HEADER}"

      # Post-signout redirect. Without this, "Log out" only clears the
      # OpenWebUI cookie — the next page load carries the still-valid
      # oauth2-proxy cookie, X-Forwarded-Email gets re-added, and
      # trusted-header auth immediately signs the user back in. Setting
      # this to oauth2-proxy's /oauth2/sign_out endpoint chains the
      # logouts: OpenWebUI clears its session, then oauth2-proxy clears
      # its cookie, then the browser lands back on / with no valid
      # session anywhere and the user sees the Google sign-in page.
      #
      # Note: this does NOT sign the user out of Google itself — that
      # would be too invasive (kicks them out of Gmail, Docs, etc). If
      # they still have an active Google session, clicking "sign in"
      # will Google-SSO them straight back in without a password prompt.
      # This is the expected behavior for a Workspace-gated app.
      WEBUI_AUTH_SIGNOUT_REDIRECT_URL: "${OPENWEBUI_WEBUI_AUTH_SIGNOUT_REDIRECT_URL}"

      # User-Agent for langchain_community outbound HTTP (RAG / web loaders).
      USER_AGENT: "${OPENWEBUI_USER_AGENT}"

      # MCP handshake timeout (seconds). Raise if a registered MCP server
      # cold-starts slowly.
      MCP_INITIALIZE_TIMEOUT: "${OPENWEBUI_MCP_INITIALIZE_TIMEOUT}"

      # Web search — backed by the searxng container on ai_shared. Only read
      # on the first boot of a fresh openwebui_data volume; on an existing
      # install, toggle via Admin Panel → Settings → Web Search. See
      # ai/searxng/SEARXNG.md.
      ENABLE_WEB_SEARCH: "${OPENWEBUI_ENABLE_WEB_SEARCH}"
      WEB_SEARCH_ENGINE: "${OPENWEBUI_WEB_SEARCH_ENGINE}"
      SEARXNG_QUERY_URL: "${OPENWEBUI_SEARXNG_QUERY_URL}"
      WEB_SEARCH_RESULT_COUNT: "${OPENWEBUI_WEB_SEARCH_RESULT_COUNT}"
      WEB_SEARCH_CONCURRENT_REQUESTS: "${OPENWEBUI_WEB_SEARCH_CONCURRENT_REQUESTS}"

      # Hard ceiling on Open WebUI's outbound aiohttp client — applies to the
      # search_web call to searxng AND the fetch_url tool's direct page
      # fetch. Read on every boot (not a first-boot-only PersistentConfig
      # value like the web-search block above). Without this, a hung
      # upstream (dead site, anti-bot interstitial, slow TLS handshake)
      # leaves a tool call "pending" for the 300s upstream default with
      # nothing ever surfaced to the model. See
      # ai/searxng/SEARXNG.md § Troubleshooting: fetch_url / search hangs.
      AIOHTTP_CLIENT_TIMEOUT: "${OPENWEBUI_AIOHTTP_CLIENT_TIMEOUT}"
      AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT: "${OPENWEBUI_AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT}"

      # Voice — text-to-speech backed by the kokoro-api container on ai_shared.
      # kokoro-api exposes an OpenAI-compatible POST /v1/audio/speech, so the
      # "openai" engine is used with its base URL pointed at kokoro-api rather
      # than LiteLLM. Going direct keeps the `kokoro` model off the chat picker
      # (the Open WebUI virtual key deliberately excludes it) and needs no key —
      # kokoro-api has no auth and is only reachable inside ai_shared.
      # Kokoro returns WAV; Open WebUI transcodes to MP3 itself (pydub/ffmpeg).
      # Like the web-search block, these are PersistentConfig values: read on
      # the first boot of a fresh openwebui_data volume only. On an existing
      # install set them via Admin Panel → Settings → Audio. See
      # ai/openwebui/OPENWEBUI.md § Voice (TTS via Kokoro).
      AUDIO_TTS_ENGINE: "${OPENWEBUI_AUDIO_TTS_ENGINE}"
      AUDIO_TTS_OPENAI_API_BASE_URL: "${OPENWEBUI_AUDIO_TTS_OPENAI_API_BASE_URL}"
      AUDIO_TTS_OPENAI_API_KEY: "${OPENWEBUI_AUDIO_TTS_OPENAI_API_KEY}"
      AUDIO_TTS_MODEL: "${OPENWEBUI_AUDIO_TTS_MODEL}"
      AUDIO_TTS_VOICE: "${OPENWEBUI_AUDIO_TTS_VOICE}"
      AUDIO_TTS_SPLIT_ON: "${OPENWEBUI_AUDIO_TTS_SPLIT_ON}"
      # Open Terminal — the code-execution backend, replacing the in-browser
      # Pyodide code interpreter. The JSON list below is what Admin Settings →
      # Integrations → Open Terminal writes into the DB; it is built INLINE
      # here (rather than as its own .env variable) so the API key lives in
      # exactly one place: OPEN_TERMINAL_API_KEY, the same variable
      # ai/open-terminal/docker-compose.open-terminal.yml feeds the terminal.
      # The two can therefore never drift.
      #
      # Field notes (backend/open_webui/routers/configs.py
      # ::TerminalServerConnection at v0.11.3):
      #   url          service DNS on terminal_net — the openwebui BACKEND
      #                proxies every call (routers/terminals.py), so the
      #                terminal needs no host port and the browser never sees
      #                this URL or the key.
      #   path         openapi.json is fetched once at startup by
      #                utils/tools.py::set_terminal_servers; its operations
      #                become native function-calling tools.
      #   server_type  / policy_id stay null: those select the Enterprise
      #                "Terminals" orchestrator, not plain Open Terminal.
      #   config.chat_uploads="filesystem"  files dropped in the chat composer
      #                land in the user's terminal home instead of Open WebUI's
      #                RAG store, so the model can actually open them.
      #   config.access_grants  MUST be non-empty or the connection is private
      #                and admin-only (utils/access_control::has_connection_access
      #                treats a missing/empty list as "private"). The
      #                {principal_type:"user", principal_id:"*"} grant is the
      #                public-read form used by utils/access_control::has_access.
      #                Swap in {"principal_type":"group","principal_id":"<id>",
      #                "permission":"read"} to restrict to an Open WebUI group.
      #
      # PersistentConfig caveat, same as ENABLE_WEB_SEARCH and the AUDIO_TTS_*
      # block above: the key is `terminal_server.connections`, so this env var
      # is read only on the FIRST boot of a fresh openwebui_data volume. On the
      # existing install, add/verify the connection in the Admin UI at
      # Admin Settings → Integrations → Open Terminal (URL http://open-terminal:8000,
      # key = OPEN_TERMINAL_API_KEY). See ai/open-terminal/OPEN_TERMINAL.md.
      TERMINAL_SERVER_CONNECTIONS: '[{"id":"zeo-terminal","name":"Zeo Terminal","enabled":true,"url":"http://open-terminal:8000","path":"/openapi.json","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","server_type":null,"policy_id":null,"config":{"chat_uploads":"filesystem","access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]}}]'

      # Turn the legacy Pyodide code interpreter OFF — Open Terminal replaces
      # it. The two are mutually exclusive in the composer anyway: selecting a
      # terminal force-clears the Code Interpreter toggle
      # (src/lib/components/chat/MessageInput.svelte at v0.11.3), so leaving
      # both on only produces a confusing second button.
      #
      # PersistentConfig key `code_interpreter.enable` — first-boot-only, same
      # caveat as above. On the existing install flip it at
      # Admin Settings → Code Execution → Code Interpreter.
      #
      # NOT touched here: ENABLE_CODE_EXECUTION (`code_execution.enable`, the
      # "Run" button on a code block in an assistant message). That is a
      # browser-side pyodide/jupyter execution with no server reach; leaving it
      # on is harmless and still useful for quick snippets.
      ENABLE_CODE_INTERPRETER: "${OPENWEBUI_ENABLE_CODE_INTERPRETER}"

      # Speech-to-text stays on the built-in local faster-whisper model that
      # ships inside the Open WebUI image (CPU, downloaded on first use). Only
      # the model size is exposed here; "base" is the upstream default.
      WHISPER_MODEL: "${OPENWEBUI_WHISPER_MODEL}"
    volumes:
      - openwebui_data:/app/backend/data

      # Branding. Every /static/* asset is served from STATIC_DIR
      # (= /app/backend/open_webui/static), which main.py mounts BEFORE the SPA
      # catch-all — so overwriting /app/build/static/ does nothing, despite what
      # most guides say. Individual read-only file mounts rather than a
      # directory mount: the same dir also holds fonts/, swagger-ui/, assets/,
      # and user.png, which a directory mount would hide.
      #
      # Source files are generated from assets/Zeo Favicon {Black,White}.png —
      # see ai/openwebui/OPENWEBUI.md § Branding for the regeneration recipe
      # and which file drives which surface.
      - ../../assets/openwebui/favicon.png:/app/backend/open_webui/static/favicon.png:ro
      - ../../assets/openwebui/favicon-96x96.png:/app/backend/open_webui/static/favicon-96x96.png:ro
      - ../../assets/openwebui/favicon.svg:/app/backend/open_webui/static/favicon.svg:ro
      - ../../assets/openwebui/favicon.ico:/app/backend/open_webui/static/favicon.ico:ro
      - ../../assets/openwebui/apple-touch-icon.png:/app/backend/open_webui/static/apple-touch-icon.png:ro
      - ../../assets/openwebui/logo.png:/app/backend/open_webui/static/logo.png:ro
      - ../../assets/openwebui/splash.png:/app/backend/open_webui/static/splash.png:ro
      - ../../assets/openwebui/splash-dark.png:/app/backend/open_webui/static/splash-dark.png:ro
      # custom.css is upstream's own (empty by default) customization hook; it
      # repoints the in-app <img> uses of favicon.png at the white mark.
      - ../../assets/openwebui/custom.css:/app/backend/open_webui/static/custom.css:ro
      - ../../assets/openwebui/zeo-mark-white.png:/app/backend/open_webui/static/zeo-mark-white.png:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openwebui_data:
