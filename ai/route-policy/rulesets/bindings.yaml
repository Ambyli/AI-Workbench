# Seed bindings: which ruleset decides for which requested model.
#
# Applied at every startup (route_policy/rulesets/store.py::seed_and_load):
# each entry is upserted into the `bindings` table. `version` omitted = the
# highest version of that ruleset baked into this image, so bumping
# default.yaml's version re-points `auto` on the next deploy.
#
#   model       the requested model (LiteLLM's `auto` alias)
#   key_alias   optional: only requests from this LiteLLM key alias (a test
#               key can run a draft ruleset); omitted = every key
#   ruleset     a ruleset id from this directory -- must be `mode: enforce`
#   version     optional: pin a version
#   shadow      optional: rulesets decided BESIDE it after every answer,
#               logged as decisions with shadow_of, never applied -- each an
#               id (its highest version) or {ruleset: <id>, version: <n>},
#               and each must be `mode: shadow`
#
# Startup owns these rows (and the shadow slots). Editing bindings at runtime
# is the phase-6 write API. A binding is routing control: whatever it points
# `auto` at decides every `auto` turn (ROUTE_POLICY.md § Operations,
# Exposure); a shadow slot only adds rows and background classifications.
#
# `auto` is shadowed by two drafts: `default-llm` (phase 4, a local model's
# verdict) and `default-signals` (phase 5, the signals sidecar). Both run
# after every answer, each with its own decisions row.
- model: auto
  ruleset: default
  shadow: [default-llm, default-signals]
