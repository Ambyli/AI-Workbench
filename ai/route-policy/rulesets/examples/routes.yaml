# routes_v1 -- labelled example prompts for the `default-signals` draft's
# `topic` evaluator (type nearest_examples): the sidecar embeds the latest
# user message and votes the route of its nearest examples.
#
# CURATED AND PII-FREE. Written by hand for this business (solar installs,
# permits, Phoenix / Trino data questions) -- never a real prompt, never
# text pasted from a chat or from the phase-4 gold set (those are customer
# chats; this file is stored in route-policy-db and federated into Trino).
# unit-tests/route-policy/test_default_signals.py runs common.pii over every
# text and fails on any finding.
#
# The only copy: inlined into every ruleset version that references it
# (`examples_ref`), and hashed with it -- an edit here needs a ruleset
# `version` bump (ROUTE_POLICY.md § Changing a ruleset). Ids are stable:
# Trino reads them back from `evaluations.detail.neighbours`, so never reuse
# a removed id for a different text.
#
# Rules (checked by the nearest_examples config): ids unique, routes among
# the ruleset's, each text 1-300 characters, at most 1,000 examples. About
# 30 per route; local-private has none on purpose -- privacy is the `pii`
# and `privacy` evaluators' job, never a topic's.
name: routes_v1
examples:
