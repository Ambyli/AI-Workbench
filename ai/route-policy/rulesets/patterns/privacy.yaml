# privacy_kw -- the semantic router's PII keyword signal, for the `default`
# ruleset's `privacy` evaluator (role: force -> local-private).
#
# A COPY of routing.signals.keywords[name=privacy_kw] in
# ai/semantic-router/config.yaml, kept identical (keywords, operator,
# case_sensitive, method) by unit-tests/route-policy/test_drift.py until
# phase 3 retires the router and this file becomes the only one. Edit both
# together -- and since this file is part of the ruleset's content hash, give
# the ruleset a new `version` (ROUTE_POLICY.md § Changing a ruleset).
#
# No `method`: each keyword is a whole-word literal, case-insensitive
# (common.keywordmatch, the Go router's semantics). Literal words are lexical:
# a PII prompt that names none of them is NOT caught -- widen the list rather
# than trusting the match.
name: privacy_kw
operator: OR
case_sensitive: false
keywords:
  - ssn
  - social security
  - credit card
  - passport
  - date of birth
  - driver license
  - bank account
  - routing number
  - medical record
  - customer address
