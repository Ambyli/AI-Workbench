# reasoning_kw -- the semantic router's math / science / multi-step keyword
# signal, for the `default` ruleset's `reasoning-text` evaluator.
#
# A COPY of routing.signals.keywords[name=reasoning_kw] in
# ai/semantic-router/config.yaml, kept identical (keywords, operator,
# case_sensitive, method) by unit-tests/route-policy/test_drift.py until
# phase 3 retires the router. Edit both together, and bump the ruleset's
# `version` (this file is part of its content hash).
#
# No `method`: whole-word literals, case-insensitive.
name: reasoning_kw
operator: OR
case_sensitive: false
keywords:
  - prove
  - proof
  - derive
  - theorem
  - integral
  - derivative
  - probability
  - equation
  - algebra
  - geometry
  - physics
  - chemistry
  - step by step
  - show your work
