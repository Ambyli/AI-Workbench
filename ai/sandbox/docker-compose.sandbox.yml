# Sandbox subsystem — interactive app previews for OpenWebUI.
#
# Runs untrusted, model-generated code in short-lived containers whose only
# reachable neighbors are (a) sandbox-proxy in front, (b) sandbox-egress
# for allowlisted internet, and NOTHING else on the stack. Security is
# enforced by network segmentation, not by trusting the sandbox process.
#
# Networks (see ai/sandbox/SANDBOX.md § Network topology for the diagram):
#
#   shared             (external, ai_shared)     openwebui / litellm ↔ runner + proxy
#   sandbox_net        (bridge, internal: true)  runner ↔ proxy ↔ sandboxes ↔ egress
#   sandbox_state      (bridge, internal: true)  runner ↔ sandbox-db (nothing else)
#   sandbox_egress_out (bridge)                  sandbox-egress → internet
#   sandbox_db_publish (bridge, no masquerade)   sandbox-db only, for its host port
#
# `internal: true` on the two private networks means Docker does not attach
# a default gateway. A sandbox that tries to hit the host or the internet
# directly has no route; it MUST go through sandbox-egress or nowhere.
#
# See ai/sandbox/SANDBOX.md for the operator runbook and the security-invariant
# checklist that must be verified after any change here.

networks:
  shared:
    external: true
    name: ai_shared
  sandbox_net:
    driver: bridge
    internal: true
    name: sandbox_net
  sandbox_state:
    driver: bridge
    internal: true
    name: sandbox_state
  # Egress-only network. NOT internal — this is the one bridge that
  # gives sandbox-egress a route to the public internet. Only
  # sandbox-egress attaches here; no sandbox, no state store, nothing
  # else. The whole security model of "sandboxes reach the internet
  # ONLY through the filter" hinges on this being the sole outbound
  # path (sandbox_net has no default gateway).
  sandbox_egress_out:
    driver: bridge
    name: sandbox_egress_out
  # Host-port network for sandbox-db ONLY. Docker (29.4 on the box) does not
  # publish ports for a container whose every network is `internal: true`:
  # PORT_SANDBOX_DB was configured but bound nothing, which broke Trino's
  # postgres_sandbox catalog (host.docker.internal:5440). This plain bridge
  # exists solely so Docker can apply that publish. Nothing else attaches, so
  # no sandbox, runner or ai_shared peer gains a route to the DB. Masquerade
  # is off: the published port still works (inbound DNAT, replies go back
  # through the host), but the DB gets no outbound internet via this network.
  sandbox_db_publish:
    driver: bridge
    name: sandbox_db_publish
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

services:
  # ── State store ─────────────────────────────────────────────────────────
  # Postgres backing the runner's PostgresRegistry. On sandbox_state only —
  # not reachable from ai_shared (nothing else needs it) or sandbox_net
  # (sandboxed code must not tamper with job state). Only sandbox-runner
  # bridges to this network.
  #
  # Host port is published for operator inspection (psql / DBeaver) and for
  # Trino's postgres_sandbox catalog. It binds on all host interfaces --
  # remove the ports: block entirely if this ever runs on a machine with an
  # untrusted network. The publish needs the sandbox_db_publish network
  # below: Docker publishes nothing for a container on internal networks only.
  #
  # Recreated (with downtime) by `make up`: a data directory can have only one
  # Postgres.
  sandbox-db:
    image: postgres:16-alpine
    container_name: sandbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SANDBOX_DB_USER:-sandbox}
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox}
      POSTGRES_DB: ${SANDBOX_DB_NAME:-sandbox}
    volumes:
      - sandbox_db_data:/var/lib/postgresql/data
    ports:
      - "${PORT_SANDBOX_DB:-5440}:5432"
    networks:
      - sandbox_state
      # Only for the host-port publish above; see the network's comment.
      - sandbox_db_publish
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_DB_USER:-sandbox}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ingress reverse proxy ───────────────────────────────────────────────
  # Caddy. Dual-homed on ai_shared (so openwebui can iframe it) and
  # sandbox_net (so it can reach the spawned sandbox-{id} containers by
  # Docker DNS). Statically routes /{sandbox_id}/* to sandbox-{id}:80 —
  # base images normalize their app port to 80 so Caddy needs no dynamic
  # config. WebSocket upgrades are default in Caddy (Streamlit + Vite HMR).
  #
  # The Caddyfile strips X-Frame-Options and rewrites CSP so OpenWebUI can
  # embed the served page in an iframe. See Caddyfile in this dir.
  sandbox-proxy:
    # Custom Caddy build with the caddyserver/replace-response plugin
    # baked in (see ai/sandbox/proxies/Dockerfile). The plugin is what
    # lets Caddy inject the browser-shim <script> tag into every HTML
    # response — see SANDBOX.md § Browser console capture.
    build:
      context: ../..
      dockerfile: ai/sandbox/proxies/Dockerfile
    # Deployed side by side by `make up sandbox` (scripts/deploy.py): a new
    # `sandbox-proxy-<hash>` starts next to the old one, and the old one
    # retires once the new one is healthy. Its routing is static (no state
    # beyond Caddy's own /data and /config), so two copies are safe. No
    # container_name -- oauth2-proxy and the runner reach it by service name
    # -- and no `ports:`: PORT_SANDBOX_PROXY is published by ai/edge. The hash
    # covers the bind-mounted Caddyfile. See ai/edge/EDGE.md.
    labels:
      com.zeo.deploy: swap
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./proxies/Caddyfile:/etc/caddy/Caddyfile:ro
      - sandbox_proxy_data:/data
      - sandbox_proxy_config:/config
    networks:
      - shared
      - sandbox_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Allowlist egress proxy ──────────────────────────────────────────────
  # tinyproxy running on sandbox_net only. Sandboxed containers set
  # HTTP_PROXY / HTTPS_PROXY to this container; everything else is
  # unreachable because sandbox_net has no default gateway.
  #
  # The allowlist lives in tinyproxy.filter in this dir — pypi, files.pythonhosted,
  # registry.npmjs.org, esm.sh, cdn.jsdelivr.net. Add domains there, not here.
  sandbox-egress:
    # Built locally — see Dockerfile.sandbox-egress for why we don't use
    # dannydirect/tinyproxy anymore.
    build:
      context: ../..
      dockerfile: ai/sandbox/proxies/egress.Dockerfile
    # Deployed side by side by `make up sandbox` (scripts/deploy.py), like
    # sandbox-proxy: sandboxes reach it as sandbox-egress:8888 by service
    # name on sandbox_net, which resolves to both copies during the swap. The
    # hash covers tinyproxy.conf and tinyproxy.filter, so an allowlist edit
    # deploys with `make up sandbox sandbox-egress` -- no restart needed.
    labels:
      com.zeo.deploy: swap
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./proxies/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./proxies/tinyproxy.filter:/etc/tinyproxy/filter:ro
    networks:
      # sandbox_net: how sandboxes reach us (internal, no default gateway).
      - sandbox_net
      # sandbox_egress_out: how WE reach the internet after filtering.
      - sandbox_egress_out
    # Healthcheck via a raw TCP connect to the proxy port. `wget --spider
    # http://localhost:8888/` fails because tinyproxy correctly returns
    # 400 for a non-proxy request, and busybox wget treats that as an
    # error. Netcat is present in the busybox binary and gives us a
    # portable "port is open" probe.
    # Use 127.0.0.1 explicitly — this Alpine base resolves `localhost`
    # to `::1` (IPv6) and tinyproxy binds IPv4 only, so `nc -z localhost`
    # dials the wrong stack and reports the container unhealthy while
    # tinyproxy is actually listening. IPv4 literal skips resolution.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Runner: FastAPI + MCP + docker-sock spawner ─────────────────────────
  # The single privileged component. Talks OpenWebUI / LiteLLM on ai_shared,
  # sandbox-db on sandbox_state, sandbox-proxy + spawned sandboxes on
  # sandbox_net. Uses /var/run/docker.sock to spawn short-lived sandbox
  # containers — this is the audit boundary; nothing else in the sandbox
  # subsystem has any Docker API access.
  #
  # Recreated (with downtime) by `make up`: its concurrency slots are an
  # in-process semaphore, and its reaper would tear down the sandboxes the
  # other copy is serving. No `ports:` -- PORT_SANDBOX_RUNNER is published by
  # ai/edge, which returns 503 + Retry-After while this container is being
  # recreated, instead of a refused connection. Same host port, same URL.
  # See ai/edge/EDGE.md.
  sandbox-runner:
    build:
      context: ../..
      dockerfile: ai/sandbox/runner/Dockerfile
    container_name: sandbox-runner
    restart: unless-stopped
    environment:
      - DEBUG_LOGGING=${DEBUG_LOGGING:-false}
      # Concurrency and lifetime.
      - SANDBOX_MAX_CONCURRENT=${SANDBOX_MAX_CONCURRENT:-8}
      - SANDBOX_DEFAULT_TTL_SECONDS=${SANDBOX_DEFAULT_TTL_SECONDS:-900}
      - SANDBOX_HARD_TTL_SECONDS=${SANDBOX_HARD_TTL_SECONDS:-3600}
      # Networks the runner will attach spawned sandboxes to. Must exist.
      - SANDBOX_NET_NAME=sandbox_net
      # Where the runner tells sandboxes to send outbound HTTP.
      - SANDBOX_EGRESS_URL=http://sandbox-egress:8888
      # Public URL prefix used to build the returned preview URL —
      # this becomes the iframe src the user's browser fetches. The
      # container-name default only works for host-side smoke tests;
      # for browsers behind cloudflared, set SANDBOX_PROXY_URL in .env
      # to a public URL (e.g. https://chat.zeoenergy.com/sandboxes) and
      # add sandbox-proxy to OAUTH2_PROXY_UPSTREAMS. See ai/sandbox/
      # SANDBOX.md § Public iframe routing.
      - SANDBOX_PROXY_URL=${SANDBOX_PROXY_URL:-http://sandbox-proxy}
      # PostgresRegistry DSN. Runner assembles it from the parts below if
      # SANDBOX_DB_DSN isn't set explicitly.
      - SANDBOX_DB_HOST=sandbox-db
      - SANDBOX_DB_PORT=5432
      - SANDBOX_DB_USER=${SANDBOX_DB_USER:-sandbox}
      - SANDBOX_DB_PASSWORD=${SANDBOX_DB_PASSWORD:-sandbox}
      - SANDBOX_DB_NAME=${SANDBOX_DB_NAME:-sandbox}
      - LOG_DIR=/data
    volumes:
      # Read-write socket mount — runner spawns and destroys containers.
      # Do NOT expose this container to the internet.
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_runner_data:/data
    networks:
      - shared
      - sandbox_net
      - sandbox_state
    depends_on:
      sandbox-db:
        condition: service_healthy
      sandbox-proxy:
        condition: service_started
      sandbox-egress:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Base images for spawned sandboxes ───────────────────────────────────
  # These are NOT long-running services — they exist so `docker compose
  # --profile build build` produces the tagged images the runner references
  # from runtimes.py (sandbox-static:latest, sandbox-python:latest,
  # sandbox-node:latest). Nothing here is started with `up`.
  #
  # Rebuild after editing a base Dockerfile:
  #   docker compose -f ai/sandbox/docker-compose.sandbox.yml --profile build build
  sandbox-static-image:
    profiles: ["build"]
    image: sandbox-static:latest
    build:
      context: ../..
      dockerfile: ai/sandbox/images/static.Dockerfile
    command: ["true"]

  sandbox-python-image:
    profiles: ["build"]
    image: sandbox-python:latest
    build:
      context: ../..
      dockerfile: ai/sandbox/images/python.Dockerfile
    command: ["true"]

  sandbox-node-image:
    profiles: ["build"]
    image: sandbox-node:latest
    build:
      context: ../..
      dockerfile: ai/sandbox/images/node.Dockerfile
    command: ["true"]

volumes:
  sandbox_db_data:
  sandbox_runner_data:
  sandbox_proxy_data:
  sandbox_proxy_config:
