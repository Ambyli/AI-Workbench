# sandbox-egress — allowlist HTTP forward proxy for sandboxed containers.
#
# tinyproxy runs on sandbox_net only. Sandboxed base images set
# HTTP_PROXY / HTTPS_PROXY to http://sandbox-egress:8888, so pip install
# and npm install can reach the package registries without the sandbox
# having any direct internet route (sandbox_net is internal: true).
#
# The Filter directive below points at tinyproxy.filter, which lists the
# allowed destination hostnames. FilterDefaultDeny Yes means the default
# behavior is DENY, not ALLOW — every rule must be explicitly added.
#
# The image (Dockerfile.sandbox-egress) sets USER tinyproxy and creates
# writable /var/log/tinyproxy and /var/run/tinyproxy, so we can point
# the log and PID paths there without any privilege dance.
#
# See ai/sandbox/SANDBOX.md § Egress allowlist for the rationale and how
# to add a new domain.

Port 8888
Listen 0.0.0.0

Timeout 600

LogLevel Info
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/var/run/tinyproxy/tinyproxy.pid"

# Not using Syslog — no syslog daemon in the container. Keeping this
# explicit so we don't fall back to the compile-time default.
Syslog Off

# ── Access control ────────────────────────────────────────────────────────
# Allow all inbound (sandbox_net is internal-only; nothing outside sandbox_net
# can reach this container regardless of what's set here).
Allow 0.0.0.0/0

# Deny the CONNECT method to arbitrary ports — only allow HTTPS (443)
# and NNTPS (563, historical). Prevents sandboxes from opening TCP
# tunnels to non-HTTP services.
ConnectPort 443
ConnectPort 563

# ── Destination allowlist ────────────────────────────────────────────────
# Only requests whose hostname matches an entry in the filter file are
# forwarded. Everything else returns 403.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterURLs No
# tinyproxy 1.11.2 (shipped by alpine 3.20) emits a deprecation
# warning for `FilterExtended` and points at `FilterType`, but its
# config parser doesn't accept `FilterType` yet — every value we've
# tried (eregex, extended, 2, posix, on, …) errors out with "Syntax
# error". The rename landed in a later tinyproxy release; swap when
# alpine bumps its package.
FilterExtended Yes
FilterCaseSensitive No

# Do not add a Via header disclosing that the request went through
# tinyproxy — not a security control (the destination sees our egress
# IP anyway), but reduces noise in the destination server's logs.
DisableViaHeader Yes

# Worker pool. Small on purpose — sandboxes are short-lived and
# concurrency is bounded by SANDBOX_MAX_CONCURRENT (default 8), so
# a handful of tinyproxy workers is enough.
StartServers 5
MinSpareServers 2
MaxSpareServers 10
MaxClients 30
