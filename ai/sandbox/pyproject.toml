[project]
name = "sandbox"
version = "0.1.0"
description = "Sandbox runner — spawns short-lived containers running model-generated apps, exposes them to OpenWebUI via sandbox-proxy iframe URLs"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastapi",
    "uvicorn",
    "pydantic",
    "docker>=7.0",
    "asyncpg>=0.29",
    "fastmcp",
]
