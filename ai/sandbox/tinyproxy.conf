# sandbox-egress — allowlist HTTP forward proxy for sandboxed containers.
#
# tinyproxy runs on sandbox_net only. Sandboxed base images set
# HTTP_PROXY / HTTPS_PROXY to http://sandbox-egress:8888, so pip install
# and npm install can reach the package registries without the sandbox
# having any direct internet route (sandbox_net is internal: true).
#
# The Filter directive below points at tinyproxy.filter, which lists the
# allowed destination hostnames. FilterDefaultDeny 1 means the default
# behavior is DENY, not ALLOW — every rule must be explicitly added.
#
# See ai/sandbox/SANDBOX.md § Egress allowlist for the rationale and how to add
# a new domain.

# Runtime user/group inside the container (matches the dannydirect image).
User nobody
Group nobody

# Listen on all sandbox_net interfaces on port 8888.
Port 8888
Listen 0.0.0.0

Timeout 600

# Bind the outgoing connection to the container's sandbox_net interface —
# no ambiguity if the container ever ends up multi-homed by accident.
BindSame yes

# Where tinyproxy logs. stdout so `docker logs sandbox-egress` shows it.
LogLevel Info
LogFile "/dev/stdout"

# ── Access control ────────────────────────────────────────────────────────
# Allow all inbound (sandbox_net is internal-only; nothing outside sandbox_net
# can reach this container regardless of what's set here).
Allow 0.0.0.0/0

# Deny the CONNECT method to arbitrary ports — only allow HTTPS (443).
# Prevents sandboxes from opening TCP tunnels to non-HTTP services.
ConnectPort 443
ConnectPort 563

# ── Destination allowlist ────────────────────────────────────────────────
# Only requests whose hostname matches an entry in the filter file are
# forwarded. Everything else returns 403.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterURLs No
FilterExtended Yes
FilterCaseSensitive No

# Do not add a Via header disclosing that the request went through tinyproxy —
# not a security control (the destination sees our egress IP anyway), but
# reduces noise in the destination server's logs.
DisableViaHeader Yes

# Buffer size for I/O. Default is fine for pip / npm workloads.
MaxClients 50
