                    pattern:
                      google_re2: {}
                      regex: "^/v1(.*)$"
                    substitution: "/v1\\1"
                  
              
              # Route for model: claude-sonnet-5
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      exact: "claude-sonnet-5"
                route:
                  cluster: claude_sonnet_5_cluster
                  timeout: 1800s
