                  # Prepend path prefix to all requests (e.g., /compatible-mode + /v1/chat/completions = /compatible-mode/v1/chat/completions)
                  regex_rewrite:
                    pattern:
                      google_re2: {}
                      regex: "^/v1(.*)$"
                    substitution: "/v1\\1"
                  
              
              # Route for model: qwen3.8-flash
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      exact: "qwen3.8-flash"
                route:
                  cluster: qwen3.8_flash_cluster
                  timeout: 1800s
                  idleTimeout: 1200s
                  # Rewrite Host header to match upstream server
                  host_rewrite_literal: "litellm:4000"
                  
                  # Prepend path prefix to all requests (e.g., /compatible-mode + /v1/chat/completions = /compatible-mode/v1/chat/completions)
                  regex_rewrite:
                    pattern:
