#   python -m cli.config_generator \
#       ai/semantic-router/config.yaml ai/semantic-router/envoy.yaml
#
# (`vllm-sr config envoy --config ai/semantic-router/config.yaml` prints the
# same thing to stdout.) Everything below the header is verbatim generator
# output -- the header is the only hand-written part, and the init service
# strips it before diffing, by taking from the first `admin:` line onward.
#
# WHEN THIS MUST BE RE-RENDERED
#   * any edit to ai/semantic-router/config.yaml  -- listeners, providers,
#     backend_refs, timeouts, api_keys all feed the template;
#   * any bump of SEMANTIC_ROUTER_VERSION        -- upstream changes this
#     template between releases (header-stripping, processing modes and the
#     Lua auth filter have all moved before).
# You do not have to remember: `vllm-sr-models-init` re-renders on every
# `make up semantic-router` and FAILS the stack if the result differs from
# this file. See SEMANTIC_ROUTER.md > Re-rendering envoy.yaml.
#
# TEMPLATE VARIABLES SUBSTITUTED IN THIS RENDER
#   listeners            [{name: http-8899, address: 0.0.0.0, port: 8899,
#                          timeout: 1800s, api_keys: [<two placeholders>]}]
#                        Two keys because the router's looper client signs
#                        its own sub-requests with the candidate model's
#                        access key (the LiteLLM virtual key), and those
#                        sub-requests re-enter this listener -- see
#                        config.yaml > WHY TWO KEYS.
#   models               the six providers.models entries -- qwen3.6,
#                        qwen3.8, qwen3.8-solo, qwen3.8-flash, glm5.2,
#                        claude-sonnet-5. Each yields ONE route (matched on
#                        the x-selected-model header) and ONE cluster. All
#                        six clusters resolve to the same upstream,
#                        litellm:4000 -- the generator emits a cluster per
#                        model, not one shared cluster, and there is no knob
#                        to collapse them.
#   anthropic_models     [] -- claude-sonnet-5 is declared api_format:
#                        openai, so it goes through LiteLLM like the rest
#                        instead of getting a direct api.anthropic.com
#                        cluster. See config.yaml.
#   extproc_host/_port   vllm-sr-router / 50051, from ENVOY_EXTPROC_ADDRESS.
#   extproc_cluster_type LOGICAL_DNS (the host is a name, not an IP), which
#                        also sets dns_lookup_family: V4_ONLY.
#   router_api_host      vllm-sr-router -- unused in this render: the
#                        vllm_static_cluster fallback is emitted only when
#                        `models` is empty.
#
# THINGS WORTH KNOWING BEFORE YOU DEBUG THIS FILE
#
#   Header stripping is real and already correct. The virtual host drops
#   x-vsr-looper-request / -secret / -decision / -iteration and
#   x-authz-user-id / -groups from every INBOUND request, so a caller on
#   port 8021 cannot forge a looper control header or spoof an identity.
#   This is upstream's own hardening, not an addition.
#
#   Bodies are BUFFERED in both directions (processing_mode). The router
#   cannot see a token until the whole upstream response has arrived, so a
#   ratings or remom turn produces NO output at all until the last candidate
#   finishes. That is why `auto` is slow to first token and why LiteLLM's
#   entry sets stream_timeout: 1800.
#
#   Route timeout 1800s comes from listeners[0].timeout. idleTimeout stays
#   at the template's hard-coded 1200s -- it is not parameterised, so a
#   single upstream that goes quiet for >20 min is cut regardless. Nothing
#   in this pool should, but that is the ceiling.
#
#   The Lua filter is the ONLY thing enforcing the listener bearer token;
#   the router does not check it. VALID_KEYS below holds TWO literal
#   placeholders, __SEMANTIC_ROUTER_LISTENER_KEY__ (what LiteLLM's `auto`
#   alias sends) and __SEMANTIC_ROUTER_LITELLM_KEY__ (what the router's own
#   looper sub-requests send -- pkg/looper/client.go signs them with the
#   candidate model's access key, and they re-enter this listener). Envoy
#   has no environment substitution in config files, and the generator
#   inlines api_keys verbatim, so neither real key can be checked in.
#   vllm-sr-models-init substitutes both into the copy Envoy actually loads
#   (the vllm_sr_envoy volume). If every request 401s, that substitution did
#   not run; if only looper decisions 401, the second key is missing --
#   check the init service's logs first either way.
#
#   The default route (no x-selected-model) goes to models[0], qwen3.6.
#   Reordering providers.models therefore changes the fallback target.
#
#   admin is on 9901 and is NEVER published -- see the compose file. It
#   exposes /quitquitquit and full config dumps including VALID_KEYS.
#
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  
  - name: http-8899
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8899
    perConnectionBufferLimitBytes: 524288000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              # Security: strip internal headers from client requests to prevent
              # looper bypass, identity spoofing, and credential leakage.
              request_headers_to_remove:
              - "x-vsr-looper-request"
              - "x-vsr-looper-secret"
              - "x-vsr-looper-decision"
              - "x-vsr-looper-iteration"
              - "x-authz-user-id"
              - "x-authz-user-groups"
              routes:
              
              # Route for model: qwen3.6
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      exact: "qwen3.6"
                route:
                  cluster: qwen3.6_cluster
                  timeout: 1800s
                  idleTimeout: 1200s
                  # Rewrite Host header to match upstream server
                  host_rewrite_literal: "litellm:4000"
                  
                  # Prepend path prefix to all requests (e.g., /compatible-mode + /v1/chat/completions = /compatible-mode/v1/chat/completions)
                  regex_rewrite:
                    pattern:
                      google_re2: {}
                      regex: "^/v1(.*)$"
                    substitution: "/v1\\1"
                  
              
              # Route for model: qwen3.8
              - match:
                  prefix: "/"
                  headers:
                  - name: x-selected-model
                    string_match:
                      exact: "qwen3.8"
                route:
                  cluster: qwen3.8_cluster
                  timeout: 1800s
                  idleTimeout: 1200s
                  # Rewrite Host header to match upstream server
                  host_rewrite_literal: "litellm:4000"
                  
                  # Prepend path prefix to all requests (e.g., /compatible-mode + /v1/chat/completions = /compatible-mode/v1/chat/completions)
                  regex_rewrite:
                    pattern:
                      google_re2: {}
                      regex: "^/v1(.*)$"
                    substitution: "/v1\\1"
                  
              
              # Route for model: qwen3.8-solo
              - match:
