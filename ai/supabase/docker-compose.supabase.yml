# Self-hosted Supabase subsystem.
#
# The full upstream service set minus the analytics override: Postgres 17,
# an Envoy API gateway, GoTrue auth, PostgREST, Realtime, Storage + imgproxy,
# postgres-meta, Studio, Edge Functions, and the Supavisor connection pooler.
# The instance is a SERVICE, not an application — this compose file creates no
# application tables. The only object we add to the database is a read-only
# `trino_reader` role (volumes/db/trino-reader.sql) so the Trino data lake can
# federate it.
#
# Two networks:
#   shared        (external, ai_shared)  supabase-db / supabase-api / supavisor
#                                        — the three surfaces something outside
#                                        this stack reaches. supabase-db is here
#                                        so trino-coordinator resolves it by
#                                        Docker DNS, exactly like roofix-db.
#   supabase_net  (bridge, default)      data plane: every Supabase service
#                                        talking to every other one.
#
# Upstream service KEYS are kept verbatim (auth, rest, realtime, storage,
# imgproxy, meta, studio, functions) because the vendored Envoy cluster config
# (volumes/api/envoy/cds.yaml) addresses them by those exact hostnames — see
# SUPABASE.md § Vendored config. That means `container_name` deliberately does
# NOT equal the service key for those eight (they are `supabase-<svc>`, as
# upstream names them). The three that also join ai_shared get distinctive
# names for both: supabase-db, supabase-api, supavisor.
#
# ALL configuration is read from the root .env with a SUPABASE_ prefix and
# mapped onto upstream's unprefixed container env names here. Upstream's raw
# names collide with this repo's shared .env (MINIO_ROOT_USER/PASSWORD belong
# to Trino; POSTGRES_* is generic). Edit .env, not this file.
#
# Analytics (Logflare + Vector) is NOT enabled: upstream ships it as a layered
# override and Vector needs /var/run/docker.sock, which only sandbox-runner is
# permitted to mount in this repo. See ai/supabase/SUPABASE.md.
#
# Secrets are generated by `python ai/supabase/bin/generate_keys.py`.
#
# See ai/supabase/SUPABASE.md for the operator runbook.

networks:
  shared:
    external: true
    name: ai_shared
  supabase_net:
    driver: bridge
    name: supabase_net

services:
  # ── Postgres 17 (the database itself) ───────────────────────────────────
  # supabase/postgres ships the official docker-library entrypoint: it runs
  # top-level /docker-entrypoint-initdb.d/* only, and its migrate.sh then runs
  # init-scripts/*.sql as `postgres` (still superuser at that point) followed
  # by migrations/*.sql as `supabase_admin`. Only .sql runs inside those two
  # directories — environment reaches SQL through the psql backtick \set trick.
  # Init runs ONCE, on an empty data volume.
  #
  # NEVER set POSTGRES_USER here. The image defaults it to supabase_admin and
  # the vendored SQL (_supabase.sql, logs.sql, pooler.sql, realtime.sql) reads
  # $POSTGRES_USER to decide schema ownership.
  #
  # Dual-homed: supabase_net for every Supabase service, shared so Trino can
  # reach it at supabase-db:5432. The host publish on PORT_SUPABASE_DB is the
  # direct psql / DBeaver path (bypasses the pooler).
  #
  # Port grouping in the PORT REGISTRY block of .env:
  #   5432 litellm_db, 5433 roofix-db, 5434 sandbox-db, 5435 n8n-db,
  #   5436 hive-metastore-db, 5437 superset-db, 5438 supabase-db
  supabase-db:
    # Pinned release tag. Bump this line and `docker compose ... pull` to
    # update. Re-check it against supabase/supabase@master docker/docker-compose.yml.
    image: supabase/postgres:17.6.1.136
    container_name: supabase-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # Prevents Realtime's polling queries from filling the log.
      - -c
      - log_min_messages=fatal
    ports:
      - "${PORT_SUPABASE_DB:-5438}:5432"
    environment:
      # All values sourced from .env — edit there, not here.
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      POSTGRES_PORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      PGPASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      POSTGRES_PASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      PGDATABASE: "${SUPABASE_POSTGRES_DB:-postgres}"
      POSTGRES_DB: "${SUPABASE_POSTGRES_DB:-postgres}"
      JWT_EXP: "${SUPABASE_JWT_EXPIRY:-3600}"
      # Consumed by volumes/db/trino-reader.sql (ours, not upstream).
      TRINO_READER_USER: "${SUPABASE_TRINO_READER_USER:-trino_reader}"
      TRINO_READER_PASSWORD: "${SUPABASE_TRINO_READER_PASSWORD:?Set SUPABASE_TRINO_READER_PASSWORD in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
    volumes:
      # Upstream's exact init paths — order within a phase is alphabetical, and
      # the phase (init-scripts vs migrations) decides which role runs the file.
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      # Kept for parity with upstream even though the analytics override is not
      # enabled: it only creates the _analytics schema inside _supabase, so
      # adding that override later needs no manual schema step.
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      # Must be superuser to create the event trigger.
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      # Must be superuser to alter a reserved role.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      # OURS: read-only role for the Trino postgres_supabase catalog.
      - ./volumes/db/trino-reader.sql:/docker-entrypoint-initdb.d/init-scripts/99-trino-reader.sql:ro
      - supabase_db_data:/var/lib/postgresql/data
      # Named volume so the pgsodium decryption key survives a recreate.
      - supabase_db_config:/etc/postgresql-custom
    networks:
      - supabase_net
      - shared
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Upstream has no start_period. First boot runs ~60 image migrations plus
      # every file above; without this the container is marked unhealthy and
      # every downstream service_healthy gate gives up before Postgres is ready.
      start_period: 90s

  # ── Supavisor: the connection pooler ────────────────────────────────────
  # Two listeners: 5432 session mode, 6543 transaction mode. Upstream overloads
  # POSTGRES_PORT as BOTH the container-internal Postgres port and the pooler's
  # published host port; we split that into PORT_SUPABASE_POOLER_SESSION /
  # PORT_SUPABASE_POOLER_TX in the PORT REGISTRY.
  #
  # Clients log in as `postgres.<POOLER_TENANT_ID>` — see SUPABASE.md § Access.
  # Dual-homed so anything on ai_shared can pool instead of connecting direct.
  supavisor:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/supavisor:2.9.12
    container_name: supabase-pooler
    restart: unless-stopped
    ports:
      - "${PORT_SUPABASE_POOLER_SESSION:-8023}:5432"
      - "${PORT_SUPABASE_POOLER_TX:-8024}:6543"
    environment:
      # All values sourced from .env — edit there, not here.
      PORT: "4000"
      POSTGRES_PORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      POSTGRES_HOST: "${SUPABASE_POSTGRES_HOST:-supabase-db}"
      POSTGRES_DB: "${SUPABASE_POSTGRES_DB:-postgres}"
      POSTGRES_PASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — see ai/supabase/SUPABASE.md}"
      DATABASE_URL: "ecto://supabase_admin:${SUPABASE_POSTGRES_PASSWORD}@${SUPABASE_POSTGRES_HOST:-supabase-db}:${SUPABASE_POSTGRES_PORT:-5432}/_supabase"
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: "${SUPABASE_SECRET_KEY_BASE:?Set SUPABASE_SECRET_KEY_BASE in .env (>=64 chars) — see ai/supabase/SUPABASE.md}"
      VAULT_ENC_KEY: "${SUPABASE_VAULT_ENC_KEY:?Set SUPABASE_VAULT_ENC_KEY in .env (exactly 32 chars) — see ai/supabase/SUPABASE.md}"
      API_JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      METRICS_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: "${SUPABASE_POOLER_TENANT_ID:-zeo-local}"
      POOLER_DEFAULT_POOL_SIZE: "${SUPABASE_POOLER_DEFAULT_POOL_SIZE:-20}"
      POOLER_MAX_CLIENT_CONN: "${SUPABASE_POOLER_MAX_CLIENT_CONN:-100}"
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: "${SUPABASE_POOLER_DB_POOL_SIZE:-5}"
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
    networks:
      - supabase_net
      - shared
    depends_on:
      supabase-db:
        condition: service_healthy
    # The $$( ) escape is load-bearing: compose would otherwise interpolate it.
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── GoTrue: the auth server ─────────────────────────────────────────────
  # Service key must stay `auth` — volumes/api/envoy/cds.yaml routes to auth:9999.
  #
  # GOTRUE_JWT_KEYS (the ES256 path) is left commented, matching upstream: this
  # deployment runs in legacy HS256 mode. See SUPABASE.md § Asymmetric keys.
  auth:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/gotrue:v2.196.0
    container_name: supabase-auth
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "${SUPABASE_API_EXTERNAL_URL}"

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${SUPABASE_POSTGRES_PASSWORD}@${SUPABASE_POSTGRES_HOST:-supabase-db}:${SUPABASE_POSTGRES_PORT:-5432}/${SUPABASE_POSTGRES_DB:-postgres}"

      GOTRUE_SITE_URL: "${SUPABASE_SITE_URL}"
      GOTRUE_URI_ALLOW_LIST: "${SUPABASE_ADDITIONAL_REDIRECT_URLS}"
      GOTRUE_DISABLE_SIGNUP: "${SUPABASE_DISABLE_SIGNUP:-false}"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "${SUPABASE_JWT_EXPIRY:-3600}"

      # Legacy symmetric HS256 key.
      GOTRUE_JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      # JSON array of signing JWKs (EC private + legacy symmetric). Enabling
      # this is the ES256 follow-up — see SUPABASE.md § Asymmetric keys.
      #GOTRUE_JWT_KEYS: "${SUPABASE_JWT_KEYS:-[]}"

      # Also the JWT `iss` claim.
      GOTRUE_JWT_ISSUER: "${SUPABASE_API_EXTERNAL_URL}"

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "${SUPABASE_ENABLE_EMAIL_SIGNUP:-true}"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "${SUPABASE_ENABLE_ANONYMOUS_USERS:-false}"
      GOTRUE_MAILER_AUTOCONFIRM: "${SUPABASE_ENABLE_EMAIL_AUTOCONFIRM:-true}"

      GOTRUE_SMTP_ADMIN_EMAIL: "${SUPABASE_SMTP_ADMIN_EMAIL}"
      GOTRUE_SMTP_HOST: "${SUPABASE_SMTP_HOST}"
      GOTRUE_SMTP_PORT: "${SUPABASE_SMTP_PORT}"
      GOTRUE_SMTP_USER: "${SUPABASE_SMTP_USER}"
      GOTRUE_SMTP_PASS: "${SUPABASE_SMTP_PASS}"
      GOTRUE_SMTP_SENDER_NAME: "${SUPABASE_SMTP_SENDER_NAME}"
      GOTRUE_MAILER_URLPATHS_INVITE: "${SUPABASE_MAILER_URLPATHS_INVITE:-/auth/v1/verify}"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "${SUPABASE_MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "${SUPABASE_MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "${SUPABASE_MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}"

      GOTRUE_EXTERNAL_PHONE_ENABLED: "${SUPABASE_ENABLE_PHONE_SIGNUP:-false}"
      GOTRUE_SMS_AUTOCONFIRM: "${SUPABASE_ENABLE_PHONE_AUTOCONFIRM:-false}"

      # Uncomment to enable OAuth / social login providers. Each also needs the
      # matching SUPABASE_<PROVIDER>_* vars added to the .env Supabase block.
      # GOTRUE_EXTERNAL_GOOGLE_ENABLED: "${SUPABASE_GOOGLE_ENABLED}"
      # GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "${SUPABASE_GOOGLE_CLIENT_ID}"
      # GOTRUE_EXTERNAL_GOOGLE_SECRET: "${SUPABASE_GOOGLE_SECRET}"
      # GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: "${SUPABASE_API_EXTERNAL_URL}/callback"

      # GOTRUE_EXTERNAL_GITHUB_ENABLED: "${SUPABASE_GITHUB_ENABLED}"
      # GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: "${SUPABASE_GITHUB_CLIENT_ID}"
      # GOTRUE_EXTERNAL_GITHUB_SECRET: "${SUPABASE_GITHUB_SECRET}"
      # GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: "${SUPABASE_API_EXTERNAL_URL}/callback"

      # Uncomment to configure SMS delivery (phone auth and phone MFA).
      # There is no SMS provider on this LAN, which is why
      # SUPABASE_ENABLE_PHONE_SIGNUP defaults to false (upstream ships true).
      # GOTRUE_SMS_PROVIDER: "${SUPABASE_SMS_PROVIDER}"
      # GOTRUE_SMS_TWILIO_ACCOUNT_SID: "${SUPABASE_SMS_TWILIO_ACCOUNT_SID}"
      # GOTRUE_SMS_TWILIO_AUTH_TOKEN: "${SUPABASE_SMS_TWILIO_AUTH_TOKEN}"
      # GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: "${SUPABASE_SMS_TWILIO_MESSAGE_SERVICE_SID}"

      # Uncomment to change multi-factor authentication defaults.
      # GOTRUE_MFA_TOTP_ENROLL_ENABLED: "${SUPABASE_MFA_TOTP_ENROLL_ENABLED}"
      # GOTRUE_MFA_TOTP_VERIFY_ENABLED: "${SUPABASE_MFA_TOTP_VERIFY_ENABLED}"
      # GOTRUE_MFA_PHONE_ENROLL_ENABLED: "${SUPABASE_MFA_PHONE_ENROLL_ENABLED}"
      # GOTRUE_MFA_PHONE_VERIFY_ENABLED: "${SUPABASE_MFA_PHONE_VERIFY_ENABLED}"
      # GOTRUE_MFA_MAX_ENROLLED_FACTORS: "${SUPABASE_MFA_MAX_ENROLLED_FACTORS}"

      # SAML SSO — see https://supabase.com/docs/guides/self-hosting/self-hosted-saml-sso
      # GOTRUE_SAML_ENABLED: "${SUPABASE_SAML_ENABLED}"
      # GOTRUE_SAML_PRIVATE_KEY: "${SUPABASE_SAML_PRIVATE_KEY}"
    networks:
      - supabase_net
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── PostgREST: the REST API over the database ───────────────────────────
  # Service key must stay `rest` — cds.yaml routes to rest:3000.
  rest:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: postgrest/postgrest:v14.17
    container_name: supabase-rest
    restart: unless-stopped
    command: ["postgrest"]
    environment:
      # All values sourced from .env — edit there, not here.
      PGRST_DB_URI: "postgres://authenticator:${SUPABASE_POSTGRES_PASSWORD}@${SUPABASE_POSTGRES_HOST:-supabase-db}:${SUPABASE_POSTGRES_PORT:-5432}/${SUPABASE_POSTGRES_DB:-postgres}"
      PGRST_DB_SCHEMAS: "${SUPABASE_PGRST_DB_SCHEMAS:-public,graphql_public}"
      PGRST_DB_MAX_ROWS: "${SUPABASE_PGRST_DB_MAX_ROWS:-1000}"
      PGRST_DB_EXTRA_SEARCH_PATH: "${SUPABASE_PGRST_DB_EXTRA_SEARCH_PATH:-public}"
      PGRST_DB_ANON_ROLE: anon

      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost

      # PostgREST accepts a plain symmetric secret, a single JWK, or a JWKS.
      # The NESTED default is load-bearing: keep SUPABASE_JWT_JWKS EMPTY in .env
      # and this falls back to the HS256 secret. Setting it switches PostgREST
      # to asymmetric verification, which only works once the ES256 keys exist.
      PGRST_JWT_SECRET: "${SUPABASE_JWT_JWKS:-${SUPABASE_JWT_SECRET}}"

      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "${SUPABASE_JWT_EXPIRY:-3600}"
    networks:
      - supabase_net
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Realtime: Postgres changes over websockets ──────────────────────────
  # Realtime derives its tenant id from the subdomain of the host it is reached
  # at, so the vendored cds.yaml addresses it as `realtime-dev.supabase-realtime`.
  # Upstream gets that DNS name from the dotted container_name; on a
  # compose-managed bridge we add it as an explicit network ALIAS instead.
  realtime:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/realtime:v2.134.10
    container_name: supabase-realtime
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      PORT: "4000"
      DB_HOST: "${SUPABASE_POSTGRES_HOST:-supabase-db}"
      DB_PORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      DB_USER: supabase_admin
      DB_PASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — see ai/supabase/SUPABASE.md}"
      DB_NAME: "${SUPABASE_POSTGRES_DB:-postgres}"
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      # Exactly 16 characters. Encrypts sensitive fields in the _realtime
      # schema — rotating it after first boot orphans the seeded tenant row.
      DB_ENC_KEY: "${SUPABASE_REALTIME_DB_ENC_KEY:?Set SUPABASE_REALTIME_DB_ENC_KEY in .env (exactly 16 chars) — see ai/supabase/SUPABASE.md}"

      # Legacy symmetric HS256 key.
      API_JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      # JWKS for token verification — the ES256 follow-up.
      #API_JWT_JWKS: "${SUPABASE_JWT_JWKS}"

      SECRET_KEY_BASE: "${SUPABASE_SECRET_KEY_BASE:?Set SUPABASE_SECRET_KEY_BASE in .env (>=64 chars) — see ai/supabase/SUPABASE.md}"
      METRICS_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks:
      supabase_net:
        aliases:
          - realtime-dev.supabase-realtime
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── imgproxy: on-the-fly image transformation for Storage ───────────────
  # Shares the storage volume with `storage` — it reads the same files off disk
  # rather than over HTTP. Service key must stay `imgproxy` (storage addresses
  # it as http://imgproxy:5001).
  imgproxy:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: darthsim/imgproxy:v3.31.4
    container_name: supabase-imgproxy
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "${SUPABASE_IMGPROXY_AUTO_WEBP:-true}"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    volumes:
      - supabase_storage:/var/lib/storage
    networks:
      - supabase_net
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Storage: the object store API ───────────────────────────────────────
  # STORAGE_BACKEND=file — objects live on the supabase_storage named volume.
  # The MinIO/S3 backend is an upstream override we do not use (and MINIO_ROOT_*
  # in this repo's .env belongs to Trino, so it must never be borrowed here).
  #
  # Tighter than upstream: waits for rest + imgproxy to be HEALTHY rather than
  # merely started, so the first upload can't race an unready PostgREST.
  storage:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/storage-api:v1.74.0
    container_name: supabase-storage
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      ANON_KEY: "${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      POSTGREST_URL: http://rest:3000

      # Legacy symmetric HS256 key.
      AUTH_JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      # JWKS for token verification — the ES256 follow-up.
      #JWT_JWKS: "${SUPABASE_JWT_JWKS}"

      DATABASE_URL: "postgres://supabase_storage_admin:${SUPABASE_POSTGRES_PASSWORD}@${SUPABASE_POSTGRES_HOST:-supabase-db}:${SUPABASE_POSTGRES_PORT:-5432}/${SUPABASE_POSTGRES_DB:-postgres}"
      STORAGE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL}"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "${SUPABASE_STORAGE_FILE_SIZE_LIMIT:-52428800}"
      STORAGE_BACKEND: file
      # Directory name when using the `file` backend.
      GLOBAL_S3_BUCKET: "${SUPABASE_GLOBAL_S3_BUCKET:-stub}"
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: "${SUPABASE_STORAGE_TENANT_ID:-stub}"
      REGION: "${SUPABASE_REGION:-stub}"
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # S3-protocol endpoint credentials (clients that speak S3 to Storage).
      S3_PROTOCOL_ACCESS_KEY_ID: "${SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID:?Set SUPABASE_S3_PROTOCOL_ACCESS_KEY_ID in .env — see ai/supabase/SUPABASE.md}"
      S3_PROTOCOL_ACCESS_KEY_SECRET: "${SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET:?Set SUPABASE_S3_PROTOCOL_ACCESS_KEY_SECRET in .env — see ai/supabase/SUPABASE.md}"
    volumes:
      - supabase_storage:/var/lib/storage
    networks:
      - supabase_net
    depends_on:
      supabase-db:
        condition: service_healthy
      rest:
        condition: service_healthy
      imgproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── postgres-meta: the schema API Studio drives ─────────────────────────
  # Service key must stay `meta` — cds.yaml routes to meta:8080.
  meta:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/postgres-meta:v0.99.0
    container_name: supabase-meta
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      PG_META_PORT: "8080"
      PG_META_DB_HOST: "${SUPABASE_POSTGRES_HOST:-supabase-db}"
      PG_META_DB_PORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      PG_META_DB_NAME: "${SUPABASE_POSTGRES_DB:-postgres}"
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — see ai/supabase/SUPABASE.md}"
      CRYPTO_KEY: "${SUPABASE_PG_META_CRYPTO_KEY:?Set SUPABASE_PG_META_CRYPTO_KEY in .env (>=32 chars) — see ai/supabase/SUPABASE.md}"
    networks:
      - supabase_net
    depends_on:
      supabase-db:
        condition: service_healthy
    # Upstream ships NO healthcheck here, which means studio's depends_on has
    # nothing to gate on and the dashboard boots against a dead schema API.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then((r) => {if (!r.ok) throw new Error(r.status)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Studio: the Supabase dashboard ──────────────────────────────────────
  # No host port — it is reached through the gateway at ${SUPABASE_PUBLIC_URL}/,
  # which puts Envoy's basic auth (DASHBOARD_USERNAME / DASHBOARD_PASSWORD) in
  # front of it. Service key must stay `studio` — cds.yaml routes to studio:3000.
  studio:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/studio:2026.09.07-sha-7996410
    container_name: supabase-studio
    restart: unless-stopped
    environment:
      # All values sourced from .env — edit there, not here.
      # Listen on all IPv4 interfaces.
      HOSTNAME: "0.0.0.0"

      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: "${SUPABASE_POSTGRES_PORT:-5432}"
      POSTGRES_HOST: "${SUPABASE_POSTGRES_HOST:-supabase-db}"
      POSTGRES_DB: "${SUPABASE_POSTGRES_DB:-postgres}"
      POSTGRES_PASSWORD: "${SUPABASE_POSTGRES_PASSWORD:?Set SUPABASE_POSTGRES_PASSWORD in .env — see ai/supabase/SUPABASE.md}"
      # See https://supabase.com/docs/guides/self-hosting/remove-superuser-access
      POSTGRES_USER_READ_WRITE: postgres

      PG_META_CRYPTO_KEY: "${SUPABASE_PG_META_CRYPTO_KEY:?Set SUPABASE_PG_META_CRYPTO_KEY in .env (>=32 chars) — see ai/supabase/SUPABASE.md}"
      PGRST_DB_SCHEMAS: "${SUPABASE_PGRST_DB_SCHEMAS:-public,graphql_public}"
      PGRST_DB_MAX_ROWS: "${SUPABASE_PGRST_DB_MAX_ROWS:-1000}"
      PGRST_DB_EXTRA_SEARCH_PATH: "${SUPABASE_PGRST_DB_EXTRA_SEARCH_PATH:-public}"

      DEFAULT_ORGANIZATION_NAME: "${SUPABASE_STUDIO_DEFAULT_ORGANIZATION:-Zeo}"
      DEFAULT_PROJECT_NAME: "${SUPABASE_STUDIO_DEFAULT_PROJECT:-Default Project}"
      OPENAI_API_KEY: "${SUPABASE_STUDIO_OPENAI_API_KEY}"

      # Gateway service key, not `kong` — the kong alias exists for parity only.
      SUPABASE_URL: http://supabase-api:8000
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env — see ai/supabase/SUPABASE.md}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env — see ai/supabase/SUPABASE.md}"
      AUTH_JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      # New-style opaque keys, passed through empty (legacy API key mode).
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY}"

      # The analytics override is not enabled here, so the Logs pages have no
      # backend to query. Upstream already defaults this to false.
      ENABLED_FEATURES_LOGS_ALL: "false"

      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - supabase_studio_snippets:/app/snippets
      # Studio lists (read-only) the same function sources the edge runtime runs.
      - ./volumes/functions:/app/edge-functions:ro
    networks:
      - supabase_net
    depends_on:
      meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Envoy: the API gateway (upstream's `api-gw`) ────────────────────────
  # The single LAN-facing surface: /auth/v1, /rest/v1, /realtime/v1,
  # /storage/v1, /functions/v1, /pg (meta) and / (Studio behind basic auth).
  #
  # docker-entrypoint.sh sed-substitutes the env below into lds.template.yaml.
  # SUPABASE_PUBLIC_URL lands in a CORS EXACT match, so it must be the literal
  # browser origin with no trailing slash. With the four new-style key vars
  # empty the entrypoint logs "Envoy running in legacy API key mode".
  #
  # Aliases `envoy` and `kong` keep any internal config that hard-codes either
  # hostname resolving, exactly as upstream does.
  supabase-api:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: envoyproxy/envoy:v1.39.1
    container_name: supabase-api
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    ports:
      - "${PORT_SUPABASE_API:-8022}:8000"
    environment:
      # All values sourced from .env — edit there, not here.
      ANON_KEY: "${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
      # All four EMPTY = legacy HS256 API key mode. See SUPABASE.md § Asymmetric keys.
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY}"
      ANON_KEY_ASYMMETRIC: "${SUPABASE_ANON_KEY_ASYMMETRIC}"
      SERVICE_ROLE_KEY_ASYMMETRIC: "${SUPABASE_SERVICE_ROLE_KEY_ASYMMETRIC}"
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL}"
      # Basic auth in front of Studio at /.
      DASHBOARD_USERNAME: "${SUPABASE_DASHBOARD_USERNAME:-supabase}"
      DASHBOARD_PASSWORD: "${SUPABASE_DASHBOARD_PASSWORD:?Set SUPABASE_DASHBOARD_PASSWORD in .env — run python ai/supabase/bin/generate_keys.py, see ai/supabase/SUPABASE.md}"
    volumes:
      - ./volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    networks:
      supabase_net:
        aliases:
          - envoy
          - kong
      shared: {}
    depends_on:
      studio:
        condition: service_healthy
    healthcheck:
      # TCP check: this image ships neither curl nor wget.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Edge Functions: the Deno runtime ────────────────────────────────────
  # Service key must stay `functions` — cds.yaml routes to functions:9000.
  # ./volumes/functions is mounted read-write, as upstream does, so the runtime
  # can write its own bundle metadata. volumes/functions/hello is ours (a plain
  # Deno.serve smoke test); main/ and deno.jsonc are vendored verbatim.
  functions:
    # Pinned release tag. Bump this line and `docker compose ... pull` to update.
    image: supabase/edge-runtime:v1.76.2
    container_name: supabase-functions
    restart: unless-stopped
    command: ["start", "--main-service", "/home/deno/functions/main"]
    environment:
      # All values sourced from .env — edit there, not here.
      # Legacy symmetric HS256 key.
      JWT_SECRET: "${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env — see ai/supabase/SUPABASE.md}"
      # JWKS for token verification — the ES256 follow-up.
      #SUPABASE_JWKS: "${SUPABASE_JWT_JWKS}"

      SUPABASE_URL: http://supabase-api:8000
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL}"
      # Legacy API keys (HS256-signed JWTs).
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env — see ai/supabase/SUPABASE.md}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env — see ai/supabase/SUPABASE.md}"
      # NOTE the PLURAL names here — the gateway uses the singular forms. These
      # take a JSON map, and stay empty-valued in legacy API key mode.
      SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${SUPABASE_PUBLISHABLE_KEY}\"}"
      SUPABASE_SECRET_KEYS: "{\"default\":\"${SUPABASE_SECRET_KEY}\"}"
      SUPABASE_DB_URL: "postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD}@${SUPABASE_POSTGRES_HOST:-supabase-db}:${SUPABASE_POSTGRES_PORT:-5432}/${SUPABASE_POSTGRES_DB:-postgres}"
      # Applies to ALL functions — upstream has no per-function override yet.
      VERIFY_JWT: "${SUPABASE_FUNCTIONS_VERIFY_JWT:-false}"
    volumes:
      - ./volumes/functions:/home/deno/functions
      - supabase_deno_cache:/root/.cache/deno
    networks:
      - supabase_net
    depends_on:
      supabase-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # PGDATA. Deleting this re-runs every init script above from scratch.
  supabase_db_data:
  # /etc/postgresql-custom — holds the pgsodium decryption key the image seeds
  # on first boot. Losing it while keeping supabase_db_data breaks pgsodium.
  supabase_db_config:
  # Object storage for the `file` backend. Mounted by storage AND imgproxy.
  supabase_storage:
  # Deno module cache, so the edge runtime doesn't re-fetch on every restart.
  supabase_deno_cache:
  # Studio's saved SQL snippets.
  supabase_studio_snippets:
