connector.name=postgresql
# Supabase-hosted Postgres for the AI agents project — off-box, reached
# via Supabase's session pooler (aws-0-<region>.pooler.supabase.com,
# user postgres.<project-ref>). The direct db.<ref>.supabase.co host is
# IPv6-only and unreachable from the Trino box. Supabase requires TLS on
# every connection, so sslmode rides on the JDBC URL
# (AI_AGENTS_DB_SSLMODE, default require).
# Credentials come from AI_AGENTS_DB_* in .env via the coordinator's
# environment: block in docker-compose.trino.yml.
connection-url=jdbc:postgresql://${ENV:AI_AGENTS_DB_HOST}:${ENV:AI_AGENTS_DB_PORT}/${ENV:AI_AGENTS_DB_NAME}?sslmode=${ENV:AI_AGENTS_DB_SSLMODE}
connection-user=${ENV:AI_AGENTS_DB_USER}
connection-password=${ENV:AI_AGENTS_DB_PASSWORD}
