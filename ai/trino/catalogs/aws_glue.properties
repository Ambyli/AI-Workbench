# "Athena" in Trino terms = the Hive connector reading the AWS Glue Data
# Catalog + the S3 objects it points at. Trino has no Athena connector and
# doesn't need one: Athena is itself a query engine over Glue + S3, so this
# catalog sees exactly the databases/tables Athena shows in us-east-1,
# without paying Athena per-query. The Athena query-results bucket
# (s3://aws-athena-query-results-431419552528-us-east-1/) is where Athena
# writes its own output; Trino doesn't use it.
#
# Credentials: an IAM access key with glue:Get*/glue:Search* on the catalog
# and s3:GetObject/s3:ListBucket on the data buckets. Read-only is enough —
# nothing here writes. Values come from AWS_GLUE_* in .env via the
# coordinator's environment: block in docker-compose.trino.yml.
#
# Tables Athena created as Iceberg will error here ("not a Hive table").
# If that comes up, add an `iceberg` catalog with iceberg.catalog.type=glue
# using the same creds and set hive.iceberg-catalog-name=<that catalog> so
# Trino redirects transparently. See TRINO.md § Adding a catalog.
connector.name=hive
hive.metastore=glue
hive.metastore.glue.region=${ENV:AWS_GLUE_REGION}
hive.metastore.glue.aws-access-key=${ENV:AWS_GLUE_ACCESS_KEY_ID}
hive.metastore.glue.aws-secret-key=${ENV:AWS_GLUE_SECRET_ACCESS_KEY}

# Native S3 client (same one the iceberg catalog uses against MinIO).
fs.native-s3.enabled=true
s3.region=${ENV:AWS_GLUE_REGION}
s3.aws-access-key=${ENV:AWS_GLUE_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_GLUE_SECRET_ACCESS_KEY}
