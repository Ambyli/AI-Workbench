# Google BigQuery, project supernova-dev-zeo — each BigQuery dataset is a
# schema here, so queries read bigquery_supernova_dev.<dataset>.<table>.
# Off-box: reached over HTTPS at *.googleapis.com, nothing on the box to
# route to.
#
# Credentials: the data-lake-reader@supernova-dev-zeo service account, its
# JSON key base64-encoded onto one line (bigquery.credentials-key takes the
# key itself, so no file mount is needed). It needs BigQuery Data Viewer on
# the datasets plus BigQuery Read Session User on the project — table reads
# go through the BigQuery Storage Read API, whose sessions are billed to the
# key's own project (bigquery.parent-project-id defaults to it). Values come
# from SUPERNOVA_DEV_BQ_* in .env via the coordinator's environment: block in
# docker-compose.trino.yml. TRINO.md § BigQuery.
#
# Views are off (the connector default): reading one makes Trino materialize
# it into a temporary table, which a read-only key cannot create.
connector.name=bigquery
bigquery.project-id=${ENV:SUPERNOVA_DEV_BQ_PROJECT_ID}
bigquery.credentials-key=${ENV:SUPERNOVA_DEV_BQ_CREDENTIALS_KEY}
# BigQuery names are case-sensitive and Trino lowercases every identifier;
# resolve lowercase names against mixed-case datasets/tables. See
# postgres_litellm.
bigquery.case-insensitive-name-matching=true
