connector.name=postgresql
# Supabase-hosted Postgres holding Enerflo lead data — off-box, reached
# via Supabase's session pooler (aws-1-<region>.pooler.supabase.com,
# user postgres.<project-ref>). Use the pooler, not db.<ref>.supabase.co:
# the direct host is IPv6-only and unreachable from the Trino box.
# Supabase requires TLS on every connection, so sslmode rides on the JDBC
# URL (ENERFLO_LEADS_DB_SSLMODE, default require). Credentials come from
# ENERFLO_LEADS_DB_* in .env via the coordinator's environment: block in
# docker-compose.trino.yml.
connection-url=jdbc:postgresql://${ENV:ENERFLO_LEADS_DB_HOST}:${ENV:ENERFLO_LEADS_DB_PORT}/${ENV:ENERFLO_LEADS_DB_NAME}?sslmode=${ENV:ENERFLO_LEADS_DB_SSLMODE}
connection-user=${ENV:ENERFLO_LEADS_DB_USER}
connection-password=${ENV:ENERFLO_LEADS_DB_PASSWORD}
