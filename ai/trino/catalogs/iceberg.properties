connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore:9083

# lake-s3 (RustFS) as an S3-compatible target. path-style access is
# required because lake-s3 runs without RUSTFS_SERVER_DOMAINS, so it does
# no virtual-host-style bucket routing.
fs.native-s3.enabled=true
s3.endpoint=http://lake-s3:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKE_S3_SECRET_KEY}
