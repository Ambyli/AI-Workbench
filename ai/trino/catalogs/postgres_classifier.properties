connector.name=postgresql
# classifier-db (ai/classifier) is on ai_shared, reachable by service DNS — no
# sslmode needed, the traffic never leaves the box. Reads go through the
# read-only trino_reader role created by ai/classifier/db-init/10-trino-reader.sh
# (pg_read_all_data + default_transaction_read_only); the classifier's own
# account is never handed to Trino.
#
# Tables (schema `public`): jobs (the queue + results, `result` is JSON),
# reference_examples, llm_calls (one row per vision-model request — the cost
# record, never swept). See ai/classifier/API.md § Model usage.
connection-url=jdbc:postgresql://classifier-db:5432/${ENV:CLASSIFIER_DB_NAME}
connection-user=trino_reader
connection-password=${ENV:CLASSIFIER_TRINO_READER_PASSWORD}
