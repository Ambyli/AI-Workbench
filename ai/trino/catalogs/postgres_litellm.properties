connector.name=postgresql
# litellm_db is on the `internal` network from ai/litellm/docker-compose.litellm.yml
# and is NOT on ai_shared. Trino reaches it via the host publish (PORT_POSTGRES=5432)
# because container-to-container DNS across an external `internal` network
# isn't available. host.docker.internal works on Linux with the compose
# extra_hosts entry, but the LAN address is simpler and matches how BI
# tools already connect. Change to litellm_db:5432 if you later put both
# subsystems on the same network.
connection-url=jdbc:postgresql://host.docker.internal:5432/litellm
connection-user=${ENV:LITELLM_DB_USER}
connection-password=${ENV:LITELLM_DB_PASSWORD}
