connector.name=postgresql
# Phoenix production Postgres — off-box, reached over the public hostname.
# Credentials are the read-only role the Roofix bridge already uses
# (PHOENIX_DB_* in .env); the coordinator's environment: block in
# docker-compose.trino.yml passes them through for ${ENV:...} resolution.
# sslmode rides on the JDBC URL — the server requires TLS
# (PHOENIX_DB_SSLMODE=require), so dropping it fails at connect time.
connection-url=jdbc:postgresql://${ENV:PHOENIX_DB_HOST}:${ENV:PHOENIX_DB_PORT}/${ENV:PHOENIX_DB_NAME}?sslmode=${ENV:PHOENIX_DB_SSLMODE}
connection-user=${ENV:PHOENIX_DB_USER}
connection-password=${ENV:PHOENIX_DB_PASSWORD}
