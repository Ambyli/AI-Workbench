connector.name=postgresql
# route-policy-db (ai/route-policy) is on ai_shared, reachable by service DNS
# -- no sslmode needed, the traffic never leaves the box. Reads go through the
# read-only trino_reader role created by
# ai/route-policy/db-init/10-trino-reader.sh (pg_read_all_data +
# default_transaction_read_only); the service's own account is never handed
# to Trino.
#
# Tables (schema `public`): rulesets, bindings, decisions, evaluations,
# outcomes, schema_migrations, and the decision_outcomes view (every decision
# with what really answered; `agree` is the phase-2 success measure). JSON
# columns (scores, detail, tool_calls, document, response) arrive as json;
# decision_id is a uuid. Join to the spend log on
# outcomes.response_id = postgres_litellm.public."LiteLLM_SpendLogs".request_id.
# See ai/route-policy/ROUTE_POLICY.md § Decision log.
connection-url=jdbc:postgresql://route-policy-db:5432/${ENV:ROUTE_POLICY_DB_NAME}
connection-user=trino_reader
connection-password=${ENV:ROUTE_POLICY_TRINO_READER_PASSWORD}
