connector.name=postgresql
# sandbox-db lives on the `sandbox_state` network which is internal-only —
# Trino cannot join it without breaching the sandbox isolation invariant
# (see ai/sandbox/SANDBOX.md). We reach it via the host publish instead;
# credentials are read-only and the operator can pull the plug by
# unpublishing PORT_SANDBOX_DB in ai/sandbox/docker-compose.sandbox.yml.
connection-url=jdbc:postgresql://host.docker.internal:5434/${ENV:SANDBOX_DB_NAME}
connection-user=${ENV:SANDBOX_DB_USER}
connection-password=${ENV:SANDBOX_DB_PASSWORD}
