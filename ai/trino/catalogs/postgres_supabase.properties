connector.name=postgresql
# supabase-db is on ai_shared, reachable by service DNS. Reads go through the
# dedicated read-only role created by ai/supabase/volumes/db/trino-reader.sql
# (pg_read_all_data + BYPASSRLS + default_transaction_read_only).
#
# Only the `postgres` database is federated. `_supabase` — Supavisor's and the
# analytics override's metadata DB — is a separate database and is not exposed.
connection-url=jdbc:postgresql://supabase-db:5432/${ENV:SUPABASE_POSTGRES_DB}
connection-user=${ENV:SUPABASE_TRINO_READER_USER}
connection-password=${ENV:SUPABASE_TRINO_READER_PASSWORD}
# Supabase's own schemas carry mixed-case identifiers; Trino lowercases every
# identifier, so without this a listed table fails to resolve.
case-insensitive-name-matching=true
