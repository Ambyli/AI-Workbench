connector.name=postgresql
# Supabase-hosted Postgres for the Operations Assistant project — off-box,
# reached via Supabase's session pooler (aws-0-<region>.pooler.supabase.com,
# user postgres.<project-ref>). Use the pooler, not db.<ref>.supabase.co:
# the direct host is IPv6-only and unreachable from the Trino box.
# Supabase requires TLS on every connection, so sslmode rides on the JDBC
# URL (OPERATIONS_ASSISTANT_DB_SSLMODE, default require). Credentials come
# from OPERATIONS_ASSISTANT_DB_* in .env via the coordinator's environment:
# block in docker-compose.trino.yml.
connection-url=jdbc:postgresql://${ENV:OPERATIONS_ASSISTANT_DB_HOST}:${ENV:OPERATIONS_ASSISTANT_DB_PORT}/${ENV:OPERATIONS_ASSISTANT_DB_NAME}?sslmode=${ENV:OPERATIONS_ASSISTANT_DB_SSLMODE}
connection-user=${ENV:OPERATIONS_ASSISTANT_DB_USER}
connection-password=${ENV:OPERATIONS_ASSISTANT_DB_PASSWORD}
# Trino lowercases all identifiers; let it resolve lowercase names against
# any mixed-case tables/columns in the remote schema. See postgres_litellm.
case-insensitive-name-matching=true
