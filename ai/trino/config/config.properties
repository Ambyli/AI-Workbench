coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# ── TLS + password auth for external clients ────────────────────────────
# Two listeners, two trust models:
#
#   :8443 HTTPS  — published on the host as PORT_TRINO. Password-file
#                  auth (password-authenticator.properties). DBeaver /
#                  DataGrip / the web UI land here.
#   :8080 HTTP   — NOT published. Container-network clients only
#                  (trino-mcp, superset, init_warehouse.py, healthcheck).
#
# Trino normally disables HTTP entirely once HTTPS + an authenticator are
# on. allow-insecure-over-http=true re-enables it with the *insecure*
# authenticator (username only) — the same trust posture every other
# service on ai_shared already runs with. Do not publish 8080.
#
# Keystore + password.db are generated by the one-shot trino-auth-init
# service into the trino_auth volume (mounted at /etc/trino/auth).
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/auth/tls/trino.pem
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=true

# Trino requires a node-to-node shared secret whenever any client
# authentication is enabled — even on a single-node cluster.
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# Cap concurrent SQL from external callers so a runaway laptop-BI query
# can't starve the model tool path.
query.max-memory-per-node=2GB
query.max-memory=4GB

# Trino's default is unbounded — matches TRINO_MCP_MAX_RUNTIME_S at the
# MCP layer, but this belt+suspenders keeps a rogue Superset query from
# pinning the coordinator forever.
query.max-execution-time=5m
