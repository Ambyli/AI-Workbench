coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# LiteLLM's MCP tool + Superset both target the internal HTTP endpoint,
# so we don't need HTTPS termination here. External BI tools reach the
# host publish (PORT_TRINO); TLS for that path is a follow-up.

# Cap concurrent SQL from external callers so a runaway laptop-BI query
# can't starve the model tool path.
query.max-memory-per-node=2GB
query.max-memory=4GB

# Trino's default is unbounded — matches TRINO_MCP_MAX_RUNTIME_S at the
# MCP layer, but this belt+suspenders keeps a rogue Superset query from
# pinning the coordinator forever.
query.max-execution-time=5m
