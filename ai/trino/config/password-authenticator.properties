# Password-file authentication for the HTTPS listener (PORT_TRINO → 8443).
# The file is generated by the one-shot `trino-auth-init` service from
# TRINO_JDBC_USERS in .env and mounted read-only under /etc/trino/auth.
# See ai/trino/TRINO.md § JDBC authentication.
password-authenticator.name=file
file.password-file=/etc/trino/auth/password.db
# Re-read the file this often — credential rotation needs no restart.
file.refresh-period=5s
