# Trino data lake subsystem.
#
# Federated SQL over the three existing Postgres instances (litellm_db,
# roofix-db, sandbox-db) plus an Iceberg lakehouse on RustFS (`lake-s3`,
# an S3-compatible object store). Consumers:
#   * models via LiteLLM MCP (mcp_servers.trino → trino-mcp:8080/mcp)
#   * humans via Superset behind oauth2-proxy (/superset/*)
#   * external BI tools via JDBC on PORT_TRINO — HTTPS + password auth.
#     trino-auth-init (one-shot) generates the self-signed cert and the
#     bcrypt password.db from TRINO_JDBC_USERS; plain HTTP :8080 is never
#     published (container-network clients only). TRINO.md § JDBC
#     authentication.
#
# Two networks:
#   shared         (external, ai_shared)   trino-coordinator / lake-s3 /
#                                          superset / trino-mcp — anything
#                                          openwebui, litellm, or a laptop
#                                          needs to reach.
#   analytics_net  (bridge, default)       data-plane: trino ↔ hive-metastore
#                                          ↔ hive-metastore-db, plus lake-s3's
#                                          second leg so trino reaches it by
#                                          service DNS without leaving the box.
#
# See ai/trino/TRINO.md for the operator runbook.

networks:
  shared:
    external: true
    name: ai_shared
  analytics_net:
    driver: bridge
    name: analytics_net

services:
  # ── Hive Metastore backing store ────────────────────────────────────────
  # Dedicated Postgres for HMS's own tables (DBS, TBLS, PARTITIONS, …).
  # Not shared with litellm_db / roofix-db / sandbox-db — HMS's schema
  # migrations run on startup and would collide with anything else.
  #
  # Port grouping in the PORT REGISTRY block of .env:
  #   5432 litellm_db, 5433 roofix-db, 5434 sandbox-db, 5435 n8n-db,
  #   5436 hive-metastore-db, 5437 superset-db
  hive-metastore-db:
    image: postgres:16-alpine
    container_name: hive-metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HMS_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HMS_DB_PASSWORD:-hive}
      POSTGRES_DB: ${HMS_DB_NAME:-metastore}
    volumes:
      - hive_metastore_db_data:/var/lib/postgresql/data
    ports:
      - "${PORT_HMS_DB:-5436}:5432"
    networks:
      - analytics_net
    healthcheck:
      # Pass -d explicitly: pg_isready defaults the database name to the
      # user name, and there is no database called "hive" here — only
      # "metastore". Without -d the check still passes but Postgres logs
      # `FATAL: database "hive" does not exist` every 10 s.
      test: ["CMD-SHELL", "pg_isready -U ${HMS_DB_USER:-hive} -d ${HMS_DB_NAME:-metastore}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Hive Metastore (thrift on 9083) ─────────────────────────────────────
  # Standalone HMS — no Hadoop / HiveServer2, just the metastore service
  # Trino's Iceberg connector consumes over thrift. The image is built
  # locally so we can bake in the Postgres JDBC driver and the s3a jars
  # HMS needs to list Iceberg's manifest files on lake-s3.
  #
  # Internal only. Nothing outside analytics_net should ever talk to HMS
  # directly — Trino is the sole client.
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      HMS_DB_HOST: hive-metastore-db
      HMS_DB_PORT: 5432
      HMS_DB_USER: ${HMS_DB_USER:-hive}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD:-hive}
      HMS_DB_NAME: ${HMS_DB_NAME:-metastore}
      # Read by metastore-site.xml as ${env.LAKE_S3_*}. The endpoint is
      # fixed here, not in .env — it is a service DNS name on analytics_net.
      LAKE_S3_ENDPOINT: http://lake-s3:9000
      LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY:-trino}
      LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY:-trino-dev-only}
    volumes:
      # Same file the Dockerfile COPYs in, mounted over it so a config edit
      # applies with a recreate instead of an image rebuild (a fresh build
      # still bakes the identical file). Safe read-only: apache/hive:4.0.0's
      # entrypoint.sh never writes into /opt/hive/conf — it only symlinks
      # files in when HIVE_CUSTOM_CONF_DIR is set, which it is not here —
      # and Hadoop's Configuration expands ${env.X} when HMS reads the file.
      - ./hive-metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
    networks:
      - analytics_net
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      lake-s3-init:
        condition: service_completed_successfully
    healthcheck:
      # HMS binds thrift on 9083. apache/hive:4.0.0 is eclipse-temurin
      # based and ships NO netcat, so `nc -z` exits 127 ("nc: not found")
      # forever — the container stays unhealthy and every downstream
      # `condition: service_healthy` (trino-coordinator → trino-mcp,
      # superset) never starts. bash IS in the image, so use its
      # /dev/tcp pseudo-device instead. Must be `bash -c`, not plain
      # CMD-SHELL: /bin/sh here is dash, which has no /dev/tcp.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  # ── lake-s3: RustFS, the S3-compatible object store for the warehouse ──
  # Why this product and these settings: TRINO.md § Object store: RustFS.
  # Pulled from GHCR, not Docker Hub, and pinned: never `latest`.
  # Dual-homed on shared (for external BI tools + operator console) and
  # analytics_net (for trino / hms to reach it by DNS). Console lives
  # behind oauth2-proxy at /rustfs/console/ — see OAUTH2_PROXY_UPSTREAMS
  # in .env.
  lake-s3:
    image: ghcr.io/rustfs/rustfs:1.0.1
    container_name: lake-s3
    hostname: lake-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY:-trino}
      RUSTFS_SECRET_KEY: ${LAKE_S3_SECRET_KEY:-trino-dev-only}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      # The console serves under /rustfs/console/ and its admin API under
      # /rustfs/admin/v3, both on 9001. Neither prefix can be moved, which
      # is why oauth2-proxy routes /rustfs/ rather than a name of our own.
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CHECK_UPDATE: "false"
      # RUSTFS_SERVER_DOMAINS stays UNSET on purpose: setting it switches
      # on virtual-host bucket routing, and both Trino and HMS talk
      # path-style (http://lake-s3:9000/warehouse/…).
      #
      # The background data scanner (usage accounting, lifecycle, healing
      # sweeps) buys nothing on one disk with no lifecycle rules, and on a
      # single-disk deployment it is behind open RustFS issues #8015 / #8121
      # / #8377 (request latency spikes, a ratcheting memory footprint,
      # constant background reads). Off.
      RUSTFS_SCANNER_ENABLED: "false"
      # The image sets RUSTFS_OBS_LOG_DIRECTORY=/logs, which sends every log
      # line to rolling files inside the container. Empty means stdout-only
      # (both entrypoint.sh and the binary treat "" as unset), so
      # `docker logs lake-s3` / `make logs trino` show them.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${PORT_LAKE_S3_API:-8014}:9000"
      - "${PORT_LAKE_S3_CONSOLE:-8015}:9001"
    volumes:
      # Named volume only: the image owns /data as uid 10001 and a fresh
      # named volume inherits that. A bind mount would need a chown.
      - lake_s3_data:/data
    networks:
      - shared
      - analytics_net
    healthcheck:
      # curl ships in the (Alpine) image. RustFS can take up to ~2 minutes
      # to report ready on first start, hence the long retry budget.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  # ── One-shot: create the `warehouse` bucket ────────────────────────────
  # head-bucket || create-bucket, then exits. Downstream services wait on
  # `service_completed_successfully` so nobody tries to write before the
  # bucket exists. Idempotent — after the first run head-bucket succeeds
  # and nothing is created. AWS CLI from ECR Public (not Docker Hub),
  # pinned. Path-style is set explicitly: lake-s3 has no virtual-host
  # routing and `warehouse.lake-s3` would not resolve anyway.
  lake-s3-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.12
    container_name: lake-s3-init
    depends_on:
      lake-s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY:-trino}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY:-trino-dev-only}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    networks:
      - analytics_net
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.addressing_style path &&
      { aws --endpoint-url http://lake-s3:9000 s3api head-bucket --bucket warehouse ||
      aws --endpoint-url http://lake-s3:9000 s3api create-bucket --bucket warehouse; } &&
      echo 'warehouse bucket ready'
      "

  # ── One-shot: TLS keystore + password.db for the coordinator ───────────
  # Writes into the trino_auth volume (mounted read-only by the
  # coordinator at /etc/trino/auth):
  #   tls/trino.pem  key + self-signed cert   (generated once)
  #   tls/trino.crt  cert only, for DBeaver truststores
  #   password.db    bcrypt lines from TRINO_JDBC_USERS (rebuilt every run)
  # Editing TRINO_JDBC_USERS + `make up trino trino-auth-init` rotates
  # credentials live — the coordinator re-reads password.db every 5 s.
  # No network: it only touches the volume.
  trino-auth-init:
    build:
      context: ./auth-init
      dockerfile: Dockerfile
    container_name: trino-auth-init
    network_mode: none
    environment:
      TRINO_JDBC_USERS: ${TRINO_JDBC_USERS:?Set TRINO_JDBC_USERS in .env as user:password[,user2:password2] — see ai/trino/TRINO.md § JDBC authentication}
      # Add the box's LAN IP / hostname so DBeaver can verify the cert
      # instead of falling back to SSLVerification=NONE. Only consulted
      # when tls/trino.pem does not exist yet.
      TRINO_TLS_SANS: ${TRINO_TLS_SANS:-DNS:trino-coordinator,DNS:localhost,IP:127.0.0.1}
    volumes:
      - trino_auth:/auth

  # ── Trino coordinator (also the sole worker for now) ───────────────────
  # Single-node cluster. If we grow to multi-node, add a `trino-worker`
  # service with `node.properties.node.role=worker`, drop the coordinator's
  # `discovery.uri` requirement to internal-only, and split catalog mounts
  # so workers see the same properties files.
  #
  # Catalog `.properties` files are mounted read-only under
  # /etc/trino/catalog/. Adding a new catalog is:
  #   1. drop a file in ai/trino/catalogs/
  #   2. docker compose restart trino-coordinator
  trino-coordinator:
    image: trinodb/trino:453
    container_name: trino-coordinator
    restart: unless-stopped
    ports:
      # HTTPS + password auth. The plain-HTTP listener on 8080 is
      # deliberately NOT published — it authenticates by username only
      # and exists for trino-mcp / superset inside the Docker networks.
      - "${PORT_TRINO:-8013}:8443"
    volumes:
      - ./catalogs:/etc/trino/catalog:ro
      - ./config/config.properties:/etc/trino/config.properties:ro
      - ./config/jvm.config:/etc/trino/jvm.config:ro
      - ./config/node.properties:/etc/trino/node.properties:ro
      - ./config/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      # tls/trino.pem + password.db from trino-auth-init.
      - trino_auth:/etc/trino/auth:ro
    environment:
      # Node-to-node secret; mandatory once client auth is enabled.
      # Referenced from config.properties as ${ENV:TRINO_SHARED_SECRET}.
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?Set TRINO_SHARED_SECRET in .env (openssl rand -hex 32)}
      HMS_URI: thrift://hive-metastore:9083
      # lake-s3 credentials for catalogs/iceberg.properties. The endpoint
      # itself is written in that file (http://lake-s3:9000).
      LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY:-trino}
      LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY:-trino-dev-only}
      # Postgres federation credentials are read from `.env` and
      # interpolated into catalog/*.properties via envsubst at container
      # start (see entrypoint override below).
      LITELLM_DB_USER: llmproxy
      LITELLM_DB_PASSWORD: dbpassword9090
      ROOFIX_DB_USER: ${ROOFIX_DB_USER:-roofix}
      ROOFIX_DB_PASSWORD: ${ROOFIX_DB_PASSWORD:-roofix}
      ROOFIX_DB_NAME: ${ROOFIX_DB_NAME:-roofix}
      SANDBOX_DB_USER: ${SANDBOX_DB_USER:-sandbox}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox}
      SANDBOX_DB_NAME: ${SANDBOX_DB_NAME:-sandbox}
      # Phoenix production Postgres (off-box, read-only role). Same vars
      # the Roofix bridge uses — one definition in .env feeds both.
      # Consumed by catalogs/postgres_phoenix.properties.
      PHOENIX_DB_HOST: ${PHOENIX_DB_HOST}
      PHOENIX_DB_PORT: ${PHOENIX_DB_PORT:-5432}
      PHOENIX_DB_NAME: ${PHOENIX_DB_NAME}
      PHOENIX_DB_USER: ${PHOENIX_DB_USER}
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD}
      PHOENIX_DB_SSLMODE: ${PHOENIX_DB_SSLMODE:-require}
      # Supabase Postgres for the AI agents project (off-box, TLS
      # required). Consumed by catalogs/supabase_ai_agents.properties.
      AI_AGENTS_DB_HOST: ${AI_AGENTS_DB_HOST}
      AI_AGENTS_DB_PORT: ${AI_AGENTS_DB_PORT:-5432}
      AI_AGENTS_DB_NAME: ${AI_AGENTS_DB_NAME:-postgres}
      AI_AGENTS_DB_USER: ${AI_AGENTS_DB_USER:-postgres}
      AI_AGENTS_DB_PASSWORD: ${AI_AGENTS_DB_PASSWORD}
      AI_AGENTS_DB_SSLMODE: ${AI_AGENTS_DB_SSLMODE:-require}
      # Supabase Postgres holding Enerflo lead data (off-box, TLS
      # required). Consumed by catalogs/supabase_enerflo_leads.properties.
      ENERFLO_LEADS_DB_HOST: ${ENERFLO_LEADS_DB_HOST}
      ENERFLO_LEADS_DB_PORT: ${ENERFLO_LEADS_DB_PORT:-5432}
      ENERFLO_LEADS_DB_NAME: ${ENERFLO_LEADS_DB_NAME:-postgres}
      ENERFLO_LEADS_DB_USER: ${ENERFLO_LEADS_DB_USER}
      ENERFLO_LEADS_DB_PASSWORD: ${ENERFLO_LEADS_DB_PASSWORD}
      ENERFLO_LEADS_DB_SSLMODE: ${ENERFLO_LEADS_DB_SSLMODE:-require}
      # Supabase Postgres for the Operations Assistant project (off-box, TLS
      # required). Consumed by catalogs/supabase_operations_assistant.properties.
      OPERATIONS_ASSISTANT_DB_HOST: ${OPERATIONS_ASSISTANT_DB_HOST}
      OPERATIONS_ASSISTANT_DB_PORT: ${OPERATIONS_ASSISTANT_DB_PORT:-5432}
      OPERATIONS_ASSISTANT_DB_NAME: ${OPERATIONS_ASSISTANT_DB_NAME:-postgres}
      OPERATIONS_ASSISTANT_DB_USER: ${OPERATIONS_ASSISTANT_DB_USER}
      OPERATIONS_ASSISTANT_DB_PASSWORD: ${OPERATIONS_ASSISTANT_DB_PASSWORD}
      OPERATIONS_ASSISTANT_DB_SSLMODE: ${OPERATIONS_ASSISTANT_DB_SSLMODE:-require}
      # Self-hosted Supabase Postgres (ai/supabase), on ai_shared — reached by
      # service DNS at supabase-db:5432, no TLS needed on-box. Credentials are
      # the read-only trino_reader role created by
      # ai/supabase/volumes/db/trino-reader.sql. Consumed by
      # catalogs/postgres_supabase.properties. An EMPTY password only fails
      # this one catalog; an UNSET ${ENV:…} would stop the whole coordinator,
      # which is why every value here carries a `:-` default.
      SUPABASE_POSTGRES_DB: ${SUPABASE_POSTGRES_DB:-postgres}
      SUPABASE_TRINO_READER_USER: ${SUPABASE_TRINO_READER_USER:-trino_reader}
      SUPABASE_TRINO_READER_PASSWORD: ${SUPABASE_TRINO_READER_PASSWORD:-}
      # The classifier's own Postgres (ai/classifier, classifier-db on
      # ai_shared) — job queue, references, per-call model usage. Read-only
      # trino_reader role from ai/classifier/db-init/10-trino-reader.sh.
      # Consumed by catalogs/postgres_classifier.properties. Same `:-`
      # reasoning as the Supabase pair: an empty password fails only this
      # catalog, an unset ${ENV:…} would stop the whole coordinator.
      CLASSIFIER_DB_NAME: ${CLASSIFIER_DB_NAME:-classifier}
      CLASSIFIER_TRINO_READER_PASSWORD: ${CLASSIFIER_TRINO_READER_PASSWORD:-}
      # AWS Glue Data Catalog + S3 (what Athena queries). Consumed by
      # catalogs/aws_glue.properties via the Hive connector.
      AWS_GLUE_REGION: ${AWS_GLUE_REGION:-us-east-1}
      AWS_GLUE_ACCESS_KEY_ID: ${AWS_GLUE_ACCESS_KEY_ID}
      AWS_GLUE_SECRET_ACCESS_KEY: ${AWS_GLUE_SECRET_ACCESS_KEY}
    # host.docker.internal is NOT defined by default on Linux Docker (only
    # Docker Desktop injects it). host-gateway maps it to the bridge
    # gateway IP so the postgres_litellm / postgres_sandbox catalogs can
    # reach the host-published ports 5432 / 5434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared
      - analytics_net
    depends_on:
      hive-metastore:
        condition: service_healthy
      trino-auth-init:
        condition: service_completed_successfully
    healthcheck:
      # Trino exposes /v1/info as soon as the coordinator is up. That's
      # earlier than /v1/status which requires the discovery loop to
      # complete on a single-node cluster. Stays on the internal HTTP
      # listener — /v1/info is a public resource and 8080 accepts
      # username-only auth (allow-insecure-over-http in config.properties).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 10

  # ── Trino MCP shim (LiteLLM-facing) ────────────────────────────────────
  # Thin FastAPI + FastMCP wrapper. Tools:
  #   list_catalogs, list_schemas, list_tables, describe_table, run_query
  # Guardrails on run_query: SELECT-only, LIMIT-clamped, timeout-clamped.
  # LiteLLM registers this at http://trino-mcp:8080/mcp (see
  # ai/litellm/litellm_config.yaml — mcp_servers.trino).
  trino-mcp:
    build:
      context: ../..
      dockerfile: ai/trino/Dockerfile.mcp
    container_name: trino-mcp
    restart: unless-stopped
    environment:
      TRINO_HOST: trino-coordinator
      TRINO_PORT: 8080
      TRINO_USER: trino-mcp
      TRINO_MCP_MAX_ROWS: ${TRINO_MCP_MAX_ROWS:-10000}
      TRINO_MCP_MAX_RUNTIME_S: ${TRINO_MCP_MAX_RUNTIME_S:-30}
      DEBUG_LOGGING: ${DEBUG_LOGGING:-false}
    networks:
      - shared
    depends_on:
      trino-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Superset metadata Postgres ─────────────────────────────────────────
  superset-db:
    image: postgres:16-alpine
    container_name: superset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    ports:
      - "${PORT_SUPERSET_DB:-5437}:5432"
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER:-superset}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Superset BI UI ─────────────────────────────────────────────────────
  # Built locally to preinstall the Trino SQLAlchemy driver + psycopg2 so
  # the first bootstrap can register the Trino connection non-interactively.
  #
  # Header-auth: SUPERSET_AUTH_TYPE=AUTH_REMOTE_USER trusts the
  # X-Auth-Request-Email header oauth2-proxy sets — no second sign-in.
  # See ai/trino/superset/superset_config.py for the trust boundary.
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset
    restart: unless-stopped
    ports:
      - "${PORT_SUPERSET:-8016}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME:-superset}
      # Bootstrap uses this to create a default Trino connection on first
      # run. Change here — no restart re-registration.
      TRINO_URL: trino://trino-mcp@trino-coordinator:8080
      # oauth2-proxy sets this on every authenticated request; Superset
      # trusts the header to identify the session user.
      SUPERSET_REMOTE_USER_HEADER: X-Auth-Request-Email
    networks:
      - shared
      - analytics_net
    depends_on:
      superset-db:
        condition: service_healthy
      trino-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  hive_metastore_db_data:
  # The warehouse objects (Parquet + Iceberg metadata under warehouse/).
  lake_s3_data:
  superset_db_data:
  # TLS keystore + password.db written by trino-auth-init, read by the
  # coordinator. Safe to delete — regenerates on next `up` (clients that
  # pinned the old cert fingerprint will need to re-trust).
  trino_auth:
