networks:
  shared:
    external: true
    name: ai_shared

services:
  # All vLLM services pin an explicit release tag instead of `latest`:
  # `up -d` never re-pulls a cached `latest`, so a new model / parser /
  # spec-decode method silently fails on a stale image (e.g.
  # `KeyError: 'invalid tool call parser: muse_glimmer'`). Bump the tag
  # deliberately, one service at a time, and re-check VLLM.md § versions.
  # vllm-llama:
  #   networks:
  #     - shared
  #   image: vllm/vllm-openai:v0.29.0
  #   container_name: vllm-llama
  #   restart: unless-stopped
  #   environment:
  #     - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
  #   ports:
  #     - "8003:8000"
  #   volumes:
  #     - vllm_data:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 120s
  #   command: >
  #     --model meta-llama/Llama-3.2-3B-Instruct
  #     --dtype float16
  #     --max-model-len 8192
  #     --gpu-memory-utilization 0.2
  qwen3.8:
    networks:
      - shared
    # Held at v0.27.1 — the build this service was running (as `latest`) before
    # the file moved to pinned tags. Bump to match the siblings once qwen3.8 has
    # been tried on v0.29.0 (Model Runner V2 + FlashInfer all-reduce defaults).
    image: vllm/vllm-openai:v0.27.1
    container_name: qwen3.8
    restart: unless-stopped
    shm_size: '8gb'
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
      - VLLM_USE_DEEP_GEMM=0
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    ports:
      - "${PORT_VLLM_QWEN38}:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
      - ../jinja/qwen_fixed_chat_template.jinja:/config/qwen_fixed_chat_template.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    command: >
      cyankiwi/Qwen3.8-27B-AWQ-INT4
      --served-model-name qwen3.8
      --tensor-parallel-size 2
      --dtype auto
      --max-model-len 131072
      --max-num-seqs 16
      --gpu-memory-utilization 0.90
      --enable-prefix-caching
      --enable-chunked-prefill
      --kv-cache-dtype auto
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --chat-template /config/qwen_fixed_chat_template.jinja

  qwen3.6:
    networks:
      - shared
    image: vllm/vllm-openai:v0.29.0
    container_name: qwen3.6
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
      - VLLM_USE_DEEP_GEMM=0
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    ports:
      - "${PORT_VLLM_QWEN36}:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    command: >
      cyankiwi/Qwen3.6-27B-AWQ-INT4
      --served-model-name qwen3.6
      --dtype auto
      --max-model-len 131072
      --max-num-seqs 3
      --gpu-memory-utilization 0.90
      --enable-prefix-caching
      --enable-chunked-prefill
      --kv-cache-dtype auto
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --default-chat-template-kwargs '{"enable_thinking": true,"preserve_thinking": true}'

  # Muse Glimmer 30B — Meta's dense 29.6B vision-language model (BF16, ~63 GB of
  # weights) sharded across two A6000s with TP=2, plus DFlash block-diffusion
  # speculative decoding via the official 3B drafter. Needs vLLM >= 0.28.0 —
  # the model, the muse_glimmer parsers, and DFlash2 all landed in that release;
  # v0.29.0 adds a DFlash draft RoPE-layout fix. A pre-0.28 image fails at
  # boot with `KeyError: 'invalid tool call parser: muse_glimmer'`.
  # Shares the same GPU pair as qwen3.8 at 0.90 utilisation: run one or the
  # other, not both. See VLLM.md § Muse Glimmer 30B.
  muse-glimmer:
    networks:
      - shared
    image: vllm/vllm-openai:v0.29.0
    container_name: muse-glimmer
    restart: unless-stopped
    shm_size: '8gb'
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
      - VLLM_USE_DEEP_GEMM=0
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    ports:
      - "${PORT_VLLM_MUSE_GLIMMER}:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # TP=2 takes the first two visible GPUs. To pin the NVLinked
              # pair explicitly, swap `count: all` for `device_ids: ['0', '1']`.
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      # Cold start pulls ~69 GB (target + drafter) then shards it — allow 10 min.
      start_period: 600s
    command: >
      meta-models/Muse-Glimmer-30B
      --served-model-name muse-glimmer
      --tensor-parallel-size 2
      --dtype auto
      --max-model-len 131072
      --max-num-seqs 16
      --gpu-memory-utilization 0.90
      --enable-prefix-caching
      --enable-chunked-prefill
      --kv-cache-dtype auto
      --generation-config auto
      --reasoning-parser muse_glimmer
      --enable-auto-tool-choice
      --tool-call-parser muse_glimmer
      --speculative-config '{"method":"dflash","model":"meta-models/Muse-Glimmer-30B-assistant","num_speculative_tokens":15}'

  vllm-qwen-vl:
    networks:
      - shared
    image: vllm/vllm-openai:v0.29.0
    container_name: vllm-qwen-vl
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    ports:
      - "${PORT_VLLM_QWEN_VL}:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --dtype float16
      --max-model-len 8192
      --gpu-memory-utilization 0.40
      --enforce-eager

volumes:
  vllm_data:
